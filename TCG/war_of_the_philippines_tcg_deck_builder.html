    function playSfx(type) {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        if (type === 'card_play') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(300, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(620, ctx.currentTime + 0.12);
          gain.gain.setValueAtTime(0.18, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.12);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(); osc.stop(ctx.currentTime + 0.12);
        } else if (type === 'attack') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(170, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(50, ctx.currentTime + 0.22);
          gain.gain.setValueAtTime(0.25, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.22);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(); osc.stop(ctx.currentTime + 0.22);
        } else if (type === 'skill') {
          [440, 554, 659, 880].forEach((f, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(f, ctx.currentTime + i * 0.05);
            gain.gain.setValueAtTime(0.18, ctx.currentTime + i * 0.05);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + i * 0.05 + 0.22);
            osc.connect(gain); gain.connect(ctx.destination);
            osc.start(ctx.currentTime + i * 0.05); osc.stop(ctx.currentTime + i * 0.05 + 0.22);
          });
        }
      } catch (e) {}
    }
    window.playSfx = playSfx;

    function discoverLocalLanIp() {
      try {
        const RTCPC = window.RTCPeerConnection || window.webkitRTCPeerConnection;
        if (!RTCPC) return;
        const pc = new RTCPC({ iceServers: [] });
        pc.createDataChannel('lan-ip-probe');
        pc.createOffer().then(offer => pc.setLocalDescription(offer)).catch(() => {});
        pc.onicecandidate = (event) => {
          if (!event || !event.candidate || !event.candidate.candidate) return;
          const match = event.candidate.candidate.match(/([0-9]{1,3}(\.[0-9]{1,3}){3})/);
          if (match && match[1] && !match[1].startsWith('127.')) {
            state.myLanIp = match[1];
            render();
            try { pc.close(); } catch(e){}
          }
        };
      } catch (e) {}
    }

    async function resolveMyIp() {
      discoverLocalLanIp();
      let detectedWan = null;
      const endpoints = [
        'https://api.ipify.org?format=json',
        'https://api64.ipify.org?format=json',
        'https://httpbin.org/ip'
      ];

      for (const url of endpoints) {
        try {
          const res = await fetch(url, { cache: 'no-cache' });
          if (res.ok) {
            const data = await res.json();
            const ip = data.ip || (data.origin ? data.origin.split(',')[0].trim() : null);
            if (ip) {
              detectedWan = ip;
              break;
            }
          }
        } catch (e) {}
      }

      if (detectedWan) {
        state.myWanIp = detectedWan;
        state.myIpAddress = detectedWan;
        if (state.networkRole === 'HOST' && state.networkStatus === 'IDLE') {
          state.hostIpAddress = detectedWan;
          state.onlineRoomCode = detectedWan;
        }
        if (!state.targetHostIpInput || state.targetHostIpInput.includes('Detecting')) {
          state.targetHostIpInput = detectedWan;
          state.networkRoomInput = detectedWan;
        }
      } else {
        const fallback = state.myLanIp || '192.168.1.100';
        state.myWanIp = fallback;
        state.myIpAddress = fallback;
        if (state.networkRole === 'HOST' && state.networkStatus === 'IDLE') {
          state.hostIpAddress = fallback;
          state.onlineRoomCode = fallback;
        }
        if (!state.targetHostIpInput) {
          state.targetHostIpInput = fallback;
          state.networkRoomInput = fallback;
        }
      }
      render();
    }
    resolveMyIp();
    window.resolveMyIp = resolveMyIp;

    async function sendRelayMessage(channelKey, payload) {
      try {
        const url = `https://ntfy.sh/tcg_wan_${sanitizeIpKey(channelKey)}`;
        await fetch(url, {
          method: 'POST',
          body: JSON.stringify(payload),
          headers: { 'Content-Type': 'application/json' }
        });
      } catch (e) {}
    }

    function initRelayListener(channelKey) {
      if (relayEventSource) {
        try { relayEventSource.close(); } catch(e){}
      }
      if (pollInterval) {
        clearInterval(pollInterval);
      }

      try {
        const sseUrl = `https://ntfy.sh/tcg_wan_${sanitizeIpKey(channelKey)}/sse`;
        relayEventSource = new EventSource(sseUrl);
        relayEventSource.onmessage = (e) => {
          try {
            const data = JSON.parse(e.data);
            if (data && data.message) {
              const msg = JSON.parse(data.message);
              handleIncomingNetworkMessage(msg);
            }
          } catch (err) {}
        };
        relayEventSource.onerror = () => {
          startRelayPoll(channelKey);
        };
      } catch (err) {
        startRelayPoll(channelKey);
      }
    }

    let lastPollTime = Math.floor(Date.now() / 1000) - 5;
    function startRelayPoll(channelKey) {
      if (pollInterval) clearInterval(pollInterval);
      pollInterval = setInterval(async () => {
        try {
          const res = await fetch(`https://ntfy.sh/tcg_wan_${sanitizeIpKey(channelKey)}/json?poll=1&since=${lastPollTime}`);
          if (res.ok) {
            const text = await res.text();
            const lines = text.trim().split('\n');
            lines.forEach(line => {
              if (!line) return;
              try {
                const item = JSON.parse(line);
                if (item && item.time) lastPollTime = Math.max(lastPollTime, item.time);
                if (item && item.message) {
                  const msg = JSON.parse(item.message);
                  handleIncomingNetworkMessage(msg);
                }
              } catch (e) {}
            });
          }
        } catch (e) {}
      }, 1200);
    }

    function sendP2PMessage(payload) {
      if (localBroadcast) {

      }

    async function joinNetworkRoom() {
      const rawInput = (state.targetHostIpInput || state.networkRoomInput || state.myWanIp || '').trim();

        state.networkError = "Please enter the Host's Wi-Fi WAN IP address (e.g. 112.198.50.21).";

      state.networkError = null;

      state.guestIpAddress = state.myWanIp || state.myLanIp || 'Client Wi-Fi Peer';

      initRelayListener(rawInput);

      sendP2PMessage({
        type: 'REQUEST_JOIN',
        roomCode: rawInput,
        guestId: currentUser?.uid || ('guest_' + Math.random().toString(36).substring(2, 8)),
        guestHeroId: state.p2Hero.id,

      const user = await ensureAuth();

          const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', sanitizeIpKey(rawInput));

            if (existingData.hostHeroId) {
              state.p1Hero = HEROES_DATABASE.find(h => h.id === existingData.hostHeroId) || state.p1Hero;
            }
            if (existingData.hostIp) {

            await setDoc(roomRef, {

              guestIp: state.guestIpAddress,
              status: 'CONNECTED',

      setTimeout(() => {

    function handleRoomSnapshotUpdate(data) {
      if (!data) return;

      if (data.status === 'CONNECTED') {
        state.networkStatus = 'CONNECTED';
        if (data.guestHeroId) {
          state.p2Hero = HEROES_DATABASE.find(h => h.id === data.guestHeroId) || state.p2Hero;

        if (data.hostHeroId) {

        if (data.hostIp) state.hostIpAddress = data.hostIp;

        render();

    function handleIncomingNetworkMessage(msg) {
      if (!msg) return;

      if (msg.type === 'REQUEST_JOIN' && state.networkRole === 'HOST') {
        state.networkStatus = 'CONNECTED';
        if (msg.guestIp) state.guestIpAddress = msg.guestIp;
        if (msg.guestHeroId) state.p2Hero = HEROES_DATABASE.find(h => h.id === msg.guestHeroId) || state.p2Hero;
        
        sendP2PMessage({
          type: 'JOIN_ACCEPTED',
          hostHeroId: state.p1Hero.id,
          gridSize: state.gridSize,
          hostIp: state.hostIpAddress
        });
        render();
      } else if (msg.type === 'JOIN_ACCEPTED' && state.networkRole === 'CLIENT') {
        state.networkStatus = 'CONNECTED';
        if (msg.hostHeroId) state.p1Hero = HEROES_DATABASE.find(h => h.id === msg.hostHeroId) || state.p1Hero;
        if (msg.gridSize) state.gridSize = msg.gridSize;
        if (msg.hostIp) state.hostIpAddress = msg.hostIp;
        render();
      } else if (msg.type === 'GRID_CHANGED') {
        state.gridSize = msg.gridSize;
        render();
      } else if (msg.type === 'HERO_SELECTED') {
        if (msg.role === 'HOST') {
          state.p1Hero = HEROES_DATABASE.find(h => h.id === msg.heroId) || state.p1Hero;
        } else {
          state.p2Hero = HEROES_DATABASE.find(h => h.id === msg.heroId) || state.p2Hero;
        }
        render();
      } else if (msg.type === 'START_MATCH') {
        if (msg.hero1Id) state.p1Hero = HEROES_DATABASE.find(h => h.id === msg.hero1Id) || state.p1Hero;
        if (msg.hero2Id) state.p2Hero = HEROES_DATABASE.find(h => h.id === msg.hero2Id) || state.p2Hero;
        if (msg.gridSize) state.gridSize = msg.gridSize;
        state.gameMode = 'NETWORK_2P';
        startMatch(state.p1Hero);
      } else if (msg.type === 'SYNC_STATE') {
        applyRemoteGameState(msg.gameState);
      } else if (msg.type === 'CONCEDE_MATCH') {
        state.victoryData = msg.victoryData;
        state.view = 'VICTORY';
        state.showGameOptionsModal = false;
        render();
      } else if (msg.type === 'CHAT_MESSAGE') {
        if (msg.senderSessionId === state.sessionId) return;
        if (msg.id && state.chatMessages.some(m => m.id === msg.id)) return;

        state.chatMessages.push({
          id: msg.id || ('msg_' + Date.now()),
          senderRole: msg.senderRole,
          senderName: msg.senderName,
          text: msg.text,
          time: msg.time || new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          isMe: false
        });

        if (!state.isChatOpen) {
          state.unreadChatCount = (state.unreadChatCount || 0) + 1;
        }
        playSfx('card_play');
        render();
        setTimeout(() => {
          const el = document.getElementById('chat-history-container');
          if (el) el.scrollTop = el.scrollHeight;
        }, 50);
      }
    }

    function sendChatMessage(text) {
      const msgText = (typeof text === 'string' ? text : state.chatInput || '').trim();
      if (!msgText) return;

      const myRole = state.networkRole;
      const myHero = myRole === 'HOST' ? state.p1Hero.name : state.p2Hero.name;
      const now = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const uniqueMsgId = 'msg_' + Date.now() + '_' + Math.random().toString(36).substring(2, 7);

      const msgObj = {
        id: uniqueMsgId,
        senderSessionId: state.sessionId,
        senderRole: myRole,
        senderName: myHero,
        text: msgText,
        time: now
      };

      state.chatMessages.push({ ...msgObj, isMe: true });
      state.chatInput = '';
      render();

      sendP2PMessage({ type: 'CHAT_MESSAGE', ...msgObj });

      setTimeout(() => {
        const el = document.getElementById('chat-history-container');
        if (el) el.scrollTop = el.scrollHeight;
      }, 50);
    }
    window.sendChatMessage = sendChatMessage;

    function toggleChat(force) {
      state.isChatOpen = force !== undefined ? force : !state.isChatOpen;
      if (state.isChatOpen) state.unreadChatCount = 0;
      render();
      if (state.isChatOpen) {
        setTimeout(() => {
          const el = document.getElementById('chat-history-container');
          if (el) el.scrollTop = el.scrollHeight;
          const input = document.getElementById('chat-input-field');
          if (input) input.focus();
        }, 50);
      }
    }
    window.toggleChat = toggleChat;

    async function updateNetworkHeroSelection(heroId) {
      if (state.networkRole === 'HOST') {
        state.p1Hero = HEROES_DATABASE.find(h => h.id === heroId) || state.p1Hero;
      } else {
        state.p2Hero = HEROES_DATABASE.find(h => h.id === heroId) || state.p2Hero;
      }
      render();

      sendP2PMessage({ type: 'HERO_SELECTED', role: state.networkRole, heroId: heroId });

      const user = await ensureAuth();
      if (db && user && state.onlineRoomCode && state.networkStatus !== 'IDLE') {
        try {
          const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', sanitizeIpKey(state.onlineRoomCode));
          const updateData = state.networkRole === 'HOST' ? { hostHeroId: heroId } : { guestHeroId: heroId };
          await setDoc(roomRef, { ...updateData, lastUpdated: Date.now() }, { merge: true });
        } catch (e) {}
      }
    }
    window.updateNetworkHeroSelection = updateNetworkHeroSelection;

    function applyRemoteGameState(remote) {
      if (!remote) return;
      state.board = remote.board || state.board;
      state.units = remote.units || state.units;
      state.currentTurn = remote.currentTurn;
      state.turnNumber = remote.turnNumber;
      state.p1Kalayaan = remote.p1Kalayaan;
      state.p2Kalayaan = remote.p2Kalayaan;
      state.p1DominionTotal = remote.p1DominionTotal;
      state.p2DominionTotal = remote.p2DominionTotal;
      state.gameLogs = remote.gameLogs || state.gameLogs;
      state.view = remote.view || 'PLAYING';
      state.victoryData = remote.victoryData || null;

      if (state.networkRole === 'HOST') {
        if (remote.p2Hand) state.p2Hand = remote.p2Hand;
      } else {
        if (remote.p1Hand) state.p1Hand = remote.p1Hand;
      }
      render();
    }

    async function broadcastGameState() {
      if (state.gameMode !== 'NETWORK_2P') return;

      const payload = {
        board: state.board,
        units: state.units,
        currentTurn: state.currentTurn,
        turnNumber: state.turnNumber,
        p1Kalayaan: state.p1Kalayaan,
        p2Kalayaan: state.p2Kalayaan,
        p1DominionTotal: state.p1DominionTotal,
        p2DominionTotal: state.p2DominionTotal,
        p1Hand: state.p1Hand,
        p2Hand: state.p2Hand,
        gameLogs: state.gameLogs,
        view: state.view,
        victoryData: state.victoryData
      };

      sendP2PMessage({ type: 'SYNC_STATE', gameState: payload });

      const user = await ensureAuth();
      if (db && user && state.onlineRoomCode) {
        try {
          const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', sanitizeIpKey(state.onlineRoomCode));
          await setDoc(roomRef, {
            status: 'PLAYING',
            gameState: payload,
            lastUpdated: Date.now()
          }, { merge: true });
        } catch (e) {}
      }
    }

    function startMatch(heroChoice) {
      if (heroChoice) state.p1Hero = heroChoice;
      if (state.gameMode === 'AI') {
        if (state.selectedDifficulty === 'EASY') {
          state.gridSize = 5;
          state.p2Hero = HEROES_DATABASE[15];
        } else if (state.selectedDifficulty === 'MODERATE') {
          state.gridSize = 7;
          state.p2Hero = HEROES_DATABASE[7];
        } else if (state.selectedDifficulty === 'HARD') {
          state.gridSize = 9;
          state.p2Hero = HEROES_DATABASE[0];
        } else {
          state.gridSize = 12;
          state.p2Hero = HEROES_DATABASE[4];
        }
      }

      const board = [];
      for (let r = 0; r < state.gridSize; r++) {
        for (let c = 0; c < state.gridSize; c++) {
          const landIdx = (r * state.gridSize + c) % LANDS_DATABASE.length;
          board.push({
            r, c,
            land: LANDS_DATABASE[landIdx],
            controlledBy: null
          });
        }
      }

      const p1StartR = state.gridSize - 1;
      const p1StartC = Math.floor(state.gridSize / 2);
      const p2StartR = 0;
      const p2StartC = Math.floor(state.gridSize / 2);

      const units = [
        {
          id: 'u_p1_hero', owner: 1, type: 'HERO', card: { ...state.p1Hero },
          r: p1StartR, c: p1StartC, currentHp: state.p1Hero.hp, actionsLeft: 1,
          statuses: { poison: 0, bleed: 0, sleep: 0, paralyze: 0 },
          equipments: []
        },
        {
          id: 'u_p2_hero', owner: 2, type: 'HERO', card: { ...state.p2Hero },
          r: p2StartR, c: p2StartC, currentHp: state.p2Hero.hp, actionsLeft: 1,
          statuses: { poison: 0, bleed: 0, sleep: 0, paralyze: 0 },
          equipments: []
        }
      ];

      board.find(t => t.r === p1StartR && t.c === p1StartC).controlledBy = 1;
      board.find(t => t.r === p2StartR && t.c === p2StartC).controlledBy = 2;

      const deck1 = [...state.customDeck].sort(() => Math.random() - 0.5);
      const deck2 = [...defaultDeck].sort(() => Math.random() - 0.5);

      state.board = board;
      state.units = units;
      state.p1Deck = deck1.slice(4);
      state.p1Hand = deck1.slice(0, 4);
      state.p2Deck = deck2.slice(4);
      state.p2Hand = deck2.slice(0, 4);
      state.p1Kalayaan = 5;
      state.p2Kalayaan = 5;
      state.p1DominionTotal = 0;
      state.p2DominionTotal = 0;
      state.currentTurn = 1;
      state.turnNumber = 1;
      state.gameLogs = [];
      state.selectedUnitId = null;
      state.selectedHandCardIndex = null;
      state.validMoves = [];
      state.validAttacks = [];
      state.validCardPlacements = [];
      state.validEventTargets = [];
      state.validEquipTargets = [];
      state.showGameOptionsModal = false;
      state.activeCardPreview = state.p1Hero;
      state.view = 'PLAYING';

      addLog(`⚔️ Duel commenced on a ${state.gridSize}x${state.gridSize} battlefield!`);

      if (state.gameMode === 'NETWORK_2P' && state.networkRole === 'HOST') {
        sendP2PMessage({
          type: 'START_MATCH',
          hero1Id: state.p1Hero.id,
          hero2Id: state.p2Hero.id,
          gridSize: state.gridSize
        });
        broadcastGameState();
      }

      render();
    }
    window.startMatch = startMatch;

    function toggleGameOptionsModal(show) {
      state.showGameOptionsModal = show !== undefined ? show : !state.showGameOptionsModal;
      render();
    }
    window.toggleGameOptionsModal = toggleGameOptionsModal;

    function surrenderMatch() {
      let winnerName = '';
      let surrenderReason = '';

      if (state.gameMode === 'NETWORK_2P') {
        if (state.networkRole === 'HOST') {
          winnerName = state.p2Hero.name;
          surrenderReason = `Commander ${state.p1Hero.name} (Player 1) conceded the duel. Victory goes to ${state.p2Hero.name}!`;
        } else {
          winnerName = state.p1Hero.name;
          surrenderReason = `Commander ${state.p2Hero.name} (Player 2) conceded the duel. Victory goes to ${state.p1Hero.name}!`;
        }
      } else if (state.gameMode === 'AI') {
        winnerName = state.p2Hero.name;
        surrenderReason = `Commander ${state.p1Hero.name} conceded the battlefield to the AI!`;
      } else {
        if (state.currentTurn === 1) {
          winnerName = state.p2Hero.name;
          surrenderReason = `Player 1 (${state.p1Hero.name}) conceded the duel.`;
        } else {
          winnerName = state.p1Hero.name;
          surrenderReason = `Player 2 (${state.p2Hero.name}) conceded the duel.`;
        }
      }

      state.victoryData = { winner: winnerName, reason: surrenderReason };
      state.showGameOptionsModal = false;
      state.view = 'VICTORY';

      if (state.gameMode === 'NETWORK_2P') {
        sendP2PMessage({ type: 'CONCEDE_MATCH', victoryData: state.victoryData });
        broadcastGameState();
      }
      render();
    }
    window.surrenderMatch = surrenderMatch;

    function quitToMenu() {
      state.showGameOptionsModal = false;
      state.view = 'MENU';
      render();
    }
    window.quitToMenu = quitToMenu;

    function simulatePlayer2Join() {
      state.networkStatus = 'CONNECTED';
      const potentialOpponents = HEROES_DATABASE.filter(h => h.id !== state.p1Hero.id);
      state.p2Hero = potentialOpponents[Math.floor(Math.random() * potentialOpponents.length)] || HEROES_DATABASE[1];
      state.guestIpAddress = '192.168.1.' + Math.floor(10 + Math.random() * 80) + ' (LAN Peer)';
      addLog(`🌐 Challenger joined room ${state.onlineRoomCode} from IP ${state.guestIpAddress}!`);
      render();
    }
    window.simulatePlayer2Join = simulatePlayer2Join;

    function copyRoomCodeToClipboard() {
      try {
        const temp = document.createElement('input');
        temp.value = state.onlineRoomCode;
        document.body.appendChild(temp);
        temp.select();
        document.execCommand('copy');
        document.body.removeChild(temp);
        state.copiedCodeMessage = true;
        render();
        setTimeout(() => {
          state.copiedCodeMessage = false;
          render();
        }, 2200);
      } catch (e) {}
    }
    window.copyRoomCodeToClipboard = copyRoomCodeToClipboard;

    function calculateValidActions(unit) {
      if (!unit || unit.owner !== state.currentTurn) return;
      if (state.gameMode === 'NETWORK_2P') {
        if (state.networkRole === 'HOST' && state.currentTurn !== 1) return;
        if (state.networkRole === 'CLIENT' && state.currentTurn !== 2) return;
      }
      const moves = [];
      const attacks = [];
      if ((unit.actionsLeft || 0) <= 0) {
        state.validMoves = [];
        state.validAttacks = [];
        return;
      }
      const maxMove = unit.card.move || 1;
      for (let r = 0; r < state.gridSize; r++) {
        for (let c = 0; c < state.gridSize; c++) {
          const dist = Math.abs(r - unit.r) + Math.abs(c - unit.c);
          if (dist > 0 && dist <= maxMove) {
            const occ = state.units.find(u => u.r === r && u.c === c);
            if (!occ) {
              moves.push({ r, c });
            } else if (occ.owner !== unit.owner) {
              attacks.push({ r, c });
            }
          }
        }
      }
      state.validMoves = moves;
      state.validAttacks = attacks;
    }
    window.calculateValidActions = calculateValidActions;

    function executeEventCast(r, c) {
      const isP1 = state.currentTurn === 1;
      const hand = isP1 ? state.p1Hand : state.p2Hand;
      const card = hand[state.selectedHandCardIndex];
      if (!card) return;

      const targetUnit = state.units.find(u => u.r === r && u.c === c);
      if (!targetUnit) return;

      const cost = card.cost || 1;
      if (isP1) state.p1Kalayaan -= cost;
      else state.p2Kalayaan -= cost;

      hand.splice(state.selectedHandCardIndex, 1);
      state.graveyard.push(card);

      playSfx('skill');

      targetUnit.card.atk = (targetUnit.card.atk || 5) + 2;
      targetUnit.card.def = (targetUnit.card.def || 2) + 1;
      targetUnit.currentHp = Math.min((targetUnit.card.hp || 20) + 6, targetUnit.currentHp + 4);
      targetUnit.actionsLeft = 1;
      targetUnit.statuses = { poison: 0, bleed: 0, sleep: 0, paralyze: 0 };

      const unitRole = targetUnit.type === 'HERO' ? 'Hero Commander' : 'Mythos';
      addLog(`✨ Cast [${card.name}] on ${unitRole} ${targetUnit.card.name}! (+2 ATK, +1 DEF, +4 HP, cleansed, refreshed)`);

      state.selectedHandCardIndex = null;
      state.validEventTargets = [];
      state.validEquipTargets = [];
      state.validCardPlacements = [];

      if (state.gameMode === 'NETWORK_2P') broadcastGameState();
      render();
    }

    function executeEquipmentAttach(r, c) {
      const isP1 = state.currentTurn === 1;
      const hand = isP1 ? state.p1Hand : state.p2Hand;
      const card = hand[state.selectedHandCardIndex];
      if (!card) return;

      const targetUnit = state.units.find(u => u.r === r && u.c === c);
      if (!targetUnit) return;

      if (!targetUnit.equipments) targetUnit.equipments = [];
      const maxSlots = targetUnit.type === 'HERO' ? 2 : 1;

      if (targetUnit.equipments.length >= maxSlots) {
        addLog(`⚠️ Maximum equipment capacity reached for ${targetUnit.card.name} (${maxSlots} max).`);
        state.selectedHandCardIndex = null;
        state.validEquipTargets = [];
        render();
        return;
      }

      const cost = card.cost || 1;
      if (isP1) state.p1Kalayaan -= cost;
      else state.p2Kalayaan -= cost;

      hand.splice(state.selectedHandCardIndex, 1);

      playSfx('skill');

      targetUnit.card.atk = (targetUnit.card.atk || 5) + (card.atkBoost || 0);
      targetUnit.card.def = (targetUnit.card.def || 2) + (card.defBoost || 0);
      targetUnit.currentHp += (card.hpBoost || 0);
      targetUnit.statuses = { poison: 0, bleed: 0, sleep: 0, paralyze: 0 };

      targetUnit.equipments.push({
        id: card.id,
        name: card.name,
        atkBoost: card.atkBoost || 0,
        defBoost: card.defBoost || 0,
        hpBoost: card.hpBoost || 0,
        turnsRemaining: card.duration || 2,
        passive: card.passive,
        avatarSymbol: card.avatarSymbol || '🛡️'
      });

      const slotMsg = `${targetUnit.equipments.length}/${maxSlots}`;
      addLog(`🛡️ Equipped [${card.name}] onto ${targetUnit.card.name}! [Slot ${slotMsg}] (+${card.atkBoost} ATK, +${card.defBoost} DEF, +${card.hpBoost} HP).`);

      state.selectedHandCardIndex = null;
      state.validEquipTargets = [];
      state.validEventTargets = [];
      state.validCardPlacements = [];

      if (state.gameMode === 'NETWORK_2P') broadcastGameState();
      render();
    }

    function handleTileClick(r, c) {
      if (state.gameMode === 'NETWORK_2P') {
        if (state.networkRole === 'HOST' && state.currentTurn !== 1) {
          addLog("⏳ Waiting for Player 2's turn to complete...");
          return;
        }
        if (state.networkRole === 'CLIENT' && state.currentTurn !== 2) {
          addLog("⏳ Waiting for Player 1's turn to complete...");
          return;
        }
      }

      // Casting Equipment cards onto Hero or Mythos
      if (state.selectedHandCardIndex !== null && state.validEquipTargets && state.validEquipTargets.length > 0) {
        const isEquipTarget = state.validEquipTargets.some(t => t.r === r && t.c === c);
        if (isEquipTarget) {
          executeEquipmentAttach(r, c);
          return;
        }
      }

      // Casting Event cards onto Hero or Mythos
      if (state.selectedHandCardIndex !== null && state.validEventTargets && state.validEventTargets.length > 0) {
        const isEventTarget = state.validEventTargets.some(t => t.r === r && t.c === c);
        if (isEventTarget) {
          executeEventCast(r, c);
          return;
        }
      }

      // Placing card from hand (Monster / Land)
      if (state.selectedHandCardIndex !== null && state.validCardPlacements && state.validCardPlacements.length > 0) {
        const isPlace = state.validCardPlacements.some(p => p.r === r && p.c === c);
        if (isPlace) {
          executeCardPlacement(r, c);
          return;
        }
      }

      // Unit movement and attack handling
      if (state.selectedUnitId) {
        const unit = state.units.find(u => u.id === state.selectedUnitId);
        if (unit && unit.owner === state.currentTurn && (unit.actionsLeft || 0) > 0) {
          const isMove = state.validMoves.some(m => m.r === r && m.c === c);
          const isAttack = state.validAttacks.some(a => a.r === r && a.c === c);

          if (isMove) {
            unit.r = r;
            unit.c = c;
            unit.actionsLeft = 0;
            const tile = state.board.find(t => t.r === r && t.c === c);
            if (tile) tile.controlledBy = unit.owner;
            addLog(`🚩 ${unit.card.name} advanced to (${r + 1}, ${c + 1}) and captured territory!`);
            playSfx('card_play');
            state.selectedUnitId = null;
            state.validMoves = [];
            state.validAttacks = [];
            if (state.gameMode === 'NETWORK_2P') broadcastGameState();
            render();
            return;
          }

          if (isAttack) {
            const defender = state.units.find(u => u.r === r && u.c === c && u.owner !== unit.owner);
            if (defender) {
              const atkVal = unit.card.atk || 5;
              const defVal = defender.card.def || 2;
              const damage = Math.max(1, atkVal - Math.floor(defVal / 3));
              defender.currentHp -= damage;
              unit.actionsLeft = 0;
              playSfx('attack');
              addLog(`⚔️ ${unit.card.name} struck ${defender.card.name} for ${damage} damage!`);

              if (defender.currentHp <= 0) {
                state.units = state.units.filter(u => u.id !== defender.id);
                state.graveyard.push(defender.card);
                addLog(`💀 ${defender.card.name} was vanquished on the battlefield!`);
                if (defender.type === 'HERO') {
                  const winner = unit.owner === 1 ? state.p1Hero.name : state.p2Hero.name;
                  state.victoryData = { winner, reason: 'HERO CHECKMATE: Enemy Commander slain!' };
                  state.view = 'VICTORY';
                }
              }
              state.selectedUnitId = null;
              state.validMoves = [];
              state.validAttacks = [];
              if (state.gameMode === 'NETWORK_2P') broadcastGameState();
              render();
              return;
            }
          }
        }
      }

      // Unit selection
      const occupant = state.units.find(u => u.r === r && u.c === c);
      if (occupant) {
        state.activeCardPreview = occupant.card;
        if (occupant.owner === state.currentTurn) {
          state.selectedUnitId = occupant.id;
          calculateValidActions(occupant);
        } else {
          state.selectedUnitId = null;
          state.validMoves = [];
          state.validAttacks = [];
        }
      } else {
        const tile = state.board.find(t => t.r === r && t.c === c);
        if (tile && tile.land) state.activeCardPreview = tile.land;
        state.selectedUnitId = null;
        state.validMoves = [];
        state.validAttacks = [];
      }
      render();
    }
    window.handleTileClick = handleTileClick;

    function playCardFromHand(idx) {
      if (state.gameMode === 'NETWORK_2P') {
        if (state.networkRole === 'HOST' && state.currentTurn !== 1) return;
        if (state.networkRole === 'CLIENT' && state.currentTurn !== 2) return;
      }

      if (state.selectedHandCardIndex === idx) {
        state.selectedHandCardIndex = null;
        state.validCardPlacements = [];
        state.validEventTargets = [];
        state.validEquipTargets = [];
        render();
        return;
      }

      const hand = state.currentTurn === 1 ? state.p1Hand : state.p2Hand;
      const card = hand[idx];
      if (!card) return;

      const kalayaan = state.currentTurn === 1 ? state.p1Kalayaan : state.p2Kalayaan;
      if (kalayaan < (card.cost || 1)) {
        addLog(`⚠️ Not enough Kalayaan Energy! Requires ⚡${card.cost || 1}.`);
        return;
      }

      state.selectedHandCardIndex = idx;
      state.activeCardPreview = card;
      state.validCardPlacements = [];
      state.validEventTargets = [];
      state.validEquipTargets = [];

      // Equipment Card Play: Highlights allied units with free slots
      if (card.id && card.id.startsWith('eq')) {
        const friendlyUnits = state.units.filter(u => u.owner === state.currentTurn);
        const validTargets = friendlyUnits.filter(u => {
          const maxSlots = u.type === 'HERO' ? 2 : 1;
          const currentCount = (u.equipments || []).length;
          return currentCount < maxSlots;
        });

        if (validTargets.length === 0) {
          addLog(`⚠️ No allied units have available equipment slots (Supreme Commanders: 2 max, Mythos: 1 max)!`);
          state.selectedHandCardIndex = null;
          render();
          return;
        }

        state.validEquipTargets = validTargets.map(u => ({ r: u.r, c: u.c, unitId: u.id }));
        addLog(`🛡️ Select an allied unit to equip [${card.name}]!`);
        render();
        return;
      }

      // Draw Event Cards
      if (card.drawAmount) {
        if (state.currentTurn === 1) {
          state.p1Kalayaan -= (card.cost || 1);
          state.p1Hand.splice(idx, 1);
          for (let i = 0; i < card.drawAmount && state.p1Deck.length > 0; i++) {
            state.p1Hand.push(state.p1Deck.shift());
          }
        } else {
          state.p2Kalayaan -= (card.cost || 1);
          state.p2Hand.splice(idx, 1);
          for (let i = 0; i < card.drawAmount && state.p2Deck.length > 0; i++) {
            state.p2Hand.push(state.p2Deck.shift());
          }
        }
        state.selectedHandCardIndex = null;
        playSfx('card_play');
        addLog(`📜 Event ${card.name} triggered! Drew ${card.drawAmount} extra cards.`);
        if (state.gameMode === 'NETWORK_2P') broadcastGameState();
        render();
        return;
      }

      // Tactical / Blessing Event Cards that cast on Hero & Mythos units
      if (!card.hp && !card.category) {
        const friendlyUnits = state.units.filter(u => u.owner === state.currentTurn);
        if (friendlyUnits.length === 0) {
          addLog(`⚠️ No allied units (Hero or Mythos) on the battlefield to target!`);
          state.selectedHandCardIndex = null;
          render();
          return;
        }

        state.validEventTargets = friendlyUnits.map(u => ({ r: u.r, c: u.c, unitId: u.id }));
        addLog(`🎯 Select a friendly Hero or Mythos unit to cast [${card.name}]!`);
        render();
        return;
      }

      // Monster or Land placement
      const placements = [];
      for (let r = 0; r < state.gridSize; r++) {
        for (let c = 0; c < state.gridSize; c++) {
          const occ = state.units.find(u => u.r === r && u.c === c);
          if (card.hp && !occ) placements.push({ r, c });
          else if (card.category) placements.push({ r, c });
        }
      }
      state.validCardPlacements = placements;
      render();
    }
    window.playCardFromHand = playCardFromHand;

    function executeCardPlacement(r, c) {
      const hand = state.currentTurn === 1 ? state.p1Hand : state.p2Hand;
      const card = hand[state.selectedHandCardIndex];
      if (!card) return;

      if (state.currentTurn === 1) state.p1Kalayaan -= (card.cost || 1);
      else state.p2Kalayaan -= (card.cost || 1);
      hand.splice(state.selectedHandCardIndex, 1);

      if (card.hp) {
        state.units.push({
          id: 'u_' + Math.random().toString(36).substring(2, 7),
          owner: state.currentTurn,
          type: 'MONSTER',
          card: { ...card },
          r, c,
          currentHp: card.hp,
          actionsLeft: 0,
          statuses: { poison: 0, bleed: 0, sleep: 0, paralyze: 0 },
          equipments: []
        });
        const tile = state.board.find(t => t.r === r && t.c === c);
        if (tile) tile.controlledBy = state.currentTurn;
        addLog(`🐉 Summoned Mythos ${card.name} at (${r+1}, ${c+1})!`);
      } else if (card.category) {
        const tile = state.board.find(t => t.r === r && t.c === c);
        if (tile) {
          tile.land = card;
          tile.controlledBy = state.currentTurn;
        }
        if (state.currentTurn === 1) state.p1Kalayaan += (card.energyBonus || 1);
        else state.p2Kalayaan += (card.energyBonus || 1);
        addLog(`🏔️ Built ${card.name} territory! (+${card.energyBonus || 1} Kalayaan bonus).`);
      }

      state.selectedHandCardIndex = null;
      state.validCardPlacements = [];
      state.validEventTargets = [];
      state.validEquipTargets = [];
      playSfx('card_play');
      if (state.gameMode === 'NETWORK_2P') broadcastGameState();
      render();
    }

    function endTurn() {
      if (state.gameMode === 'NETWORK_2P') {
        if (state.networkRole === 'HOST' && state.currentTurn !== 1) return;
        if (state.networkRole === 'CLIENT' && state.currentTurn !== 2) return;
      }

      playSfx('card_play');
      const p1Tiles = state.board.filter(t => t.controlledBy === 1);
      const p2Tiles = state.board.filter(t => t.controlledBy === 2);
      state.p1DominionTotal += p1Tiles.reduce((a, t) => a + (t.land?.dominionValue || 1), 0);
      state.p2DominionTotal += p2Tiles.reduce((a, t) => a + (t.land?.dominionValue || 1), 0);

      // Decrement equipment turn counters
      state.units.forEach(u => {
        if (u.equipments && u.equipments.length > 0) {
          u.equipments.forEach(eq => {
            if (eq.turnsRemaining > 0) eq.turnsRemaining--;
          });
        }
      });

      if (state.p1DominionTotal >= 100) {
        state.victoryData = { winner: state.p1Hero.name, reason: 'DOMINION SUPREMACY: 100 Dominion points achieved!' };
        state.view = 'VICTORY';
        if (state.gameMode === 'NETWORK_2P') broadcastGameState();
        render();
        return;
      }
      if (state.p2DominionTotal >= 100) {
        state.victoryData = { winner: state.p2Hero.name, reason: 'DOMINION SUPREMACY: Enemy achieved 100 Dominion points!' };
        state.view = 'VICTORY';
        if (state.gameMode === 'NETWORK_2P') broadcastGameState();
        render();
        return;
      }

      state.currentTurn = state.currentTurn === 1 ? 2 : 1;
      state.turnNumber++;

      state.units.forEach(u => {
        if (u.owner === state.currentTurn) u.actionsLeft = 1;
      });

      if (state.currentTurn === 1) {
        state.p1Kalayaan = Math.min(10, state.p1Kalayaan + 3);
        if (state.p1Deck.length > 0) state.p1Hand.push(state.p1Deck.shift());
      } else {
        state.p2Kalayaan = Math.min(10, state.p2Kalayaan + 3);
        if (state.p2Deck.length > 0) state.p2Hand.push(state.p2Deck.shift());
        if (state.gameMode === 'AI') {
          setTimeout(runAITurn, 600);
        }
      }

      state.selectedUnitId = null;
      state.selectedHandCardIndex = null;
      state.validMoves = [];
      state.validAttacks = [];
      state.validCardPlacements = [];
      state.validEventTargets = [];
      state.validEquipTargets = [];

      if (state.gameMode === 'NETWORK_2P') {
        broadcastGameState();
      }

      render();
    }
    window.endTurn = endTurn;

    function runAITurn() {
      const aiUnits = state.units.filter(u => u.owner === 2);
      aiUnits.forEach(u => {
        if (u.r < state.gridSize - 1) {
          const occ = state.units.find(o => o.r === u.r + 1 && o.c === u.c);
          if (!occ) {
            u.r++;
            const t = state.board.find(tile => tile.r === u.r && tile.c === u.c);
            if (t) t.controlledBy = 2;
          }
        }
      });
      endTurn();
    }

    function addCardToDeck(cardId) {
      if (!cardId) return;

        render();
        return;
      }
      const copies = state.customDeck.filter(c => c.id === card.id).length;
      if (copies >= 3) {
        addLog(`⚠️ Maximum 3 copies of [${card.name}] allowed!`);
        render();
        return;
      }
      state.customDeck.push(card);
      state.activeCardPreview = card;
      playSfx('card_play');
      render();

                  📚
                </div>
                <div>
                  <h1 class="font-cinzel font-black text-lg sm:text-xl text-amber-300 tracking-wide flex items-center gap-2">
                    <span>PHILIPPINE CARD CODEX & LORE ARCHIVE</span>
                    <span class="text-[10px] font-mono bg-amber-950 text-amber-400 px-2 py-0.5 rounded-full border border-amber-500/40">670 CARDS</span>
                  </h1>
                  <p class="text-[11px] text-slate-400">Complete illustrated archive of all Heroes, Mythos Deities, Territories, Events, and Ancient Equipments</p>
                </div>
              </div>

              <div class="flex items-center gap-2 w-full md:w-auto justify-end">
                <div class="relative flex-1 md:w-64">
                  <input type="text" 
                         placeholder="Search name, lore, effect..." 
                         value="${state.archiveSearch || ''}"
                         oninput="setArchiveSearch(this.value);"
                         class="w-full bg-slate-950 border border-slate-800 text-xs rounded-xl pl-8 pr-3 py-2 text-slate-200 placeholder-slate-500 focus:outline-none focus:border-amber-400" />
                  <span class="absolute left-2.5 top-2 text-xs text-slate-500">🔍</span>
                  ${state.archiveSearch ? `
                    <button onclick="setArchiveSearch('');" class="absolute right-2.5 top-2 text-xs text-slate-500 hover:text-slate-300">✕</button>
                  ` : ''}
                </div>
                <button onclick="state.view = 'MENU'; render();" 
                        class="px-4 py-2 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 text-slate-950 rounded-xl text-xs font-cinzel font-black flex items-center gap-1.5 transition shadow active:scale-95 shrink-0">
                  <span>←</span>
                  <span>MENU</span>
                </button>
              </div>
            </div>

            <div class="grid grid-cols-2 sm:grid-cols-6 gap-2 bg-slate-950 p-1.5 rounded-2xl border border-slate-800">
              ${[
                { id: 'HEROES', label: 'Heroes (50)', icon: '👑' },
                { id: 'MYTHOS', label: 'Mythos (120)', icon: '🐉' },
                { id: 'LANDS', label: 'Territories (200)', icon: '🏔️' },
                { id: 'EVENTS', label: 'Events (200)', icon: '📜' },
                { id: 'EQUIPMENT', label: 'Relics (100)', icon: '🛡️' },
                { id: 'ALL', label: 'Entire Codex (670)', icon: '✨' }
              ].map(cat => `
                <button onclick="setArchiveFilter('${cat.id}');"
                        class="py-2 px-2 rounded-xl text-xs font-cinzel font-bold transition flex items-center justify-center gap-1.5 border ${filter === cat.id ? 'bg-amber-500 text-slate-950 border-amber-300 shadow font-black' : 'bg-slate-900 text-slate-400 border-slate-800 hover:text-slate-200'}">
                  <span>${cat.icon}</span>
                  <span class="truncate">${cat.label}</span>
                </button>
              `).join('')}
            </div>

            <div class="flex-1 grid grid-cols-1 lg:grid-cols-12 gap-4 overflow-hidden min-h-0">
              <div class="lg:col-span-8 flex flex-col bg-slate-900/80 border border-slate-800 rounded-2xl p-3 shadow-xl overflow-hidden">
                <div class="flex justify-between items-center pb-2 mb-2 border-b border-slate-800 text-xs font-mono text-slate-400">
                  <span>Displaying <b class="text-amber-300">${visibleCards.length}</b> of <b class="text-slate-200">${cardPool.length}</b> cards</span>
                  <span class="text-[10px] text-slate-500">Tap any card to view detailed lore & stats</span>
                </div>

                <div class="flex-1 overflow-y-auto pr-1 pt-1 max-h-[66vh] grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-4 touch-scroll">
                  ${visibleCards.length === 0 ? `
                    <div class="col-span-full py-16 text-center text-slate-500 flex flex-col items-center justify-center">
                      <span class="text-4xl mb-2">🔍</span>
                      <p class="font-cinzel text-sm text-slate-400">No cards match your search criteria</p>
                      <button onclick="setArchiveFilter('HEROES'); setArchiveSearch('');" class="mt-2 text-xs text-amber-400 hover:underline">Reset Filters</button>
                    </div>
                  ` : visibleCards.map(card => renderPhysicalTcgCard(card, 0, false)).join('')}
                </div>

                ${hasMore ? `
                  <div class="pt-3 text-center border-t border-slate-800 mt-2">
                    <button onclick="loadMoreArchiveCards();" 
                            class="px-6 py-2 bg-gradient-to-r from-amber-600 to-yellow-600 hover:from-amber-500 text-slate-950 font-cinzel font-black text-xs rounded-xl shadow transition">
                      SHOW MORE CARDS (${cardPool.length - visibleCards.length} REMAINING)
                    </button>
                  </div>
                ` : ''}
              </div>

              <div class="lg:col-span-4 flex flex-col gap-3 overflow-hidden">
                <div class="bg-gradient-to-b from-amber-950/40 via-slate-900 to-slate-950 border border-amber-500/40 rounded-2xl p-3 shadow-xl flex flex-col items-center">
                  <div class="w-full flex items-center justify-between mb-2">
                    <span class="font-cinzel font-black text-xs text-amber-300 flex items-center gap-1.5">
                      <span>✨</span>
                      <span>INSPECTED ARTIFACT</span>
                    </span>
                    <span class="text-[9px] font-mono px-2 py-0.5 rounded bg-slate-950 text-slate-400 border border-slate-800">
                      ID: ${inspectedCard.id.toUpperCase()}
                    </span>
                  </div>

                  <div class="w-full flex justify-center py-1">
                    ${renderPhysicalTcgCard(inspectedCard, 0, true)}
                  </div>
                </div>

                <div class="flex-1 bg-slate-900/80 border border-slate-800 rounded-2xl p-4 shadow-xl flex flex-col overflow-y-auto max-h-[30vh] lg:max-h-none text-xs space-y-2.5 touch-scroll">
                  <div class="font-cinzel font-black text-amber-300 text-xs flex items-center gap-1.5 pb-1 border-b border-slate-800">
                    <span>📜</span>
                    <span>HISTORICAL & MYTHOLOGICAL CHRONICLE</span>
                  </div>
                  <div>
                    <div class="text-[10px] font-mono text-slate-400 font-bold uppercase">CANONICAL LORE:</div>
                    <p class="text-xs text-slate-200 mt-0.5 leading-relaxed font-serif italic">
                      “${getCardLore(inspectedCard)}”
                    </p>
                  </div>
                  <div>
                    <div class="text-[10px] font-mono text-slate-400 font-bold uppercase">TACTICAL APPLICATION:</div>
                    <p class="text-xs text-amber-200/90 mt-0.5 leading-relaxed">
                      ${inspectedCard.effect || inspectedCard.ability || inspectedCard.desc || inspectedCard.passive || 'Standard tactical deployment unit.'}
                    </p>
                  </div>
                </div>
              </div>
            </div>
          </div>
        `;
        return;
      }

      if (state.view === 'VICTORY' && state.victoryData) {
        app.innerHTML = `
          <div class="flex-1 flex items-center justify-center p-4">
            <div class="bg-slate-900 border-2 border-amber-500/80 rounded-3xl p-6 max-w-sm w-full text-center shadow-2xl space-y-4">
              <div class="text-5xl">🏆</div>
              <h2 class="text-2xl font-cinzel font-black text-amber-400">${state.victoryData.winner} WINS!</h2>
              <p class="text-xs font-mono text-slate-400 leading-relaxed">${state.victoryData.reason}</p>
              <button onclick="state.view = 'MENU'; render();" class="w-full py-3 bg-gradient-to-r from-amber-500 to-amber-600 text-slate-950 font-cinzel font-black rounded-xl">
                RETURN TO MENU
              </button>
            </div>
          </div>
        `;
        return;
      }
    }
    window.render = render;

    window.onload = function() {
      render();
    };
    render();
  </script>
</body>
</html>
