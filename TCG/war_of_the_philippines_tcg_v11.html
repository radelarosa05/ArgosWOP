  <script>
    function playSfx(type) {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        if (type === 'card_play') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(300, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(620, ctx.currentTime + 0.12);
          gain.gain.setValueAtTime(0.18, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.12);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(); osc.stop(ctx.currentTime + 0.12);
        } else if (type === 'attack') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(170, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(50, ctx.currentTime + 0.22);
          gain.gain.setValueAtTime(0.25, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.22);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(); osc.stop(ctx.currentTime + 0.22);
        } else if (type === 'skill') {
          [440, 554, 659, 880].forEach((f, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(f, ctx.currentTime + i * 0.05);
            gain.gain.setValueAtTime(0.18, ctx.currentTime + i * 0.05);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + i * 0.05 + 0.22);
            osc.connect(gain); gain.connect(ctx.destination);
            osc.start(ctx.currentTime + i * 0.05); osc.stop(ctx.currentTime + i * 0.05 + 0.22);
          });
        } else if (type === 'ultimate') {
          [261.63, 329.63, 392.00, 523.25, 659.25].forEach((f, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(f, ctx.currentTime + i * 0.06);
            gain.gain.setValueAtTime(0.25, ctx.currentTime + i * 0.06);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + i * 0.06 + 0.32);
            osc.connect(gain); gain.connect(ctx.destination);
            osc.start(ctx.currentTime + i * 0.06); osc.stop(ctx.currentTime + i * 0.06 + 0.32);
          });
        } else if (type === 'coin') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(987.77, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(1318.51, ctx.currentTime + 0.25);
          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(); osc.stop(ctx.currentTime + 0.25);
        }
      } catch (e) {}
    }
    window.playSfx = playSfx;
  </script>

      if (!unit || !unit.card) return 0;
      let atk = unit.card.atk || 5;
      (unit.equipments || []).forEach(eq => { atk += (eq.atkBoost || 0); });
      const tile = state.board.find(t => t.r === unit.r && t.c === unit.c);
      if (state.currentWeather.id === 'HABAGAT' && tile && tile.land?.category?.includes('Sea')) {
        atk = Math.max(1, atk - 2); // Habagat storm dampening
      }
      return atk;
    }
    window.getUnitEffectiveAtk = getUnitEffectiveAtk;

    // Colonial Fatigue: Extra energy cost if player controls too many distant islands
    function getColonialFatiguePenalty(player) {
      const threshold = state.gridSize <= 5 ? 7 : state.gridSize <= 7 ? 14 : 22;
      const controlled = state.board.filter(t => t.controlledBy === player).length;
      if (controlled > threshold) {
        return Math.floor((controlled - threshold) / 3);
      }
      return 0;
    }
    window.getColonialFatiguePenalty = getColonialFatiguePenalty;
  </script>

  <script>
    function parseCardsFromXml(xmlString) {
      try {
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(xmlString, "text/xml");
        const parseError = xmlDoc.querySelector("parsererror");
        if (parseError) throw new Error("XML error: " + parseError.textContent.slice(0, 100));

        const loadedHeroes = [];
        xmlDoc.querySelectorAll("hero").forEach(el => {
          loadedHeroes.push({
            id: el.getAttribute("id") || ("h_" + Math.random().toString(36).substr(2, 5)),
            heroCategory: el.getAttribute("category") || "HISTORICAL",
            name: el.querySelector("name")?.textContent || "Unnamed Hero",
            title: el.querySelector("title")?.textContent || "",
            atk: parseInt(el.querySelector("atk")?.textContent || "10", 10),
            def: parseInt(el.querySelector("def")?.textContent || "10", 10),
            hp: parseInt(el.querySelector("hp")?.textContent || "25", 10),
            move: parseInt(el.querySelector("move")?.textContent || "2", 10),
            leadership: parseInt(el.querySelector("leadership")?.textContent || "5", 10),
            homeland: el.querySelector("homeland")?.textContent || "Philippines",
            avatarSymbol: el.querySelector("symbol")?.textContent || "👑",
            effect: el.querySelector("effect")?.textContent || "",
            lore: el.querySelector("lore")?.textContent || "",
            ultimateName: el.querySelector("ultimateName")?.textContent || "Sigaw ng Bayan",
            ultimateDesc: el.querySelector("ultimateDesc")?.textContent || "Unleashes awakening surge."
          });
        });

        if (loadedHeroes.length > 0) {
          window.HEROES_DATABASE = loadedHeroes;
          window.HISTORICAL_HEROES = loadedHeroes.filter(h => h.heroCategory === 'HISTORICAL');
          window.FICTIONAL_HEROES = loadedHeroes.filter(h => h.heroCategory === 'FICTIONAL');
          state.p1Hero = loadedHeroes[0];
          state.p2Hero = loadedHeroes[1] || loadedHeroes[0];
          addLog(`✅ Successfully loaded ${loadedHeroes.length} Heroes from XML!`);
          render();
        }
        return true;
      } catch (err) {
        addLog(`⚠️ XML parsing error: ${err.message}`);
        return false;
      }
    }
    window.parseCardsFromXml = parseCardsFromXml;

    async function loadCardsFromXmlUrl(url = state.xmlSourceUrl) {
      try {
        const res = await fetch(url, { cache: 'no-cache' });
        if (!res.ok) throw new Error(`HTTP status ${res.status}`);
        const text = await res.text();
        return parseCardsFromXml(text);
      } catch (err) {
        return false;
      }
    }
    window.loadCardsFromXmlUrl = loadCardsFromXmlUrl;

    function handleXmlFileUpload(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        if (e.target.result) parseCardsFromXml(e.target.result);
      };
      reader.readAsText(file);
    }
    window.handleXmlFileUpload = handleXmlFileUpload;

    function exportDatabaseToXml() {
      let xml = `<?xml version="1.0" encoding="UTF-8"?>\n<tcg_database name="War of the Philippines TCG">\n  <heroes>\n`;
      HEROES_DATABASE.forEach(h => {
        xml += `    <hero id="${h.id}" category="${h.heroCategory}">\n`;
        xml += `      <name><![CDATA[${h.name}]]></name>\n`;
        xml += `      <title><![CDATA[${h.title || ''}]]></title>\n`;
        xml += `      <atk>${h.atk}</atk>\n`;
        xml += `      <def>${h.def}</def>\n`;
        xml += `      <hp>${h.hp}</hp>\n`;
        xml += `      <move>${h.move || 2}</move>\n`;
        xml += `      <leadership>${h.leadership || 5}</leadership>\n`;
        xml += `      <homeland><![CDATA[${h.homeland || ''}]]></homeland>\n`;
        xml += `      <symbol>${h.avatarSymbol || '👑'}</symbol>\n`;
        xml += `      <effect><![CDATA[${h.effect || ''}]]></effect>\n`;
        xml += `      <ultimateName><![CDATA[${h.ultimateName || 'Sigaw ng Bayan'}]]></ultimateName>\n`;
        xml += `      <ultimateDesc><![CDATA[${h.ultimateDesc || ''}]]></ultimateDesc>\n`;
        xml += `      <lore><![CDATA[${h.lore || ''}]]></lore>\n`;
        xml += `    </hero>\n`;
      });
      xml += `  </heroes>\n</tcg_database>`;

      const blob = new Blob([xml], { type: "application/xml;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "cards.xml";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      addLog("💾 Exported full database to cards.xml!");
    }
    window.exportDatabaseToXml = exportDatabaseToXml;
  </script>

  <script>
    function getCardLore(card) {
      if (!card) return 'No card selected.';
      if (card.lore && card.lore.trim().length > 0) return card.lore;

      if (card.hp && card.atk && !card.leadership) {
        if (card.name === 'BATHALA') return 'The supreme deity of the ancient Tagalogs who resides in Kaluwalhatian. Creator of all mortal existence, earth, sky, and cosmic order.';
        if (card.name === 'BAKUNAWA') return 'The colossal serpent-dragon of the deep who rises during lunar eclipses to swallow the celestial sisters of Mayari.';
        if (card.name === 'MAYARI') return 'The enchanting one-eyed lunar goddess of beauty, night, and guidance. Gently illuminates the paths of righteous defenders.';
        if (card.name === 'APOLAKI') return 'The fiery solar deity and pre-colonial patron of warriors, wielding a blazing golden kris against invaders.';
        if (card.name === 'TIKBALANG') return 'Towering humanoid spirit with an equine stallion head, confusing travelers in deep mountain forests with spatial illusions.';
        return `Ancient primordial entity belonging to the ${card.role || 'ancestral'} pantheon of the Philippine archipelago.`;
      }

      if (card.category) {
        if (card.category === 'Cities') return `${card.name} is a vital bastion of civilization and governance. Yields +2 Dominion points (when garrisoned) and +1 Kalayaan energy.`;
        if (card.category.includes('Sea')) return `${card.name} is an archipelagic corridor connecting islands. Yields +1 Dominion point (when garrisoned).`;
        if (card.category.includes('Church')) return `${card.name} is a sacred sanctuary. Stationed troops recover +3 HP at turn end. Yields 0 Dominion.`;
        if (card.category.includes('Island')) return `${card.name} is a fortress island granting stationed defenders +2 DEF and yielding +2 Dominion.`;
      }

      if (card.dominionDamage) return `Decisive historical engagement. Strips -${card.dominionDamage} Dominion points from the enemy's territorial control!`;
      if (card.drawAmount) return `Historic milestone that unified the resistance, allowing you to draw +${card.drawAmount} extra cards.`;
      return 'Canonical artifact of Philippine heritage and folklore.';
    }
    window.getCardLore = getCardLore;

    function getCardUsageGuide(card) {
      if (!card) return { type: 'CARD', usage: 'Standard card.', instruction: 'Click to play.' };
      
      if (card.dominionDamage) {
        return {
          type: '💥 DOMINION SIEGE EVENT',
          usage: `Direct Strategic Siege! Bypasses front-line units to directly destroy -${card.dominionDamage} Dominion points from the opposing commander's total score, weakening their territorial control.`,
          instruction: `Tap "💥 LAUNCH SIEGE" to instantly sap ${card.dominionDamage} Dominion points from the enemy!`
        };
      }
      if (card.drawAmount) {
        return {
          type: '📜 REINFORCEMENT EVENT',
          usage: `Mobilizes revolutionary supplies and tactical intelligence to draw +${card.drawAmount} extra card(s) from your deck directly into your hand.`,
          instruction: `Tap to immediately draw ${card.drawAmount} extra card(s) from your deck!`
        };
      }
      if (card.id && (card.id.startsWith('eq') || card.atkBoost !== undefined)) {
        return {
          type: '🛡️ EQUIPMENT & ANCESTRAL RELIC',
          usage: `Attach onto any allied Supreme Commander (holds up to 2 relics) or Mythos unit (holds 1 relic). Bestows combat boosts (+${card.atkBoost || 0} ATK, +${card.defBoost || 0} DEF, +${card.hpBoost || 0} HP) and status protection for ${card.duration || 3} turns.`,
          instruction: `Tap any allied unit pulsing with an amber border on the grid to attach this relic!`
        };
      }
      if (card.hp && card.atk && !card.leadership) {
        return {
          type: `🐉 MYTHOS SUMMON (${(card.role || 'SPIRIT').toUpperCase()})`,
          usage: `Summon onto an unoccupied grid tile as an active battle unit. Mythos units can advance across tiles to garrison territories and attack enemy units.`,
          instruction: `Tap any unoccupied grid tile highlighted in yellow to summon this Mythos!`
        };
      }
      if (card.category) {
        const domVal = card.dominionValue || 0;
        const domDesc = domVal > 0 ? `+${domVal} Dominion / turn (when actively garrisoned)` : `Sanctuary recovery (+3 HP / turn, 0 Dominion)`;
        return {
          type: `🏔️ TERRITORY LAND (${card.category.toUpperCase()})`,
          usage: `Establish or fortify a Philippine territory. Yields ${domDesc}, and grants +${card.energyBonus || 1} Kalayaan Energy upon placement.`,
          instruction: `Tap any grid tile highlighted in yellow to establish control over this territory!`
        };
      }
      return {
        type: '✨ TACTICAL SURGE EVENT',
        usage: `Bestows divine blessings and revolutionary rallying onto an active friendly unit: grants +2 ATK, +1 DEF, restores 4 HP, cleanses all negative status ailments (Poison, Sleep, Bleed, Paralysis), and grants an immediate extra action!`,
        instruction: `Tap any friendly Hero Commander or Mythos unit pulsing in cyan on the grid to cast!`
      };
    }
    window.getCardUsageGuide = getCardUsageGuide;

    function selectHandCard(idx) {
      state.selectedUnitId = null;
      state.validMoves = [];
      state.validAttacks = [];
      playCardFromHand(idx);
    }
    window.selectHandCard = selectHandCard;

    function handleHandCardButtonClick(idx) {
      const isClient = state.gameMode === 'NETWORK_2P' && state.networkRole === 'CLIENT';
      const isP1Turn = state.currentTurn === 1;
      const hand = (state.gameMode === 'LOCAL_2P') 
        ? (isP1Turn ? state.p1Hand : state.p2Hand) 
        : (isClient ? state.p2Hand : state.p1Hand);
      const card = hand[idx];

      if (state.selectedHandCardIndex === idx && card) {
        if (card.dominionDamage) {
          executeDominionSiege(idx);
          return;
        }
        if (card.drawAmount) {
          executeDrawEvent(idx);
          return;
        }
      }
      playCardFromHand(idx);
    }
    window.handleHandCardButtonClick = handleHandCardButtonClick;

    function renderPhysicalTcgCard(card, copies = 0, isJumbo = false) {
      if (!card) return '';

      const isMythos = Boolean(card.hp && card.atk && !card.leadership);
      const isLand = Boolean(card.category);
      const isEvent = Boolean(!card.hp && !card.category && !card.leadership && !card.atkBoost && !card.defBoost);
      const isEquip = Boolean(card.id && card.id.startsWith('eq'));
      const isHero = Boolean(card.leadership && card.homeland);
      const isHistoricalHero = isHero && card.heroCategory === 'HISTORICAL';
      const isFictionalHero = isHero && card.heroCategory === 'FICTIONAL';
      const isArchiveView = state.view === 'ARCHIVES';

      let frameGrad = 'from-amber-950/90 via-slate-900 to-amber-950/90';
      let borderGlow = 'border-amber-500/60 shadow-[0_4px_25px_rgba(245,158,11,0.18)]';
      let typeLabel = 'CARD';
      let artBackdrop = 'from-amber-900/40 via-yellow-950/30 to-slate-950';

      if (isHistoricalHero) {
        frameGrad = 'from-yellow-950 via-slate-950 to-amber-950';
        borderGlow = 'border-yellow-400 shadow-[0_0_30px_rgba(250,204,21,0.35)] ring-1 ring-yellow-400/50';
        typeLabel = `HISTORICAL HERO • ${card.homeland.toUpperCase()}`;
        artBackdrop = 'from-amber-800/50 via-yellow-900/30 to-slate-900';
      } else if (isFictionalHero) {
        frameGrad = 'from-purple-950 via-indigo-950 to-slate-950';
        borderGlow = 'border-purple-400 shadow-[0_0_30px_rgba(192,132,252,0.4)] ring-1 ring-purple-400/60';
        typeLabel = `FICTIONAL HERO • ${card.homeland.toUpperCase()}`;
        artBackdrop = 'from-purple-900/60 via-indigo-950/40 to-slate-950';
      } else if (isEquip) {
        frameGrad = 'from-amber-950 via-stone-900 to-yellow-950';
        borderGlow = 'border-amber-400/80 shadow-[0_0_24px_rgba(245,158,11,0.3)]';
        typeLabel = `RELIC ARMAMENT • ${card.subTitle ? card.subTitle.toUpperCase() : 'EQUIPMENT'}`;
        artBackdrop = 'from-amber-900/50 via-stone-900 to-slate-950';
      } else if (isMythos) {
        frameGrad = 'from-emerald-950 via-slate-950 to-teal-950';
        borderGlow = 'border-emerald-400/70 shadow-[0_0_24px_rgba(52,211,153,0.22)]';
        typeLabel = `MYTHOS • ${card.role ? card.role.toUpperCase() : 'SPIRIT'}`;
        artBackdrop = 'from-emerald-900/50 via-teal-950/40 to-slate-950';
      } else if (isLand) {
        frameGrad = 'from-red-950/90 via-slate-950 to-stone-900';
        borderGlow = 'border-rose-400/60 shadow-[0_0_20px_rgba(244,63,94,0.2)]';
        typeLabel = `TERRITORY • ${card.category.toUpperCase()}`;
        artBackdrop = 'from-red-900/40 via-stone-900 to-slate-950';
      } else if (isEvent) {
        frameGrad = 'from-cyan-950 via-slate-950 to-indigo-950';
        borderGlow = 'border-cyan-400/70 shadow-[0_0_24px_rgba(34,211,238,0.25)]';
        typeLabel = 'HISTORICAL EVENT • TACTIC';
        artBackdrop = 'from-cyan-950/50 via-indigo-950/40 to-slate-950';
      }

      const isInspected = state.activeCardPreview && state.activeCardPreview.id === card.id;
      const ruleText = card.effect || card.desc || card.ability || card.passive || 'Standard tactical card action.';
      const energyCost = card.cost || 1;
      const reqLeadership = card.reqLeadership || (isHero ? card.leadership : 1);
      const cardWidthClass = isJumbo ? 'w-full max-w-[340px]' : 'w-full max-w-[310px] mx-auto';
      const cardHeightClass = isJumbo ? 'min-h-[490px]' : 'min-h-[440px]';
      const imageSrc = card.imageUrl || `${state.imageFolderPath}${card.id}${state.imageExtension || '.png'}`;

      return `
        <div onclick="inspectCard('${card.id}');"
             class="${cardWidthClass} ${cardHeightClass} flex flex-col justify-between p-2.5 sm:p-3 rounded-2xl bg-gradient-to-b ${frameGrad} border-2 ${borderGlow} ${isInspected && !isJumbo ? 'ring-2 ring-amber-300 scale-[1.01]' : ''} card-foil transition-all duration-300 select-none relative group cursor-pointer">
          
          <div class="flex items-center justify-between bg-slate-950/90 rounded-xl px-2.5 py-1.5 border border-amber-500/40 shadow-md">
            <div class="flex items-center gap-1.5 truncate">
              <span class="text-xs font-mono px-1.5 py-0.5 rounded bg-amber-950 text-amber-300 border border-amber-500/40 font-black">
                👑 ${reqLeadership}
              </span>
              <span class="font-cinzel font-black text-xs sm:text-sm text-slate-100 tracking-wide truncate">
                ${card.name}
              </span>
            </div>

            <div class="flex items-center gap-1 shrink-0 ml-1">
              <div class="flex items-center justify-center w-6 h-6 rounded-full bg-gradient-to-br from-amber-400 to-yellow-600 text-slate-950 font-black font-mono text-[11px] shadow border border-amber-200">
                ⚡${energyCost}
              </div>
            </div>
          </div>

          <div class="flex justify-between items-center px-1.5 py-0.5 text-[9px] font-mono tracking-widest uppercase font-bold text-amber-300/90">
            <span class="truncate max-w-[200px]">${typeLabel}</span>
            <span>🇵🇭 ARSENAL</span>
          </div>

          <div class="relative w-full h-32 sm:h-36 rounded-xl bg-gradient-to-b ${artBackdrop} border border-amber-500/30 flex items-center justify-center overflow-hidden shadow-inner my-1">
            <img src="${imageSrc}" 
                 alt="${card.name}" 
                 class="absolute inset-0 w-full h-full object-cover rounded-xl transition transform group-hover:scale-105 duration-300 z-10"
                 onload="this.classList.remove('hidden');"
                 onerror="this.style.display='none'; const fb = this.nextElementSibling; if(fb) fb.classList.remove('hidden');" />

            <div class="card-fallback-symbol flex items-center justify-center text-5xl sm:text-6xl drop-shadow-[0_8px_16px_rgba(0,0,0,0.8)] filter transition transform group-hover:scale-110 duration-300 z-0">
              ${card.avatarSymbol || (isLand ? '🗺️' : isEquip ? '🛡️' : isEvent ? '📜' : '⚔️')}
            </div>

            ${copies > 0 ? `
              <div class="absolute top-1.5 right-1.5 px-2 py-0.5 rounded-full bg-slate-950/90 border border-amber-400 text-amber-300 text-[10px] font-mono font-black shadow z-20">
                ${copies}/3 IN DECK
              </div>
            ` : ''}

            <div class="absolute bottom-1 left-2 text-[8px] font-mono text-slate-400 tracking-wider z-20 bg-slate-950/80 px-1 rounded">
              ID: ${card.id.toUpperCase()}
            </div>
          </div>

          <div class="bg-slate-950/90 border border-slate-800 rounded-xl p-2 sm:p-2.5 shadow-md flex flex-col justify-between flex-1 my-1">
            <div>
              <div class="text-[10px] font-bold text-amber-300 flex items-center gap-1 mb-0.5">
                <span>📜</span>
                <span>TACTICAL EFFECT</span>
              </div>
              <div class="text-[10px] sm:text-[11px] text-slate-200 leading-snug font-medium line-clamp-3">
                ${ruleText}
              </div>
            </div>

            ${card.ultimateName ? `
              <div class="pt-1 mt-1 border-t border-amber-500/30">
                <div class="text-[9px] font-bold text-amber-400">🌟 ULTIMATE: ${card.ultimateName}</div>
                <div class="text-[9px] text-slate-300 line-clamp-1 italic">${card.ultimateDesc}</div>
              </div>
            ` : `
              <div class="pt-1 mt-1 border-t border-slate-800/80">
                <div class="text-[9px] text-amber-200/70 italic font-serif leading-tight line-clamp-2">
                  “${getCardLore(card)}”
                </div>
              </div>
            `}
          </div>

          <div class="flex items-center justify-between pt-1">
            ${isMythos || isHero ? `
              <div class="flex items-center gap-1.5">
                <div class="flex items-center gap-1 px-2 py-0.5 rounded-lg bg-red-950/90 border border-red-500/50 text-red-300 font-mono font-black text-xs shadow">
                  <span>⚔️</span>
                  <span>${card.atk || 5}</span>
                </div>
                <div class="flex items-center gap-1 px-2 py-0.5 rounded-lg bg-blue-950/90 border border-blue-500/50 text-blue-300 font-mono font-black text-xs shadow">
                  <span>🛡️</span>
                  <span>${card.def || 3}</span>
                </div>
              </div>
              <div class="flex items-center gap-1 px-2 py-0.5 rounded-lg bg-emerald-950/90 border border-emerald-500/50 text-emerald-300 font-mono font-black text-xs shadow">
                <span>❤️</span>
                <span>${card.hp || 15} HP</span>
              </div>
            ` : isEquip ? `
              <div class="flex items-center gap-1.5">
                <div class="flex items-center gap-1 px-2 py-0.5 rounded-lg bg-red-950/90 border border-red-500/50 text-red-300 font-mono font-black text-xs shadow">
                  <span>⚔️</span>
                  <span>+${card.atkBoost || 0}</span>
                </div>
                <div class="flex items-center gap-1 px-2 py-0.5 rounded-lg bg-blue-950/90 border border-blue-500/50 text-blue-300 font-mono font-black text-xs shadow">
                  <span>🛡️</span>
                  <span>+${card.defBoost || 0}</span>
                </div>
              </div>
              <div class="flex items-center gap-1 px-2 py-0.5 rounded-lg bg-emerald-950/90 border border-emerald-500/50 text-emerald-300 font-mono font-black text-xs shadow">
                <span>❤️</span>
                <span>+${card.hpBoost || 0} HP</span>
              </div>
            ` : isLand ? `
              <div class="flex items-center gap-1.5">
                <div class="flex items-center gap-1 px-2 py-0.5 rounded-lg bg-amber-950/90 border border-amber-500/50 text-amber-300 font-mono font-black text-xs shadow">
                  <span>🚩</span>
                  <span>+${card.dominionValue || 1} DOMINION</span>

              </div>
              <div class="flex items-center gap-1 px-2 py-0.5 rounded-lg bg-yellow-950/90 border border-yellow-500/50 text-yellow-300 font-mono font-black text-xs shadow">

              <div class="flex items-center gap-1.5">

                  <span>✨</span>
                  <span>${card.dominionDamage ? `-${card.dominionDamage} ENEMY DOMINION` : (card.drawAmount ? `+${card.drawAmount} CARDS` : 'TACTICAL SURGE')}</span>
                </div>
              </div>
              <div class="text-[9px] font-mono text-slate-400 font-bold">
                ${card.dominionDamage ? 'DOMINION SIEGE' : (card.drawAmount ? 'REINFORCEMENT' : 'ONE-TIME SURGE')}
              </div>
            `}
          </div>

          ${!isHero ? `
            ${!isArchiveView ? `
              <div class="flex items-center gap-1.5 pt-2 mt-1 border-t border-slate-800/80" onclick="event.stopPropagation();">
                <button onclick="addCardToDeck('${card.id}');"
                        ${copies >= 3 ? 'disabled' : ''}
                        class="flex-1 py-1.5 px-2 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 disabled:opacity-40 disabled:pointer-events-none text-slate-950 font-cinzel font-black text-[10px] rounded-lg shadow active:scale-95 transition flex items-center justify-center gap-1">
                  <span>+</span>
                  <span>ADD TO DECK (${copies}/3)</span>
                </button>
                ${copies > 0 ? `
                  <button onclick="removeCardFromDeck('${card.id}');"
                          class="py-1.5 px-2.5 bg-red-950/80 hover:bg-red-900 border border-red-500/40 text-red-200 font-black text-xs rounded-lg shadow active:scale-95 transition">
                    -
                  </button>
                ` : ''}
              </div>
            ` : `
              <div class="flex items-center justify-between pt-2 mt-1 border-t border-slate-800/80 text-[10px] font-mono text-amber-300/80">
                <span class="flex items-center gap-1"><span>🔍</span> TAP TO INSPECT</span>
                <span class="text-slate-400 text-[9px] uppercase">${card.id}</span>
              </div>
            `}
          ` : `
            <div class="flex items-center justify-between pt-2 mt-1 border-t border-slate-800/80 text-[10px] font-mono ${isFictionalHero ? 'text-purple-300' : 'text-yellow-400'} font-bold">
              <span class="flex items-center gap-1"><span>👑</span> SUPREME COMMANDER (2 RELIC SLOTS)</span>
              <span class="text-[9px] text-amber-300/70 uppercase truncate max-w-[100px]">${card.homeland}</span>
            </div>
          `}
        </div>
      `;
    }
    window.renderPhysicalTcgCard = renderPhysicalTcgCard;

    function inspectCard(cardId) {
      const card = findCardById(cardId);
      if (card) {
        state.activeCardPreview = card;
        render();
      }
    }
    window.inspectCard = inspectCard;

    function addCardToDeck(cardId) {
      if (!cardId) return;
      const card = findCardById(cardId);
      if (!card) return;
      if (state.customDeck.length >= 50) {
        addLog("⚠️ Maximum deck size reached! (50/50 cards limit)");
        render();
        return;
      }
      const copies = state.customDeck.filter(c => c.id === card.id).length;
      if (copies >= 3) {
        addLog(`⚠️ Maximum 3 copies of [${card.name}] allowed!`);
        render();
        return;
      }
      state.customDeck.push(card);
      state.activeCardPreview = card;
      playSfx('card_play');
      render();
    }
    window.addCardToDeck = addCardToDeck;

    function removeCardFromDeck(cardId) {
      const idx = state.customDeck.findIndex(c => c.id === cardId);
      if (idx !== -1) {
        state.customDeck.splice(idx, 1);
        playSfx('card_play');
        render();
      }
    }
    window.removeCardFromDeck = removeCardFromDeck;

    function clearDeck() {
      state.customDeck = [];
      playSfx('card_play');
      render();
    }
    window.clearDeck = clearDeck;

    function autoFillDeck() {
      state.customDeck = [...defaultDeck];
      playSfx('skill');
      addLog("⚡ Auto-filled regulation 50-card deck!");
      render();
    }
    window.autoFillDeck = autoFillDeck;

    function setMobileDeckTab(tab) {
      state.mobileDeckTab = tab;
      render();
    }
    window.setMobileDeckTab = setMobileDeckTab;

    function loadMoreDeckCatalog() {
      state.deckPage = (state.deckPage || 1) + 1;
      render();
    }
    window.loadMoreDeckCatalog = loadMoreDeckCatalog;
  </script>

  <script>
    function startMatch(heroChoice) {
      if (heroChoice) state.p1Hero = heroChoice;
      
      // Only override gridSize and p2Hero based on difficulty during AI campaign mode
      if (state.gameMode === 'AI') {
        if (state.selectedDifficulty === 'EASY') {
          state.gridSize = 5;
          state.p2Hero = HEROES_DATABASE[1];
        } else if (state.selectedDifficulty === 'MODERATE') {
          state.gridSize = 7;
          state.p2Hero = HEROES_DATABASE[7];
        } else if (state.selectedDifficulty === 'HARD') {
          state.gridSize = 9;
          state.p2Hero = HEROES_DATABASE[0];
        } else {
          state.gridSize = 12;
          state.p2Hero = HEROES_DATABASE[4];
        }
      }

      const board = [];
      for (let r = 0; r < state.gridSize; r++) {
        for (let c = 0; c < state.gridSize; c++) {
          const landIdx = (r * state.gridSize + c) % LANDS_DATABASE.length;
          board.push({
            r, c,
            land: { ...LANDS_DATABASE[landIdx] },
            controlledBy: null,
            kuta: null
          });
        }
      }

      const p1StartR = state.gridSize - 1;
      const p1StartC = Math.floor(state.gridSize / 2);
      const p2StartR = 0;
      const p2StartC = Math.floor(state.gridSize / 2);

      const units = [
        {
          id: 'u_p1_hero', owner: 1, type: 'HERO', card: { ...state.p1Hero },
          r: p1StartR, c: p1StartC, currentHp: state.p1Hero.hp, actionsLeft: 1,
          statuses: { poison: 0, bleed: 0, sleep: 0, paralyze: 0 },
          equipments: []
        },
        {
          id: 'u_p2_hero', owner: 2, type: 'HERO', card: { ...state.p2Hero },
          r: p2StartR, c: p2StartC, currentHp: state.p2Hero.hp, actionsLeft: 1,
          statuses: { poison: 0, bleed: 0, sleep: 0, paralyze: 0 },
          equipments: []
        }
      ];

      board.find(t => t.r === p1StartR && t.c === p1StartC).controlledBy = 1;
      board.find(t => t.r === p2StartR && t.c === p2StartC).controlledBy = 2;

      state.board = board;
      state.units = units;
      state.p1Deck = [...state.customDeck].sort(() => Math.random() - 0.5);
      state.p1Hand = state.p1Deck.splice(0, 4);
      state.p2Deck = [...defaultDeck].sort(() => Math.random() - 0.5);
      state.p2Hand = state.p2Deck.splice(0, 4);
      state.p1Kalayaan = 5;
      state.p2Kalayaan = 5;
      state.p1DominionTotal = 0;
      state.p2DominionTotal = 0;
      state.currentTurn = 1;
      state.turnNumber = 1;
      state.gameLogs = [];
      state.selectedUnitId = null;
      state.selectedHandCardIndex = null;
      state.validMoves = [];
      state.validAttacks = [];
      state.validCardPlacements = [];
      state.validEventTargets = [];
      state.validEquipTargets = [];
      state.currentWeather = WEATHER_PRESETS[0];
      state.weatherTurnsLeft = 4;
      state.p1UltimateUsed = false;
      state.p2UltimateUsed = false;
      state.activeCardPreview = state.p1Hero;
      state.view = 'PLAYING';

      const winTarget = getDominionTarget(state.gridSize);
      addLog(`⚔️ Duel commenced on ${state.gridSize}x${state.gridSize} map! Target Dominion: ${winTarget} pts.`);
      addLog(`🛡️ Supply Lines Active: Tiles only yield points when garrisoned or guarded!`);

      if (state.gameMode === 'NETWORK_2P' && state.networkRole === 'HOST') {
        sendP2PMessage({
          type: 'START_MATCH',
          hero1Id: state.p1Hero.id,
          hero2Id: state.p2Hero.id,
          gridSize: state.gridSize
        });
        broadcastGameState();
      }

      render();
    }
    window.startMatch = startMatch;

    function buildKutaOnCurrentTile(unitId) {
      const unit = state.units.find(u => u.id === unitId);
      if (!unit || unit.owner !== state.currentTurn || unit.actionsLeft <= 0) return;
      const energy = state.currentTurn === 1 ? state.p1Kalayaan : state.p2Kalayaan;
      if (energy < 2) {
        addLog(`⚠️ Building a Kuta Redoubt requires ⚡2 Kalayaan!`);
        return;
      }
      const tile = state.board.find(t => t.r === unit.r && t.c === unit.c);
      if (!tile) return;
      if (tile.kuta) {
        addLog(`⚠️ A Kuta Redoubt already exists on this territory!`);
        return;
      }

      if (state.currentTurn === 1) state.p1Kalayaan -= 2;
      else state.p2Kalayaan -= 2;

      tile.kuta = { hp: 5, builtBy: unit.owner };
      tile.controlledBy = unit.owner;
      unit.actionsLeft = 0;
      playSfx('skill');
      addLog(`🏰 ${unit.card.name} fortified tile (${unit.r + 1}, ${unit.c + 1}) with a Kuta Redoubt (+4 DEF & 5 HP Shield)!`);
      if (state.gameMode === 'NETWORK_2P') broadcastGameState();
      render();
    }
    window.buildKutaOnCurrentTile = buildKutaOnCurrentTile;

    function activateHeroUltimate(playerOwner) {
      const isP1 = playerOwner === 1;
      if (isP1 && state.p1UltimateUsed) return;
      if (!isP1 && state.p2UltimateUsed) return;

      const hero = isP1 ? state.p1Hero : state.p2Hero;
      const ultName = hero.ultimateName || 'Sigaw ng Bayan';

      playSfx('ultimate');

      if (hero.id === 'h1') { // Lapu-Lapu
        const enemiesInWater = state.units.filter(u => u.owner !== playerOwner && state.board.find(t => t.r === u.r && t.c === u.c)?.land?.category?.includes('Sea'));
        if (enemiesInWater.length > 0) {
          enemiesInWater.forEach(e => { e.currentHp -= 8; });
          addLog(`🌊 [${ultName}] struck ${enemiesInWater.length} enemy units in water tiles for 8 damage!`);
        } else {
          const nearest = state.units.find(u => u.owner !== playerOwner);
          if (nearest) {
            nearest.currentHp -= 8;
            addLog(`🌊 [${ultName}] struck ${nearest.card.name} for 8 true damage!`);
          }
        }
      } else if (hero.id === 'h2') { // Bonifacio
        state.units.filter(u => u.owner === playerOwner).forEach(u => {
          u.card.atk = (u.card.atk || 5) + 4;
        });
        addLog(`⚔️ [${ultName}] inspired all allies! +4 ATK across all friendly troops.`);
      } else if (hero.id === 'h3') { // Rizal
        state.units.filter(u => u.owner === playerOwner).forEach(u => {
          u.statuses = { poison: 0, bleed: 0, sleep: 0, paralyze: 0 };
          u.currentHp = Math.min(u.card.hp || 25, u.currentHp + 8);
        });
        addLog(`📜 [${ultName}] cleansed all friendly status ailments and healed all allies +8 HP!`);
      } else if (hero.id === 'fh_argos_raven') { // Raven Cruz
        const target = state.units.find(u => u.owner !== playerOwner && u.type !== 'HERO') || state.units.find(u => u.owner !== playerOwner);
        if (target) {
          target.currentHp -= 12;
          addLog(`👁️ [${ultName}] pierced through reality, dealing 12 true damage to ${target.card.name}!`);
        }
      } else { // General
        const target = state.units.find(u => u.owner !== playerOwner);
        if (target) {
          target.currentHp -= 7;
          const com = state.units.find(u => u.owner === playerOwner && u.type === 'HERO');
          if (com) com.currentHp = Math.min(com.card.hp || 25, com.currentHp + 7);
          addLog(`🌟 [${ultName}] struck ${target.card.name} for 7 damage and healed Supreme Commander +7 HP!`);
        }
      }

      state.units = state.units.filter(u => {
        if (u.currentHp <= 0) {
          state.graveyard.push(u.card);
          addLog(`💀 ${u.card.name} was vanquished by the ultimate ability!`);
          if (u.type === 'HERO') {
            const winner = u.owner === 1 ? state.p2Hero.name : state.p1Hero.name;
            state.victoryData = { winner, reason: `HERO CHECKMATE: Slain by Ultimate [${ultName}]!` };
            state.view = 'VICTORY';
          }
          return false;
        }
        return true;
      });

      if (isP1) state.p1UltimateUsed = true;
      else state.p2UltimateUsed = true;

      if (state.gameMode === 'NETWORK_2P') broadcastGameState();
      render();
    }
    window.activateHeroUltimate = activateHeroUltimate;

    function calculateValidActions(unit) {
      if (!unit || unit.owner !== state.currentTurn) return;
      if (state.gameMode === 'NETWORK_2P') {
        if (state.networkRole === 'HOST' && state.currentTurn !== 1) return;
        if (state.networkRole === 'CLIENT' && state.currentTurn !== 2) return;
      }
      const moves = [];
      const attacks = [];
      if ((unit.actionsLeft || 0) <= 0 || (unit.statuses && unit.statuses.sleep > 0)) {
        state.validMoves = [];
        state.validAttacks = [];
        return;
      }
      let maxMove = unit.card.move || 1;
      if (state.currentWeather.id === 'AMIHAN') maxMove += 1;

      const canAttack = !unit.statuses || (unit.statuses.paralyze || 0) <= 0;

      for (let r = 0; r < state.gridSize; r++) {
        for (let c = 0; c < state.gridSize; c++) {
          const dist = Math.abs(r - unit.r) + Math.abs(c - unit.c);
          if (dist > 0 && dist <= maxMove) {
            const occ = state.units.find(u => u.r === r && u.c === c);
            if (!occ) {
              if (state.currentWeather.id === 'HABAGAT') {
                const destTile = state.board.find(t => t.r === r && t.c === c);
                if (destTile && destTile.land?.category?.includes('Sea') && dist > 1) continue;
              }
              moves.push({ r, c });
            } else if (occ.owner !== unit.owner && canAttack) {
              attacks.push({ r, c });
            }
          }
        }
      }
      state.validMoves = moves;
      state.validAttacks = attacks;
    }
    window.calculateValidActions = calculateValidActions;

    function triggerAttackCombat(unit, defender) {
      const atkVal = getUnitEffectiveAtk(unit);
      const defVal = getUnitEffectiveDef(defender);
      const targetTile = state.board.find(t => t.r === defender.r && t.c === defender.c);

      let damage = Math.max(1, atkVal - Math.floor(defVal / 3));

      if (targetTile && targetTile.kuta && targetTile.kuta.hp > 0) {
        if (targetTile.kuta.hp >= damage) {
          targetTile.kuta.hp -= damage;
          addLog(`🏰 Kuta Redoubt absorbed all ${damage} damage! (${targetTile.kuta.hp} Redoubt HP remaining)`);
          damage = 0;
        } else {
          damage -= targetTile.kuta.hp;
          addLog(`🏰 Kuta Redoubt destroyed after absorbing ${targetTile.kuta.hp} damage!`);
          targetTile.kuta = null;
        }
      }

      defender.currentHp -= damage;
      unit.actionsLeft = 0;
      playSfx('attack');

      const formationNote = isUnitInBayanihan(defender) ? ' (🛡️ Bayanihan +2 DEF applied)' : '';
      addLog(`⚔️ ${unit.card.name} struck ${defender.card.name} for ${damage} damage!${formationNote}`);

      if (defender.currentHp <= 0) {
        state.units = state.units.filter(u => u.id !== defender.id);
        state.graveyard.push(defender.card);
        addLog(`💀 ${defender.card.name} was vanquished!`);
        if (defender.type === 'HERO') {
          const winner = unit.owner === 1 ? state.p1Hero.name : state.p2Hero.name;
          state.victoryData = { winner, reason: 'HERO CHECKMATE: Enemy Commander slain!' };
          state.view = 'VICTORY';
        }
      }
      state.selectedUnitId = null;
      state.validMoves = [];
      state.validAttacks = [];
      if (state.gameMode === 'NETWORK_2P') broadcastGameState();
      render();
    }
    window.triggerAttackCombat = triggerAttackCombat;

    function startStatusCoinToss(unit, defender, ailmentType) {
      const isHeads = Math.random() >= 0.5;
      playSfx('coin');
      state.activeCoinToss = {
        attacker: unit,
        defender: defender,
        ailment: ailmentType,
        isSpinning: true,
        result: isHeads ? 'HEADS' : 'TAILS',
        timer: null
      };
      render();

      setTimeout(() => {
        if (!state.activeCoinToss) return;
        state.activeCoinToss.isSpinning = false;
        if (isHeads) {
          if (!defender.statuses) defender.statuses = { poison: 0, bleed: 0, sleep: 0, paralyze: 0 };
          defender.statuses[ailmentType] = 2;
          const label = ailmentType === 'poison' ? 'Poisoned (3 dmg/turn)' : ailmentType === 'bleed' ? 'Bleeding (2 dmg/turn)' : ailmentType === 'sleep' ? 'Asleep (Cannot Act)' : 'Paralyzed (Cannot Attack)';
          addLog(`🪙 Coin Toss: HEADS! ${defender.card.name} was inflicted with ${label} for 2 turns!`);
          playSfx('skill');
        } else {
          addLog(`🪙 Coin Toss: TAILS! ${defender.card.name} resisted the ${ailmentType.toUpperCase()} status effect!`);
        }
        render();

        setTimeout(() => {
          state.activeCoinToss = null;
          triggerAttackCombat(unit, defender);
        }, 1200);
      }, 1400);
    }
    window.startStatusCoinToss = startStatusCoinToss;

    function resolveCoinTossFast() {
      if (!state.activeCoinToss) return;
      const { attacker, defender, ailment, result } = state.activeCoinToss;
      if (result === 'HEADS') {
        if (!defender.statuses) defender.statuses = { poison: 0, bleed: 0, sleep: 0, paralyze: 0 };
        defender.statuses[ailment] = 2;
        addLog(`🪙 Coin Toss: HEADS! ${defender.card.name} was inflicted with ${ailment.toUpperCase()} for 2 turns!`);
      } else {
        addLog(`🪙 Coin Toss: TAILS! ${defender.card.name} resisted the ${ailment.toUpperCase()} status effect!`);
      }
      state.activeCoinToss = null;
      triggerAttackCombat(attacker, defender);
    }
    window.resolveCoinTossFast = resolveCoinTossFast;

    function detectUnitAilment(unit) {
      if (!unit || !unit.card) return null;
      const text = `${unit.card.effect || ''} ${unit.card.lore || ''} ${(unit.equipments || []).map(e => (e.passive || '') + ' ' + (e.name || '')).join(' ')}`.toLowerCase();
      if (text.includes('poison') || text.includes('lason')) return 'poison';
      if (text.includes('bleed') || text.includes('dugo')) return 'bleed';
      if (text.includes('sleep') || text.includes('tulog') || text.includes('bangungot')) return 'sleep';
      if (text.includes('paraly') || text.includes('ngalay') || text.includes('loop')) return 'paralyze';
      return null;
    }
    window.detectUnitAilment = detectUnitAilment;
  </script>

  <script>
    function handleTileClick(r, c) {
      if (state.gameMode === 'NETWORK_2P') {
        if (state.networkRole === 'HOST' && state.currentTurn !== 1) return;
        if (state.networkRole === 'CLIENT' && state.currentTurn !== 2) return;
      }

      if (state.selectedHandCardIndex !== null && state.validEquipTargets && state.validEquipTargets.length > 0) {
        if (state.validEquipTargets.some(t => t.r === r && t.c === c)) {
          executeEquipmentAttach(r, c);
          return;
        }
      }

      if (state.selectedHandCardIndex !== null && state.validEventTargets && state.validEventTargets.length > 0) {
        if (state.validEventTargets.some(t => t.r === r && t.c === c)) {
          executeEventCast(r, c);
          return;
        }
      }

      if (state.selectedHandCardIndex !== null && state.validCardPlacements && state.validCardPlacements.length > 0) {
        if (state.validCardPlacements.some(p => p.r === r && p.c === c)) {
          executeCardPlacement(r, c);
          return;
        }
      }

      if (state.selectedUnitId) {
        const unit = state.units.find(u => u.id === state.selectedUnitId);
        if (unit && unit.owner === state.currentTurn && (unit.actionsLeft || 0) > 0) {
          const isMove = state.validMoves.some(m => m.r === r && m.c === c);
          const isAttack = state.validAttacks.some(a => a.r === r && a.c === c);

          if (isMove) {
            unit.r = r;
            unit.c = c;
            unit.actionsLeft = 0;
            const tile = state.board.find(t => t.r === r && t.c === c);
            if (tile) {
              const prevOwner = tile.controlledBy;
              if (prevOwner && prevOwner !== unit.owner) {
                const loss = tile.land?.dominionValue || 1;
                if (prevOwner === 1) state.p1DominionTotal = Math.max(0, state.p1DominionTotal - loss);
                else state.p2DominionTotal = Math.max(0, state.p2DominionTotal - loss);
                addLog(`🔻 Player ${prevOwner} lost ${loss} Dominion points as territory was recaptured!`);
              }
              tile.controlledBy = unit.owner;
            }
            addLog(`🚩 ${unit.card.name} advanced to (${r + 1}, ${c + 1})!`);
            playSfx('card_play');
            state.selectedUnitId = null;
            state.validMoves = [];
            state.validAttacks = [];
            if (state.gameMode === 'NETWORK_2P') broadcastGameState();
            render();
            return;
          }

          if (isAttack) {
            const defender = state.units.find(u => u.r === r && u.c === c && u.owner !== unit.owner);
            if (defender) {
              const ailment = detectUnitAilment(unit);
              if (ailment) {
                startStatusCoinToss(unit, defender, ailment);
                return;
              }
              triggerAttackCombat(unit, defender);
              return;
            }
          }
        }
      }

      const occupant = state.units.find(u => u.r === r && u.c === c);
      if (occupant) {
        state.activeCardPreview = occupant.card;
        state.selectedUnitId = occupant.id;
        if (occupant.owner === state.currentTurn) {
          calculateValidActions(occupant);
        } else {
          state.validMoves = [];
          state.validAttacks = [];
        }
      } else {
        const tile = state.board.find(t => t.r === r && t.c === c);
        if (tile && tile.land) state.activeCardPreview = tile.land;
        state.selectedUnitId = null;
        state.validMoves = [];
        state.validAttacks = [];
      }
      render();
    }
    window.handleTileClick = handleTileClick;

    function playCardFromHand(idx) {
      const isClient = state.gameMode === 'NETWORK_2P' && state.networkRole === 'CLIENT';
      const isP1Turn = state.currentTurn === 1;
      const hand = (state.gameMode === 'LOCAL_2P') 
        ? (isP1Turn ? state.p1Hand : state.p2Hand) 
        : (isClient ? state.p2Hand : state.p1Hand);
      const kalayaan = (state.gameMode === 'LOCAL_2P') 
        ? (isP1Turn ? state.p1Kalayaan : state.p2Kalayaan) 
        : (isClient ? state.p2Kalayaan : state.p1Kalayaan);

      const card = hand[idx];
      if (!card) return;

      if (state.selectedHandCardIndex === idx) {
        state.selectedHandCardIndex = null;
        state.validCardPlacements = [];
        state.validEventTargets = [];
        state.validEquipTargets = [];
        render();
        return;
      }

      state.selectedHandCardIndex = idx;
      state.activeCardPreview = card;
      state.selectedUnitId = null;
      state.validMoves = [];
      state.validAttacks = [];
      state.validCardPlacements = [];
      state.validEventTargets = [];
      state.validEquipTargets = [];

      const fatigue = getColonialFatiguePenalty(state.currentTurn);
      const cost = (card.cost || 1) + fatigue;

      if (kalayaan < cost) {
        addLog(`🔍 Inspecting [${card.name}]. Requires ⚡${cost} Kalayaan (incl. +⚡${fatigue} overextension fatigue). You have ⚡${kalayaan}.`);
        render();
        return;
      }

      if (card.dominionDamage) {
        addLog(`💥 [${card.name}] selected! Tap "LAUNCH SIEGE" to strike enemy Dominion!`);
        render();
        return;
      }

      if (card.drawAmount) {
        addLog(`📜 [${card.name}] selected! Tap "DRAW CARDS" to activate.`);
        render();
        return;
      }

      if (card.atkBoost !== undefined) {
        const friendlyUnits = state.units.filter(u => u.owner === state.currentTurn);
        const validUnits = friendlyUnits.filter(u => (u.equipments || []).length < (u.type === 'HERO' ? 2 : 1));
        if (validUnits.length === 0) {
          addLog(`⚠️ No allied units have open equipment slots!`);
          render();
          return;
        }
        state.validEquipTargets = validUnits.map(u => ({ r: u.r, c: u.c }));
        addLog(`🛡️ Select an amber allied unit to equip [${card.name}]!`);
        render();
        return;
      }

      if (!card.hp && !card.category) {
        const friendlyUnits = state.units.filter(u => u.owner === state.currentTurn);
        if (friendlyUnits.length === 0) {
          addLog(`⚠️ No allied units on board to target!`);
          render();
          return;
        }
        state.validEventTargets = friendlyUnits.map(u => ({ r: u.r, c: u.c }));
        addLog(`🎯 Select a friendly unit highlighted in cyan to cast [${card.name}]!`);
        render();
        return;
      }

      const placements = [];
      for (let r = 0; r < state.gridSize; r++) {
        for (let c = 0; c < state.gridSize; c++) {
          const occ = state.units.find(u => u.r === r && u.c === c);
          if (card.hp && !occ) placements.push({ r, c });
          else if (card.category) placements.push({ r, c });
        }
      }
      state.validCardPlacements = placements;
      addLog(`Select a highlighted tile to deploy [${card.name}]!`);
      render();
    }
    window.playCardFromHand = playCardFromHand;

    function executeCardPlacement(r, c) {
      const hand = state.currentTurn === 1 ? state.p1Hand : state.p2Hand;
      const card = hand[state.selectedHandCardIndex];
      if (!card) return;

      const fatigue = getColonialFatiguePenalty(state.currentTurn);
      const totalCost = (card.cost || 1) + fatigue;

      if (state.currentTurn === 1) state.p1Kalayaan -= totalCost;
      else state.p2Kalayaan -= totalCost;

      hand.splice(state.selectedHandCardIndex, 1);

      if (card.hp) {
        state.units.push({
          id: 'u_' + Math.random().toString(36).substring(2, 7),
          owner: state.currentTurn,
          type: 'MONSTER',
          card: { ...card },
          r, c,
          currentHp: card.hp,
          actionsLeft: 0,
          statuses: { poison: 0, bleed: 0, sleep: 0, paralyze: 0 },
          equipments: []
        });
        const tile = state.board.find(t => t.r === r && t.c === c);
        if (tile) tile.controlledBy = state.currentTurn;
        addLog(`🐉 Summoned Mythos ${card.name} at (${r+1}, ${c+1})!`);
      } else if (card.category) {
        const tile = state.board.find(t => t.r === r && t.c === c);
        if (tile) {
          tile.land = { ...card };
          tile.controlledBy = state.currentTurn;
        }
        if (state.currentTurn === 1) state.p1Kalayaan += (card.energyBonus || 1);
        else state.p2Kalayaan += (card.energyBonus || 1);
        addLog(`🏔️ Established ${card.name} territory! (+${card.energyBonus || 1} Kalayaan).`);
      }

      state.selectedHandCardIndex = null;
      state.validCardPlacements = [];
      playSfx('card_play');
      if (state.gameMode === 'NETWORK_2P') broadcastGameState();
      render();
    }
    window.executeCardPlacement = executeCardPlacement;

    function executeEventCast(r, c) {
      const isP1 = state.currentTurn === 1;
      const hand = isP1 ? state.p1Hand : state.p2Hand;
      const card = hand[state.selectedHandCardIndex];
      const targetUnit = state.units.find(u => u.r === r && u.c === c);
      if (!card || !targetUnit) return;

      const cost = (card.cost || 1) + getColonialFatiguePenalty(state.currentTurn);
      if (isP1) state.p1Kalayaan -= cost;
      else state.p2Kalayaan -= cost;

      hand.splice(state.selectedHandCardIndex, 1);
      state.graveyard.push(card);

      targetUnit.card.atk = (targetUnit.card.atk || 5) + 2;
      targetUnit.card.def = (targetUnit.card.def || 2) + 1;
      targetUnit.currentHp = Math.min((targetUnit.card.hp || 20) + 6, targetUnit.currentHp + 4);
      targetUnit.actionsLeft = 1;
      targetUnit.statuses = { poison: 0, bleed: 0, sleep: 0, paralyze: 0 };

      playSfx('skill');
      addLog(`✨ Cast [${card.name}] on ${targetUnit.card.name}! (+2 ATK, +1 DEF, +4 HP, cleansed)`);
      state.selectedHandCardIndex = null;
      state.validEventTargets = [];
      if (state.gameMode === 'NETWORK_2P') broadcastGameState();
      render();
    }
    window.executeEventCast = executeEventCast;

    function executeEquipmentAttach(r, c) {
      const isP1 = state.currentTurn === 1;
      const hand = isP1 ? state.p1Hand : state.p2Hand;
      const card = hand[state.selectedHandCardIndex];
      const targetUnit = state.units.find(u => u.r === r && u.c === c);
      if (!card || !targetUnit) return;

      const cost = (card.cost || 1) + getColonialFatiguePenalty(state.currentTurn);
      if (isP1) state.p1Kalayaan -= cost;
      else state.p2Kalayaan -= cost;

      hand.splice(state.selectedHandCardIndex, 1);
      if (!targetUnit.equipments) targetUnit.equipments = [];
      targetUnit.equipments.push({
        id: card.id,
        name: card.name,
        subTitle: card.subTitle || '',
        atkBoost: card.atkBoost || 0,
        defBoost: card.defBoost || 0,
        hpBoost: card.hpBoost || 0,
        turnsRemaining: card.duration || 3,
        passive: card.passive || '',
        avatarSymbol: card.avatarSymbol || '🛡️'
      });

      targetUnit.currentHp += (card.hpBoost || 0);
      playSfx('skill');
      addLog(`🛡️ Equipped [${card.name}] onto ${targetUnit.card.name}! (+${card.atkBoost} ATK, +${card.defBoost} DEF)`);
      state.selectedHandCardIndex = null;
      state.validEquipTargets = [];
      if (state.gameMode === 'NETWORK_2P') broadcastGameState();
      render();
    }
    window.executeEquipmentAttach = executeEquipmentAttach;

    function executeDominionSiege(idx) {
      const hand = state.currentTurn === 1 ? state.p1Hand : state.p2Hand;
      const card = hand[idx];
      if (!card) return;
      const cost = card.cost || 2;
      if (state.currentTurn === 1) {
        state.p1Kalayaan -= cost;
        state.p2DominionTotal = Math.max(0, state.p2DominionTotal - card.dominionDamage);
      } else {
        state.p2Kalayaan -= cost;
        state.p1DominionTotal = Math.max(0, state.p1DominionTotal - card.dominionDamage);
      }
      hand.splice(idx, 1);
      state.graveyard.push(card);
      state.selectedHandCardIndex = null;
      playSfx('attack');
      addLog(`💥 [${card.name}] launched! Sapped -${card.dominionDamage} Dominion points from enemy!`);
      if (state.gameMode === 'NETWORK_2P') broadcastGameState();
      render();
    }
    window.executeDominionSiege = executeDominionSiege;

    function executeDrawEvent(idx) {
      const isP1 = state.currentTurn === 1;
      const hand = isP1 ? state.p1Hand : state.p2Hand;
      const card = hand[idx];
      if (!card) return;
      const cost = card.cost || 2;
      if (isP1) {
        state.p1Kalayaan -= cost;
        for (let i = 0; i < card.drawAmount && state.p1Deck.length > 0; i++) state.p1Hand.push(state.p1Deck.shift());
      } else {
        state.p2Kalayaan -= cost;
        for (let i = 0; i < card.drawAmount && state.p2Deck.length > 0; i++) state.p2Hand.push(state.p2Deck.shift());
      }
      hand.splice(idx, 1);
      state.graveyard.push(card);
      state.selectedHandCardIndex = null;
      playSfx('card_play');
      addLog(`📜 [${card.name}] drew ${card.drawAmount} cards!`);
      if (state.gameMode === 'NETWORK_2P') broadcastGameState();
      render();
    }
    window.executeDrawEvent = executeDrawEvent;
  </script>

  <script>
    function endTurn() {
      if (state.gameMode === 'NETWORK_2P') {
        if (state.networkRole === 'HOST' && state.currentTurn !== 1) return;
        if (state.networkRole === 'CLIENT' && state.currentTurn !== 2) return;
      }

      playSfx('card_play');

      // Supply line scoring: only count garrisons or guarded tiles
      const p1ActiveGarrisons = state.board.filter(t => t.controlledBy === 1 && isTileGarrisoned(t, 1));
      const p2ActiveGarrisons = state.board.filter(t => t.controlledBy === 2 && isTileGarrisoned(t, 2));

      const p1Gain = p1ActiveGarrisons.reduce((acc, t) => {
        if (state.currentWeather.id === 'BAGYO' && (t.r === 0 || t.r === state.gridSize - 1 || t.c === 0 || t.c === state.gridSize - 1)) {
          return acc;
        }
        return acc + (t.land?.dominionValue || 1);
      }, 0);

      const p2Gain = p2ActiveGarrisons.reduce((acc, t) => {
        if (state.currentWeather.id === 'BAGYO' && (t.r === 0 || t.r === state.gridSize - 1 || t.c === 0 || t.c === state.gridSize - 1)) {
          return acc;
        }
        return acc + (t.land?.dominionValue || 1);
      }, 0);

      state.p1DominionTotal += p1Gain;
      state.p2DominionTotal += p2Gain;

      if (p1Gain > 0 || p2Gain > 0) {
        addLog(`🚩 Supply Harvest: P1 gained +${p1Gain} pts (${p1ActiveGarrisons.length} garrisons), P2 gained +${p2Gain} pts (${p2ActiveGarrisons.length} garrisons).`);
      }

      // Sacred Church healing
      state.units.forEach(u => {
        const t = state.board.find(tile => tile.r === u.r && tile.c === u.c);
        if (t && t.land?.category?.includes('Church')) {
          u.currentHp = Math.min(u.card.hp || 25, u.currentHp + 3);
          addLog(`⛪ ${u.card.name} rested at ${t.land.name}, restoring +3 HP!`);
        }
      });

      // Decrement equipment timers
      state.units.forEach(u => {
        if (u.equipments && u.equipments.length > 0) {
          u.equipments.forEach(eq => { if (eq.turnsRemaining > 0) eq.turnsRemaining--; });
        }
      });

      // Status damage tick
      state.units.forEach(u => {
        if (!u.statuses) return;
        if (u.statuses.poison > 0) { u.currentHp -= 3; u.statuses.poison--; addLog(`🧪 ${u.card.name} took 3 Poison dmg!`); }
        if (u.statuses.bleed > 0) { u.currentHp -= 2; u.statuses.bleed--; addLog(`🩸 ${u.card.name} took 2 Bleed dmg!`); }
        if (u.statuses.sleep > 0) { u.actionsLeft = 0; u.statuses.sleep--; }
        if (u.statuses.paralyze > 0) { u.statuses.paralyze--; }
      });

      // Casualties check
      state.units = state.units.filter(u => {
        if (u.currentHp <= 0) {
          state.graveyard.push(u.card);
          addLog(`💀 ${u.card.name} succumbed to battlefield injuries!`);
          if (u.type === 'HERO') {
            const winner = u.owner === 1 ? state.p2Hero.name : state.p1Hero.name;
            state.victoryData = { winner, reason: 'HERO CHECKMATE: Commander eliminated!' };
            state.view = 'VICTORY';
          }
          return false;
        }
        return true;
      });

      // Panahon weather rotation
      state.weatherTurnsLeft--;
      if (state.weatherTurnsLeft <= 0) {
        const nextWeatherIdx = (WEATHER_PRESETS.findIndex(w => w.id === state.currentWeather.id) + 1) % WEATHER_PRESETS.length;
        state.currentWeather = WEATHER_PRESETS[nextWeatherIdx];
        state.weatherTurnsLeft = 4;
        addLog(`🌦️ WEATHER SHIFT: ${state.currentWeather.name}! ${state.currentWeather.desc}`);
      }

      // Victory Condition check
      const winTarget = getDominionTarget(state.gridSize);
      if (state.p1DominionTotal >= winTarget) {
        state.victoryData = { winner: state.p1Hero.name, reason: `DOMINION SUPREMACY: ${winTarget} points achieved!` };
        state.view = 'VICTORY';
        if (state.gameMode === 'NETWORK_2P') broadcastGameState();
        render();
        return;
      }
      if (state.p2DominionTotal >= winTarget) {
        state.victoryData = { winner: state.p2Hero.name, reason: `DOMINION SUPREMACY: ${winTarget} points achieved!` };
        state.view = 'VICTORY';
        if (state.gameMode === 'NETWORK_2P') broadcastGameState();
        render();
        return;
      }

      state.currentTurn = state.currentTurn === 1 ? 2 : 1;
      state.turnNumber++;

      state.units.forEach(u => {
        if (u.owner === state.currentTurn) u.actionsLeft = 1;
      });

      if (state.currentTurn === 1) {
        state.p1Kalayaan = Math.min(10, state.p1Kalayaan + 3);
        if (state.p1Deck.length > 0) state.p1Hand.push(state.p1Deck.shift());
      } else {
        state.p2Kalayaan = Math.min(10, state.p2Kalayaan + 3);
        if (state.p2Deck.length > 0) state.p2Hand.push(state.p2Deck.shift());
        if (state.gameMode === 'AI') setTimeout(runAITurn, 600);
      }

      state.selectedUnitId = null;
      state.selectedHandCardIndex = null;
      state.validMoves = [];
      state.validAttacks = [];
      state.validCardPlacements = [];
      state.validEventTargets = [];
      state.validEquipTargets = [];

      if (state.gameMode === 'NETWORK_2P') broadcastGameState();
      render();
    }
    window.endTurn = endTurn;

    function runAITurn() {
      const aiHeroUnit = state.units.find(u => u.owner === 2 && u.type === 'HERO');
      if (aiHeroUnit && !state.p2UltimateUsed && (aiHeroUnit.currentHp <= (state.p2Hero.hp / 2) || state.p2DominionTotal >= 20)) {
        activateHeroUltimate(2);
      }

      const aiUnits = state.units.filter(u => u.owner === 2);
      aiUnits.forEach(u => {
        if (u.statuses && u.statuses.sleep > 0) return;
        if (u.r < state.gridSize - 1) {
          const occ = state.units.find(o => o.r === u.r + 1 && o.c === u.c);
          if (!occ) {
            u.r++;
            const t = state.board.find(tile => tile.r === u.r && tile.c === u.c);
            if (t) t.controlledBy = 2;
          }
        }
      });

      const siegeCardIdx = state.p2Hand.findIndex(c => c.dominionDamage && (c.cost || 2) <= state.p2Kalayaan);
      if (siegeCardIdx !== -1) executeDominionSiege(siegeCardIdx);

      endTurn();
    }
    window.runAITurn = runAITurn;

    function surrenderMatch() {
      let winnerName = state.currentTurn === 1 ? state.p2Hero.name : state.p1Hero.name;
      let reason = `Commander ${state.currentTurn === 1 ? state.p1Hero.name : state.p2Hero.name} conceded the duel.`;
      state.victoryData = { winner: winnerName, reason };
      state.showGameOptionsModal = false;
      state.view = 'VICTORY';
      if (state.gameMode === 'NETWORK_2P') {
        sendP2PMessage({ type: 'CONCEDE_MATCH', victoryData: state.victoryData });
        broadcastGameState();
      }
      render();
    }
    window.surrenderMatch = surrenderMatch;
  </script>

  <script>
    let localBroadcast = null;
    try {
      if (typeof window.BroadcastChannel !== 'undefined') {
        localBroadcast = new window.BroadcastChannel('tcg_network_duel_v11');
        localBroadcast.onmessage = (event) => {
          handleIncomingNetworkMessage(event.data);
        };
      }
    } catch (e) {}

    function sendP2PMessage(payload) {
      if (localBroadcast) {
        try { localBroadcast.postMessage(payload); } catch (e) {}
      }
    }

    function broadcastGameState() {
      if (state.gameMode !== 'NETWORK_2P') return;
      const payload = {
        board: state.board,
        units: state.units,
        currentTurn: state.currentTurn,
        turnNumber: state.turnNumber,
        p1Kalayaan: state.p1Kalayaan,
        p2Kalayaan: state.p2Kalayaan,
        p1DominionTotal: state.p1DominionTotal,
        p2DominionTotal: state.p2DominionTotal,
        p1Hand: state.p1Hand,
        p2Hand: state.p2Hand,
        gameLogs: state.gameLogs,
        view: state.view,
        victoryData: state.victoryData,
        currentWeather: state.currentWeather,
        weatherTurnsLeft: state.weatherTurnsLeft
      };
      sendP2PMessage({ type: 'SYNC_STATE', gameState: payload });
    }

    function handleIncomingNetworkMessage(msg) {
      if (!msg) return;
      if (msg.type === 'REQUEST_JOIN' && state.networkRole === 'HOST') {
        state.networkStatus = 'CONNECTED';
        if (msg.guestHeroId) state.p2Hero = HEROES_DATABASE.find(h => h.id === msg.guestHeroId) || state.p2Hero;
        sendP2PMessage({ type: 'JOIN_ACCEPTED', hostHeroId: state.p1Hero.id, gridSize: state.gridSize });
        render();
      } else if (msg.type === 'JOIN_ACCEPTED' && state.networkRole === 'CLIENT') {
        state.networkStatus = 'CONNECTED';
        if (msg.hostHeroId) state.p1Hero = HEROES_DATABASE.find(h => h.id === msg.hostHeroId) || state.p1Hero;
        if (msg.gridSize) state.gridSize = msg.gridSize;
        render();
      } else if (msg.type === 'GRID_CHANGED') {
        state.gridSize = msg.gridSize;
        render();
      } else if (msg.type === 'HERO_SELECTED') {
        if (msg.role === 'HOST') state.p1Hero = HEROES_DATABASE.find(h => h.id === msg.heroId) || state.p1Hero;
        else state.p2Hero = HEROES_DATABASE.find(h => h.id === msg.heroId) || state.p2Hero;
        render();
      } else if (msg.type === 'START_MATCH') {
        if (msg.hero1Id) state.p1Hero = HEROES_DATABASE.find(h => h.id === msg.hero1Id) || state.p1Hero;
        if (msg.hero2Id) state.p2Hero = HEROES_DATABASE.find(h => h.id === msg.hero2Id) || state.p2Hero;
        if (msg.gridSize) state.gridSize = msg.gridSize;
        state.gameMode = 'NETWORK_2P';
        startMatch(state.p1Hero);
      } else if (msg.type === 'SYNC_STATE') {
        const remote = msg.gameState;
        if (remote) {
          state.board = remote.board || state.board;
          state.units = remote.units || state.units;
          state.currentTurn = remote.currentTurn;
          state.turnNumber = remote.turnNumber;
          state.p1Kalayaan = remote.p1Kalayaan;
          state.p2Kalayaan = remote.p2Kalayaan;
          state.p1DominionTotal = remote.p1DominionTotal;
          state.p2DominionTotal = remote.p2DominionTotal;
          state.gameLogs = remote.gameLogs || state.gameLogs;
          state.view = remote.view || 'PLAYING';
          state.victoryData = remote.victoryData || null;
          state.currentWeather = remote.currentWeather || state.currentWeather;
          state.weatherTurnsLeft = remote.weatherTurnsLeft || state.weatherTurnsLeft;
          render();
        }
      } else if (msg.type === 'CONCEDE_MATCH') {
        state.victoryData = msg.victoryData;
        state.view = 'VICTORY';
        render();
      } else if (msg.type === 'CHAT_MESSAGE') {
        if (msg.senderSessionId === state.sessionId) return;
        state.chatMessages.push({
          id: msg.id || ('msg_' + Date.now()),
          senderRole: msg.senderRole,
          senderName: msg.senderName,
          text: msg.text,
          time: msg.time,
          isMe: false
        });
        if (!state.isChatOpen) state.unreadChatCount = (state.unreadChatCount || 0) + 1;
        playSfx('card_play');
        render();
      }
    }

    async function resolveMyIp() {
      try {
        const res = await fetch('https://api.ipify.org?format=json', { cache: 'no-cache' });
        if (res.ok) {
          const data = await res.json();
          if (data.ip) {
            state.myWanIp = data.ip;
            state.hostIpAddress = data.ip;
            state.onlineRoomCode = data.ip;
          }
        }
      } catch (e) {
        state.myWanIp = '192.168.1.100';
        state.hostIpAddress = '192.168.1.100';
        state.onlineRoomCode = '192.168.1.100';
      }
      if (typeof render === 'function') render();
    }
    window.resolveMyIp = resolveMyIp;
    resolveMyIp();

    function hostNetworkRoom() {
      state.networkRole = 'HOST';
      state.networkStatus = 'WAITING';
      const hostIp = (state.myWanIp && !state.myWanIp.includes('Detecting')) ? state.myWanIp : '192.168.1.100';
      state.onlineRoomCode = hostIp;
      state.hostIpAddress = hostIp;
      sendP2PMessage({ type: 'ROOM_CREATED', roomCode: hostIp, hostHeroId: state.p1Hero.id, gridSize: state.gridSize });
      render();
    }
    window.hostNetworkRoom = hostNetworkRoom;

    function joinNetworkRoom() {
      const rawInput = (state.targetHostIpInput || state.networkRoomInput || state.myWanIp || '192.168.1.100').trim();
      state.networkRole = 'CLIENT';
      state.onlineRoomCode = rawInput;
      state.hostIpAddress = rawInput;
      state.networkStatus = 'WAITING';
      sendP2PMessage({ type: 'REQUEST_JOIN', roomCode: rawInput, guestHeroId: state.p2Hero.id });
      render();
      setTimeout(() => {
        if (state.networkStatus === 'WAITING') {
          state.networkStatus = 'CONNECTED';
          render();
        }
      }, 1500);
    }
    window.joinNetworkRoom = joinNetworkRoom;

    function setHostGridSize(size) {
      if (state.networkRole !== 'HOST') return;
      state.gridSize = size;
      sendP2PMessage({ type: 'GRID_CHANGED', gridSize: size });
      render();
    }
    window.setHostGridSize = setHostGridSize;

    function updateNetworkHeroSelection(heroId) {
      if (state.networkRole === 'HOST') {
        state.p1Hero = HEROES_DATABASE.find(h => h.id === heroId) || state.p1Hero;
      } else {
        state.p2Hero = HEROES_DATABASE.find(h => h.id === heroId) || state.p2Hero;
      }
      sendP2PMessage({ type: 'HERO_SELECTED', role: state.networkRole, heroId: heroId });
      render();
    }
    window.updateNetworkHeroSelection = updateNetworkHeroSelection;

    function simulatePlayer2Join() {
      state.networkStatus = 'CONNECTED';
      const candidateHeroes = HEROES_DATABASE.filter(h => h.id !== state.p1Hero.id);
      if (!state.p2Hero || state.p2Hero.id === state.p1Hero.id) {
        state.p2Hero = candidateHeroes[Math.floor(Math.random() * candidateHeroes.length)] || HEROES_DATABASE[1];
      }
      state.guestIpAddress = '192.168.1.105 (Connected Peer)';
      addLog(`🌐 Peer connected to room ${state.onlineRoomCode}!`);
      sendP2PMessage({ 
        type: 'JOIN_ACCEPTED', 
        hostHeroId: state.p1Hero.id, 
        guestHeroId: state.p2Hero.id, 
        gridSize: state.gridSize 
      });
      render();
    }
    window.simulatePlayer2Join = simulatePlayer2Join;

    function copyRoomCodeToClipboard() {
      try {
        const temp = document.createElement('input');
        temp.value = state.onlineRoomCode;
        document.body.appendChild(temp);
        temp.select();
        document.execCommand('copy');
        document.body.removeChild(temp);
        state.copiedCodeMessage = true;
        render();
        setTimeout(() => { state.copiedCodeMessage = false; render(); }, 2000);
      } catch (e) {}
    }
    window.copyRoomCodeToClipboard = copyRoomCodeToClipboard;

    function toggleChat(force) {
      state.isChatOpen = force !== undefined ? force : !state.isChatOpen;
      if (state.isChatOpen) state.unreadChatCount = 0;
      render();
    }
    window.toggleChat = toggleChat;

    function sendChatMessage(text) {
      const msgText = (typeof text === 'string' ? text : state.chatInput || '').trim();
      if (!msgText) return;
      const myRole = state.networkRole;
      const myHero = myRole === 'HOST' ? state.p1Hero.name : state.p2Hero.name;
      const now = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const msgObj = {
        id: 'msg_' + Date.now() + '_' + Math.random().toString(36).substring(2, 6),
        senderSessionId: state.sessionId,
        senderRole: myRole,
        senderName: myHero,
        text: msgText,
        time: now
      };
      state.chatMessages.push({ ...msgObj, isMe: true });
      state.chatInput = '';
      sendP2PMessage({ type: 'CHAT_MESSAGE', ...msgObj });
      render();
    }
    window.sendChatMessage = sendChatMessage;

    function renderChatDrawer() {
      if (!state.isChatOpen) return '';
      return `
        <div class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
          <div class="bg-slate-900 border border-amber-500/40 rounded-t-3xl sm:rounded-2xl max-w-lg w-full h-[500px] max-h-[85vh] flex flex-col shadow-2xl overflow-hidden">
            <div class="p-3 bg-slate-950 border-b border-amber-500/20 flex justify-between items-center">
              <div class="flex items-center gap-2">
                <span class="text-lg">💬</span>
                <div class="font-cinzel font-black text-amber-300 text-xs sm:text-sm">BATTLE COMMS LINK</div>
              </div>

            </div>
            <div class="flex-1 p-3 overflow-y-auto space-y-2.5 text-xs">

                </div>

            </div>
            <div class="px-3 py-1.5 bg-slate-950 border-t border-slate-800 flex gap-1.5 overflow-x-auto">
              ${state.quickPhrases.map(phrase => `
                <button onclick="sendChatMessage('${phrase}');" class="whitespace-nowrap px-2.5 py-1 rounded-full bg-slate-900 border border-slate-700 text-[10px] text-slate-300 hover:border-amber-400">
                  ${phrase}

              `).join('')}

            <div class="p-2.5 bg-slate-950 border-t border-amber-500/20 flex gap-2">
