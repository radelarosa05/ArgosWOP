              <button onclick="sendChatMessage();" class="px-4 py-2 bg-amber-500 text-slate-950 font-cinzel font-black text-xs rounded-xl shadow">SEND</button>
            </div>
          </div>
        </div>
      `;
    }
    window.renderChatDrawer = renderChatDrawer;
  </script>

  <script>
    function render() {
      const app = document.getElementById('app');
      if (!app) return;

      const winTarget = getDominionTarget(state.gridSize);

      if (state.view === 'MENU') {
        app.innerHTML = `
          <div class="flex-1 flex flex-col items-center justify-center p-4 sm:p-6 text-center relative overflow-hidden">
            <button onclick="state.showAssetConfigModal = true; render();" 
                    title="Asset & Database Configuration" 
                    class="absolute top-4 right-4 z-20 w-8 h-8 rounded-full bg-slate-950/60 hover:bg-slate-900 border border-slate-800 hover:border-amber-500/40 text-slate-500 hover:text-amber-300 text-xs flex items-center justify-center transition shadow">
              ⚙️
            </button>

            <div class="relative z-10 mb-4 flex flex-col items-center">
              <div class="text-5xl sm:text-6xl mb-2 drop-shadow-[0_0_20px_rgba(250,204,21,0.5)]">🇵🇭</div>
              <h1 class="font-cinzel font-black text-2xl sm:text-4xl text-transparent bg-clip-text bg-gradient-to-r from-amber-300 via-yellow-400 to-amber-500 tracking-wider">
                WAR OF THE PHILIPPINES
              </h1>
              <p class="font-cinzel-dec text-xs tracking-[0.3em] text-amber-300 mt-1 uppercase">Advanced Tactical TCG Edition</p>
              <div class="mt-2 inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-amber-950/80 border border-amber-500/50 text-[10px] font-mono text-amber-300">
                <span>✨</span><span>72 Heroes • Wi-Fi WAN • Deck Builder • Supply Lines • Ultimates</span>
              </div>
            </div>

            <div class="relative z-10 flex flex-col gap-2.5 w-full max-w-sm">
              <button onclick="state.gameMode = 'AI'; state.selectedDifficulty = 'EASY'; state.view = 'HERO_SELECT'; render();" 
                      class="w-full py-3.5 px-6 bg-gradient-to-r from-amber-500 via-yellow-500 to-amber-600 hover:from-amber-400 text-slate-950 font-cinzel font-black text-sm rounded-2xl shadow-xl transition transform hover:-translate-y-0.5 border border-amber-300/60 flex items-center justify-center gap-2">
                <span>⚔️</span>
                <span class="tracking-wider">CAMPAIGN (1P VS AI)</span>
              </button>

              <button onclick="state.view = 'TWO_PLAYER_MENU'; render();" 
                      class="w-full py-3.5 px-6 bg-gradient-to-r from-blue-700 via-indigo-700 to-slate-900 hover:from-blue-600 text-white font-cinzel font-black text-sm rounded-2xl shadow-xl transition transform hover:-translate-y-0.5 border border-blue-400/40 flex items-center justify-center gap-2">
                <span>👥</span>
                <span class="tracking-wider">TWO PLAYER BATTLE (WI-FI / LOCAL)</span>
              </button>

              <div class="grid grid-cols-3 gap-2 mt-1">
                <button onclick="state.view = 'DECK_BUILDER'; render();" 
                        class="py-2.5 px-2 bg-slate-900/90 hover:bg-slate-800 border border-amber-500/30 hover:border-amber-400 text-amber-300 font-bold text-[11px] rounded-xl transition flex flex-col items-center justify-center gap-1 shadow">
                  <span class="text-base">🎴</span>
                  <span class="truncate">DECK (${state.customDeck.length}/50)</span>
                </button>

                <button onclick="state.view = 'INSTRUCTIONS'; render();" 
                        class="py-2.5 px-2 bg-slate-900/90 hover:bg-slate-800 border border-slate-700 hover:border-slate-500 text-slate-200 font-bold text-[11px] rounded-xl transition flex flex-col items-center justify-center gap-1 shadow">
                  <span class="text-base">📖</span>
                  <span>HOW TO PLAY</span>
                </button>

                <button onclick="state.view = 'ARCHIVES'; render();" 
                        class="py-2.5 px-2 bg-slate-900/90 hover:bg-slate-800 border border-slate-700 hover:border-slate-500 text-slate-200 font-bold text-[11px] rounded-xl transition flex flex-col items-center justify-center gap-1 shadow">
                  <span class="text-base">📚</span>
                  <span>LORE CODEX</span>
                </button>
              </div>
            </div>

            ${state.showAssetConfigModal ? `
              <div class="fixed inset-0 bg-black/75 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                <div class="bg-slate-900 border border-amber-500/60 rounded-3xl p-5 max-w-md w-full shadow-2xl space-y-4 text-left">
                  <div class="flex justify-between items-center pb-2 border-b border-slate-800">
                    <div class="font-cinzel font-black text-amber-400 text-sm flex items-center gap-2">
                      <span>📁</span> CARD ASSET FOLDER & XML DATABASE
                    </div>
                    <button onclick="state.showAssetConfigModal = false; render();" class="text-slate-400 hover:text-white text-xs font-bold px-2 py-1 bg-slate-800 rounded-lg">✕</button>
                  </div>
                  <div class="space-y-1.5">
                    <div class="text-[11px] font-mono text-amber-300 font-bold">1. CARD IMAGE FOLDER POINTER</div>
                    <div class="flex gap-2">
                      <input type="text" value="${state.imageFolderPath}" oninput="state.imageFolderPath = this.value;" class="flex-1 bg-slate-950 border border-slate-700 text-xs rounded-xl px-3 py-2 text-slate-100 font-mono" />
                      <select onchange="state.imageExtension = this.value;" class="bg-slate-950 border border-slate-700 text-xs rounded-xl px-2 text-slate-200 font-mono">
                        <option value=".png" ${state.imageExtension === '.png' ? 'selected' : ''}>.png</option>
                        <option value=".jpg" ${state.imageExtension === '.jpg' ? 'selected' : ''}>.jpg</option>
                        <option value=".webp" ${state.imageExtension === '.webp' ? 'selected' : ''}>.webp</option>
                      </select>
                    </div>
                  </div>
                  <div class="space-y-2 pt-2 border-t border-slate-800">
                    <div class="text-[11px] font-mono text-cyan-300 font-bold">2. EXTERNAL XML CARD DATABASE</div>
                    <div class="flex gap-2">
                      <button onclick="exportDatabaseToXml();" class="flex-1 py-2 px-3 bg-amber-600 text-slate-950 font-cinzel font-black text-[11px] rounded-xl shadow">

                      </button>
                      <label class="flex-1 py-2 px-3 bg-cyan-700 text-white font-cinzel font-bold text-[11px] rounded-xl shadow text-center cursor-pointer">
                        <span>📥 IMPORT XML</span>
                        <input type="file" accept=".xml" onchange="handleXmlFileUpload(event); state.showAssetConfigModal = false;" class="hidden" />

                  <button onclick="state.showAssetConfigModal = false; render();" class="w-full py-2 bg-slate-800 text-slate-200 font-cinzel font-bold text-xs rounded-xl">SAVE & CLOSE</button>
                </div>
              </div>
            ` : ''}
          </div>
        `;
        return;
      }

      if (state.view === 'HERO_SELECT') {
        const cat = state.heroSelectCategory || 'ALL';
        const q = (state.heroSelectSearch || '').trim().toLowerCase();

        let filtered = HEROES_DATABASE;
        if (cat === 'HISTORICAL') filtered = HISTORICAL_HEROES;
        else if (cat === 'FICTIONAL') filtered = FICTIONAL_HEROES;

        if (q) {
          filtered = filtered.filter(h => 
            h.name.toLowerCase().includes(q) ||
            h.title.toLowerCase().includes(q) ||
            h.homeland.toLowerCase().includes(q) ||
            h.effect.toLowerCase().includes(q)
          );
        }

        app.innerHTML = `
          <div class="flex-1 p-3 sm:p-5 max-w-6xl mx-auto w-full flex flex-col">
            <div class="flex flex-col sm:flex-row justify-between items-center gap-2 mb-3 pb-2 border-b border-slate-800">
              <h2 class="text-lg sm:text-xl font-cinzel font-black text-amber-400 flex items-center gap-2">
                <span>👑</span> CHOOSE SUPREME COMMANDER
              </h2>
              <div class="flex items-center gap-2">
                <input type="text" placeholder="Search heroes..." value="${state.heroSelectSearch || ''}"
                       oninput="state.heroSelectSearch = this.value; render();"
                       class="bg-slate-950 border border-slate-800 rounded-xl px-3 py-1.5 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-amber-400" />
                <button onclick="state.view = 'MENU'; render();" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-xs rounded-xl text-slate-300 font-bold">
                  ← Menu
                </button>
              </div>
            </div>

            <div class="flex gap-2 mb-3 overflow-x-auto pb-1">
              <button onclick="state.heroSelectCategory = 'ALL'; render();"
                      class="px-3.5 py-1.5 rounded-xl font-cinzel font-bold text-xs whitespace-nowrap transition ${cat === 'ALL' ? 'bg-amber-500 text-slate-950 shadow-md font-black' : 'bg-slate-900 text-slate-400 border border-slate-800'}">
                ALL COMMANDERS (${HEROES_DATABASE.length})
              </button>
              <button onclick="state.heroSelectCategory = 'HISTORICAL'; render();"
                      class="px-3.5 py-1.5 rounded-xl font-cinzel font-bold text-xs whitespace-nowrap transition ${cat === 'HISTORICAL' ? 'bg-amber-500 text-slate-950 shadow-md font-black' : 'bg-slate-900 text-slate-400 border border-slate-800'}">
                HISTORICAL (50)
              </button>
              <button onclick="state.heroSelectCategory = 'FICTIONAL'; render();"
                      class="px-3.5 py-1.5 rounded-xl font-cinzel font-bold text-xs whitespace-nowrap transition ${cat === 'FICTIONAL' ? 'bg-purple-600 text-white shadow-md font-black ring-1 ring-purple-400' : 'bg-slate-900 text-slate-400 border border-slate-800'}">
                FICTIONAL (22)
              </button>
            </div>

            <div class="flex gap-2 mb-3 items-center text-xs font-mono">
              <span class="text-slate-400 font-bold">MAP SIZE:</span>
              ${['EASY', 'MODERATE', 'HARD', 'EXTREME'].map(diff => `
                <button onclick="state.selectedDifficulty = '${diff}'; render();" 
                        class="px-2.5 py-1 rounded-lg font-cinzel font-bold text-[11px] transition ${state.selectedDifficulty === diff ? 'bg-amber-500 text-slate-950 font-black' : 'bg-slate-900 text-slate-400 border border-slate-800'}">
                  ${diff === 'EASY' ? '5x5 (80 pts)' : diff === 'MODERATE' ? '7x7 (120 pts)' : diff === 'HARD' ? '9x9 (160 pts)' : '12x12 (220 pts)'}
                </button>
              `).join('')}
            </div>

            <div class="flex-1 overflow-y-auto max-h-[52vh] grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3 pr-1 touch-scroll">
              ${filtered.map(hero => {
                const isHist = hero.heroCategory === 'HISTORICAL';
                const isSelected = state.p1Hero.id === hero.id;
                return `
                  <div onclick="state.p1Hero = HEROES_DATABASE.find(h => h.id === '${hero.id}'); render();"
                       class="p-3 rounded-2xl border cursor-pointer transition card-foil flex flex-col justify-between ${
                         isSelected 
                           ? (isHist ? 'bg-amber-950/80 border-amber-400 ring-2 ring-amber-400 shadow-xl' : 'bg-purple-950/80 border-purple-400 ring-2 ring-purple-400 shadow-xl')
                           : 'bg-slate-900/70 border-slate-800 hover:border-slate-700'
                       }">
                    <div>
                      <div class="flex justify-between items-start">
                        <span class="text-3xl">${hero.avatarSymbol}</span>
                        <div class="flex items-center gap-1 font-mono text-[9px] font-bold">
                          <span class="bg-red-950 text-red-300 px-1.5 py-0.5 rounded border border-red-500/30">⚔️ ${hero.atk}</span>
                          <span class="bg-blue-950 text-blue-300 px-1.5 py-0.5 rounded border border-blue-500/30">🛡️ ${hero.def}</span>
                          <span class="bg-emerald-950 text-emerald-300 px-1.5 py-0.5 rounded border border-emerald-500/30">❤️ ${hero.hp}</span>
                        </div>
                      </div>
                      <div class="font-cinzel font-black text-sm text-slate-100 mt-1.5">${hero.name}</div>
                      <div class="text-[10px] ${isHist ? 'text-amber-400' : 'text-purple-300'} font-medium truncate">${hero.title}</div>
                      <div class="text-[9px] text-slate-400 font-mono mt-0.5 truncate">📍 ${hero.homeland}</div>
                    </div>
                    <div class="mt-2 pt-1 border-t border-slate-800 text-[10px] text-slate-300">
                      <div class="text-[9px] text-amber-400 font-bold">🌟 ULTIMATE: ${hero.ultimateName || 'Sigaw ng Bayan'}</div>
                      <div class="text-slate-400 text-[9px] line-clamp-1">${hero.ultimateDesc || 'Unleashes tactical surge.'}</div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>

            <button onclick="startMatch(state.p1Hero);" 
                    class="mt-3 w-full py-3 bg-gradient-to-r from-amber-500 via-yellow-500 to-amber-600 hover:from-amber-400 text-slate-950 font-cinzel font-black text-sm rounded-2xl shadow-xl transition transform active:scale-98">
              ⚔️ ENTER BATTLEFIELD AS ${state.p1Hero.name.toUpperCase()}
            </button>
          </div>
        `;
        return;
      }

      if (state.view === 'PLAYING') {
        const isClient = state.gameMode === 'NETWORK_2P' && state.networkRole === 'CLIENT';
        const isP1Turn = state.currentTurn === 1;
        const myTurn = (state.gameMode === 'LOCAL_2P') 
          ? true 
          : (state.gameMode !== 'NETWORK_2P' 
              ? (state.currentTurn === 1) 
              : (state.networkRole === 'HOST' ? isP1Turn : !isP1Turn));

        const meHero = (state.gameMode === 'LOCAL_2P') 
          ? (isP1Turn ? state.p1Hero : state.p2Hero) 
          : (isClient ? state.p2Hero : state.p1Hero);
        const oppHero = (state.gameMode === 'LOCAL_2P') 
          ? (isP1Turn ? state.p2Hero : state.p1Hero) 
          : (isClient ? state.p1Hero : state.p2Hero);
        const meDominion = (state.gameMode === 'LOCAL_2P') 
          ? (isP1Turn ? state.p1DominionTotal : state.p2DominionTotal) 
          : (isClient ? state.p2DominionTotal : state.p1DominionTotal);
        const oppDominion = (state.gameMode === 'LOCAL_2P') 
          ? (isP1Turn ? state.p2DominionTotal : state.p1DominionTotal) 
          : (isClient ? state.p1DominionTotal : state.p2DominionTotal);
        const meKalayaan = (state.gameMode === 'LOCAL_2P') 
          ? (isP1Turn ? state.p1Kalayaan : state.p2Kalayaan) 
          : (isClient ? state.p2Kalayaan : state.p1Kalayaan);
        const oppKalayaan = (state.gameMode === 'LOCAL_2P') 
          ? (isP1Turn ? state.p2Kalayaan : state.p1Kalayaan) 
          : (isClient ? state.p1Kalayaan : state.p2Kalayaan);
        const myHand = (state.gameMode === 'LOCAL_2P') 
          ? (isP1Turn ? state.p1Hand : state.p2Hand) 
          : (isClient ? state.p2Hand : state.p1Hand);
        const oppHandCount = (state.gameMode === 'LOCAL_2P') 
          ? (isP1Turn ? state.p2Hand.length : state.p1Hand.length) 
          : (isClient ? state.p1Hand.length : state.p2Hand.length);

        const p1Fatigue = getColonialFatiguePenalty(1);
        const p2Fatigue = getColonialFatiguePenalty(2);
        const meFatigue = isP1Turn ? p1Fatigue : p2Fatigue;

        const myCommanderUnit = state.units.find(u => u.owner === (isP1Turn ? 1 : 2) && u.type === 'HERO');
        const canUseUlt = myCommanderUnit && (isP1Turn ? !state.p1UltimateUsed : !state.p2UltimateUsed) &&
                          (myCommanderUnit.currentHp <= (meHero.hp / 2) || meDominion >= 20);

        const displayedBoard = isClient 
          ? [...state.board].sort((a, b) => (b.r - a.r) || (a.c - b.c))
          : [...state.board];

        const selectedUnit = state.selectedUnitId ? state.units.find(u => u.id === state.selectedUnitId) : null;
        const selectedHandCard = (state.selectedHandCardIndex !== null) ? myHand[state.selectedHandCardIndex] : null;
        const inspectedCard = (!selectedUnit && !selectedHandCard && state.activeCardPreview) 
          ? state.activeCardPreview 
          : null;

        app.innerHTML = `
          <!-- Top Weather & Battlefield Status Bar -->
          <div class="bg-slate-900/95 border-b border-amber-500/20 px-3 py-2 flex justify-between items-center shadow-lg backdrop-blur-md">
            <div class="flex items-center gap-2.5">
              <div class="w-10 h-10 rounded-2xl ${isClient ? 'bg-amber-950/90 border-amber-500/50' : 'bg-red-950/90 border-red-500/50'} border flex items-center justify-center text-xl shadow">
                ${oppHero.avatarSymbol}
              </div>
              <div>
                <div class="flex items-center gap-1.5">
                  <span class="text-xs font-cinzel font-black ${isClient ? 'text-amber-400' : 'text-red-400'} truncate max-w-[120px] sm:max-w-none">
                    ${oppHero.name}
                  </span>
                  <span class="text-[9px] font-mono px-1.5 py-0.2 bg-slate-950 rounded text-slate-400 border border-slate-800">
                    ${isClient ? 'HOST P1' : 'OPPONENT'}
                  </span>
                </div>
                <div class="text-[10px] text-slate-400 font-mono flex items-center gap-2">
                  <span>Dominion: <b class="text-slate-200">${oppDominion}</b>/${winTarget}</span>
                  <span>•</span>
                  <span>⚡ <b class="text-amber-300">${oppKalayaan}</b></span>
                  <span>•</span>
                  <span>🎴 <b class="text-slate-300">${oppHandCount}</b></span>
                </div>
              </div>
            </div>

            <!-- Weather Widget in Center -->
            <div class="flex flex-col items-center gap-0.5">
              <div class="flex items-center gap-1 px-2.5 py-0.5 rounded-full bg-slate-950 border border-cyan-500/40 text-[10px] font-mono shadow">
                <span>${state.currentWeather.symbol}</span>
                <span class="text-cyan-300 font-bold">${state.currentWeather.name}</span>
                <span class="text-slate-500">(${state.weatherTurnsLeft}t)</span>
              </div>
              <div class="flex items-center gap-1.5 mt-0.5">
                <span class="px-2 py-0.2 rounded-full text-[9px] font-cinzel font-black shadow ${myTurn ? 'bg-emerald-500 text-slate-950 animate-pulse' : 'bg-slate-800 text-slate-400 border border-slate-700'}">
                  ${myTurn ? 'YOUR TURN' : "OPPONENT'S TURN"}
                </span>
                <button onclick="state.showGameOptionsModal = true; render();" 
                        class="px-2 py-0.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-[10px] font-cinzel font-bold rounded text-slate-200 shadow transition"
                        title="Battle Options / Concede">
                  ⚙️
                </button>
                ${state.gameMode === 'NETWORK_2P' ? `
                  <button onclick="toggleChat(true);" class="relative px-2 py-0.5 bg-indigo-950 border border-indigo-500/40 text-[9px] rounded text-indigo-200 shadow">
                    💬 ${state.unreadChatCount > 0 ? '●' : ''}
                  </button>
                ` : ''}
              </div>
            </div>

            <div class="flex items-center gap-2.5 text-right">
              <div>
                <div class="text-xs font-cinzel font-black ${isClient ? 'text-blue-400' : 'text-amber-400'} truncate max-w-[120px] sm:max-w-none">
                  ${meHero.name} (YOU)
                </div>
                <div class="text-[10px] text-slate-400 font-mono">
                  Dominion: <b class="text-amber-400">${meDominion}</b>/${winTarget}
                </div>
              </div>
              <div class="w-10 h-10 rounded-2xl ${isClient ? 'bg-blue-950/90 border-blue-500/50' : 'bg-amber-950/90 border-amber-500/50'} border flex items-center justify-center text-xl shadow">
                ${meHero.avatarSymbol}
              </div>
            </div>
          </div>

          <!-- Colonial Fatigue Notice if Overextended -->
          ${meFatigue > 0 ? `
            <div class="bg-amber-950/70 border-b border-amber-500/30 px-3 py-1 text-center text-[10px] font-mono text-amber-300 flex items-center justify-center gap-1.5">
              <span>⚠️</span>
              <span><b>COLONIAL FATIGUE ACTIVE:</b> Extended supply lines (+⚡${meFatigue} Kalayaan cost to deploy cards).</span>
            </div>
          ` : ''}

            <!-- LEFT INSPECTOR PANEL (COMPLETE TACTICAL INSPECTOR) -->

                <span class="font-cinzel font-black text-xs text-amber-300 flex items-center gap-1.5">

                  <span>TACTICAL INSPECTOR</span>

                  selectedUnit

                    : selectedHandCard 
                      ? 'bg-purple-950 text-purple-300 border border-purple-500/50 font-bold animate-pulse'
                      : inspectedCard
                        ? 'bg-cyan-950 text-cyan-300 border border-cyan-500/40 font-bold'
                        : 'bg-slate-950 text-slate-500 border border-slate-800'
                }">
                  ${selectedUnit ? (selectedUnit.owner === 1 ? 'PLAYER 1 UNIT' : 'PLAYER 2 UNIT') : selectedHandCard ? 'HAND CARD' : inspectedCard ? (inspectedCard.category ? 'TERRITORY TILE' : 'INSPECTED ARTIFACT') : 'NO SELECTION'}
                </span>

    }
    window.render = render;

    window.onload = function() {
      loadCardsFromXmlUrl('cards.xml');
      render();
    };
    render();
  </script>
