      theme: {

      img.onerror = null;
      var container = img.parentElement || img;
      container.innerHTML = `
        <div class="w-64 sm:w-80 p-4 rounded-2xl bg-gradient-to-b from-amber-950/80 via-slate-900 to-amber-950/80 border-2 border-amber-500/60 shadow-[0_0_35px_rgba(245,158,11,0.25)] flex flex-col items-center justify-center text-center select-none transition-transform hover:scale-[1.02] duration-300">

              <circle cx="50" cy="50" r="30" stroke="currentColor" stroke-width="2.5" fill="rgba(217,119,6,0.15)"/>

    window.handleLogoError = handleLogoError;

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at 50% 20%, #151b2e 0%, #080c16 55%, #04060a 100%);
      color: #f1f5f9;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      touch-action: manipulation;
    }
    .font-cinzel { font-family: 'Cinzel', serif; }
    .font-cinzel-dec { font-family: 'Cinzel Decorative', serif; }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0b0f19; }
    ::-webkit-scrollbar-thumb { background: #ca8a04; border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: #eab308; }

    .card-foil {
      position: relative;
      overflow: hidden;
    }
    .card-foil::after {
      content: '';
      position: absolute;
      top: -110%;
      left: -110%;
      width: 220%;
      height: 220%;
      background: linear-gradient(135deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.06) 45%, rgba(255,215,0,0.18) 50%, rgba(255,255,255,0.06) 55%, rgba(255,255,255,0) 100%);
      transform: rotate(25deg);
      transition: all 0.6s ease;
      pointer-events: none;
    }
    .card-foil:hover::after {
      top: 100%;
      left: 100%;
    }

    .gilded-border {
      border: 1px solid rgba(234, 179, 8, 0.45);
      box-shadow: 0 0 15px rgba(234, 179, 8, 0.12), inset 0 0 10px rgba(234, 179, 8, 0.05);
    }
    .gilded-border-active {
      border: 2px solid #facc15;
      box-shadow: 0 0 25px rgba(250, 204, 21, 0.35), inset 0 0 15px rgba(250, 204, 21, 0.15);
    }

    .biome-city {
      background: radial-gradient(circle at top left, #3b0d0c 0%, #1f0707 70%, #130404 100%);
      border-color: rgba(239, 68, 68, 0.35);
    }
    .biome-sea {
      background: radial-gradient(circle at top left, #082f49 0%, #0c1a2c 70%, #050b14 100%);
      border-color: rgba(56, 189, 248, 0.35);
    }
    .biome-church {
      background: radial-gradient(circle at top left, #292524 0%, #1c1917 70%, #0c0a09 100%);
      border-color: rgba(251, 191, 36, 0.45);
    }
    .biome-island {
      background: radial-gradient(circle at top left, #062d1d 0%, #061a12 70%, #030e09 100%);
      border-color: rgba(52, 211, 153, 0.35);
    }

    @keyframes glowPulse {
      0%, 100% { box-shadow: 0 0 10px rgba(250, 204, 21, 0.4); }
      50% { box-shadow: 0 0 22px rgba(250, 204, 21, 0.85); }
    }
    .animate-glow-pulse { animation: glowPulse 2s infinite ease-in-out; }

    @keyframes targetAttackPulse {
      0%, 100% { box-shadow: 0 0 10px rgba(239, 68, 68, 0.4); transform: scale(1); }
      50% { box-shadow: 0 0 20px rgba(239, 68, 68, 0.85); transform: scale(1.02); }
    }
    .animate-attack-pulse { animation: targetAttackPulse 1.4s infinite ease-in-out; }

    .touch-scroll {
      -webkit-overflow-scrolling: touch;
      touch-action: pan-x pan-y;
    }
  </style>
</head>
<body class="bg-obsidian min-h-screen text-slate-100 flex flex-col antialiased">
  <div id="app" class="flex-1 flex flex-col min-h-screen"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    function playSfx(type) {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        if (type === 'card_play') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(300, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(620, ctx.currentTime + 0.12);
          gain.gain.setValueAtTime(0.18, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.12);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(); osc.stop(ctx.currentTime + 0.12);
        } else if (type === 'attack') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(170, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(50, ctx.currentTime + 0.22);
          gain.gain.setValueAtTime(0.25, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.22);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(); osc.stop(ctx.currentTime + 0.22);
        } else if (type === 'skill') {
          [440, 554, 659].forEach((f, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(f, ctx.currentTime + i * 0.06);
            gain.gain.setValueAtTime(0.15, ctx.currentTime + i * 0.06);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + i * 0.06 + 0.2);
            osc.connect(gain); gain.connect(ctx.destination);
            osc.start(ctx.currentTime + i * 0.06); osc.stop(ctx.currentTime + i * 0.06 + 0.2);
          });
        }
      } catch (e) {}
    }
    window.playSfx = playSfx;

    const HERO_NAMES = [
      'Lapu-Lapu', 'Andres Bonifacio', 'Jose Rizal', 'Gabriela Silang', 'Sultan Kudarat',
      'Apolinario Mabini', 'Emilio Aguinaldo', 'Antonio Luna', 'Melchora Aquino', 'Gregoria de Jesus',
      'Diego Silang', 'Marcelo H. del Pilar', 'Juan Luna', 'Padre Mariano Gomez', 'Padre Jose Burgos',
      'Padre Jacinto Zamora', 'Teresa Magbanua', 'Trinidad Tecson', 'Francisco Dagohoy', 'Macario Sakay',
      'Artemio Ricarte', 'Miguel Malvar', 'Vicente Lukban', 'Gregorio del Pilar', 'Panday Pira',
      'Jose Abad Santos', 'Vicente Lim', 'Josefa Llanes Escoda', 'Wenceslao Vinzons', 'Tomas Claudio',
      'Rajah Sulayman', 'Lakandula', 'Rajah Humabon', 'Princess Urduja', 'Dagami',
      'Tamblot', 'Bankaw', 'Francisco Maniago', 'Almazan', 'Hermano Pule',
      'Papa Isio', 'Simeon Ola', 'Leon Kilat', 'Roman Basa', 'Ladislao Diwa',
      'Teodoro Plata', 'Marina Dizon', 'Agueda Kahabagan', 'Gen. Licerio Gerónimo', 'Geronima Pecson'
    ];

    const HEROES_DATABASE = HERO_NAMES.map((name, i) => {
      const symbols = ['🛡️', '⚔️', '📜', '🐎', '👑', '🧠', '🚩', '💣', '👵', '🌹'];
      const homelands = ['Mactan Island', 'Tondo, Manila', 'Calamba, Laguna', 'Ilocos', 'Maguindanao', 'Batangas', 'Cavite', 'Binondo', 'Quezon City', 'Caloocan'];
      return {
        id: `h${i + 1}`,
        name: name,
        hp: 18 + (i % 7),
        atk: 5 + (i % 4),
        def: 3 + (i % 4),
        move: 2 + (i % 2),
        leadership: 4 + (i % 3),
        homeland: homelands[i % homelands.length],
        avatarSymbol: symbols[i % symbols.length],
        ability: `${name}'s Command: Allied units gain +1 ATK when fighting near homeland territory.`
      };
    });
    window.HEROES_DATABASE = HEROES_DATABASE;

    const RAW_MYTHOS_NAMES = [

      'IDIYANALE', 'AMANIKABLE', 'DUMAKULEM', 'ANITUN TABU', 'LAKAPATI ELDER', 'HAIK', 'AMIHAN', 'ULILANG KALULUWA', 'GALANG KALULUWA', 'SITAN',
      'MANGGAGAWAY', 'MANISILAT', 'HUKLUBAN', 'HANAN DAWN', 'SIDAPA', 'MAKAPTAN', 'KAPTAN', 'MAGWAYEN', 'KAN-LAON', 'LALAHON',
      'ALUNSINA', 'TUNGKUNG LANGIT', 'LIDAGAT', 'LIHANGIN', 'LIADLAW', 'LIBULAN', 'SAPPIA', 'BULALAKAW', 'SARAGNAYAN', 'MARIKUDO',
      'MANIWANTIWAN', 'MUNSAD BURABOD', 'DIWATA', 'ENGKANTO', 'ENCANTADO', 'KAPRE', 'TIKBALANG', 'NUNO SA PUNSO', 'DUWENDE', 'TIYANAK',
      'MANANANGGAL', 'ASWANG', 'WAKWAK', 'EKEK', 'SIGBIN', 'AMALANHIG', 'BERBALANG', 'BUNGISNGIS', 'SANTELMO', 'MULTO',

      'SIRENA', 'SIRENO', 'TAMAWO', 'MAMBABARANG', 'MANGKUKULAM', 'MANANAMBAL', 'BABAYLAN', 'CATALONAN', 'KATALONAN', 'ASOG',
      'BAYLAN', 'KUDYAPI', 'SARIMANOK', 'GARUDA', 'ARIMAONGA', 'RAJAH INDARAPATRA', 'RAJAH SULAYMAN', 'RAJAH MUDA', 'BANTUGAN', 'PAPANOK',
      'SINAKULINTING', 'APO LAKI', 'KABUNIAN', 'LUMAWIG', 'BANGAN', 'WIGAN', 'BUGAN', 'WIGAN AND BUGAN', 'MEBUYAN', 'MANAMA',
      'LUMABET', 'EUGPAMOLAK MANOBO', 'MAKALIDUNG', 'TIGUAN', 'DIWATA NA MAGBABAYA', 'MAGBABAYA', 'AGYU', 'KUYAMIS', 'TULUGAN', 'INHABANGAN',
      'MAMPIRO', 'OLOGASI', 'OMAKA-AN', 'TAGAMALING', 'TAGBANUWA', 'DIWATA NG KAGUBATAN', 'DIWATA NG TUBIG', 'DIWATA NG BUNDOK', 'DIWATA NG HANGIN', 'DIWATA NG APOY'
    ];

    const MONSTERS_DATABASE = RAW_MYTHOS_NAMES.map((name, i) => {
      let effectDesc = "Battle Strike: Deals standard physical/magical combat damage.";
      let effectType = "PASSIVE";

      if (['BATHALA', 'MAKAPTAN', 'KAPTAN', 'KAN-LAON', 'TUNGKUNG LANGIT', 'KABUNIAN', 'EUGPAMOLAK MANOBO', 'MAGBABAYA'].includes(name)) {
        effectDesc = "Divine Presence: All allied cards gain +2 Attack and +3 Defense while this card is on the field.";
      } else if (name.startsWith('DIWATA') || ['MAYARI', 'TALA', 'HANAN', 'ANAGOLAY', 'IKAPATI', 'LAKAPATI'].includes(name)) {
        effectDesc = "Deity's Favor: Pay 1 Kalayaan to restore 5 Life to an allied unit.";
        effectType = "ACTIVE";
      } else if (name === 'APOLAKI') {
        effectDesc = "Solar Blood Sacrifice: Sacrifice an ally to double Apolaki's Attack for the turn.";
        effectType = "ACTIVE";
      } else if (name === 'SITAN') {
        effectDesc = "Nether Binding: When an enemy card is destroyed, return it to your hand under your control.";
      } else if (name === 'MANGGAGAWAY' || name === 'MANGKUKULAM') {
        effectDesc = "Vile Contagion (Poison): Attacks inflict Poison dealing 4 damage per turn and -5 Defense.";
      } else if (name === 'TIKBALANG') {
        effectDesc = "Spatial Loop (Paralyze): Attacks have a 50% chance to Paralyze the target for 1 turn.";
      } else if (name === 'SIGBIN') {
        effectDesc = "Neuro-Tail Lash (Paralyze): Attacks apply Paralyze.";
      } else if (name === 'MANANANGGAL' || name === 'ASWANG') {
        effectDesc = "Vampiric Bleed: Attacks inflict Bleed, dealing 3 damage per turn.";
      } else if (name === 'BATIBAT') {
        effectDesc = "Nightmare Paralysis (Sleep): Put an enemy unit to Sleep for 2 turns.";
        effectType = "ACTIVE";
      } else if (name === 'BAKUNAWA') {
        effectDesc = "Eclipse Swimmer: When summoned, puts enemy non-water units to Sleep for 1 turn.";
      } else if (name === 'BABAYLAN') {
        effectDesc = "Ancestral Warding: Pay 2 Kalayaan to cleanse all negative status effects from an ally.";
        effectType = "ACTIVE";
      } else if (name === 'BANTUGAN') {
        effectDesc = "Soul Retrieval: Pay 2 Kalayaan to revive 1 fallen card from graveyard into hand.";
        effectType = "ACTIVE";
      } else if (name.includes('PUGOT')) {
        effectDesc = "Spectral Reanimation: When deployed, select a fallen unit from the Graveyard to return to the board.";
        effectType = "ACTIVE";
      }

      return {
        id: `m${i + 1}`,
        name: name,
        atk: 6 + (i % 14),
        def: 5 + (i % 15),
        hp: 12 + (i % 22),
        cost: 2 + (i % 5),
        reqLeadership: 3 + (i % 6),
        role: i < 30 ? 'Deity' : i < 60 ? 'Shadow Beast' : i < 90 ? 'Nature Spirit' : 'Legendary Hero',
        avatarSymbol: ['🐉', '⚡', '🦅', '🌊', '🌙', '💀', '🔥'][i % 7],
        effect: effectDesc,
        effectType: effectType
      };
    });
    window.MONSTERS_DATABASE = MONSTERS_DATABASE;

    const CITY_NAMES = ['Manila', 'Cebu City', 'Davao City', 'Vigan', 'Intramuros', 'Iloilo City', 'Zamboanga', 'Bacolod', 'Tacloban', 'Baguio', 'Naga', 'Antipolo', 'San Fernando', 'Calamba', 'Malolos', 'Tagaytay', 'Laoag', 'Dagupan', 'Legazpi', 'Puerto Princesa', 'Dumaguete', 'Roxas City', 'Cotabato', 'General Santos', 'Butuan', 'Cagayan de Oro', 'Iligan', 'Surigao', 'Dipolog', 'Ozamiz', 'Tarlac', 'Olongapo', 'Angeles', 'Batangas City', 'Lucena', 'Lipa', 'Calapan', 'Sorsogon', 'Catbalogan', 'Borongan', 'Tagbilaran', 'Ormoc', 'Baybay', 'Maasin', 'Kabankalan', 'San Jose del Monte', 'Meycauayan', 'Biñan', 'Santa Rosa', 'Imus'];

    const CHURCH_NAMES = ['San Agustin Church', 'Paoay Church', 'Miagao Church', 'Santo Niño Basilica', 'Manila Cathedral', 'Quiapo Church', 'Barasoain Church', 'Baclayon Church', 'Daraga Church', 'Antipolo Cathedral', 'Callao Cave Chapel', 'Mt. Banahaw Sanctuary', 'Santa Maria Church', 'Loboc Church', 'Panay Church', 'Nagcarlan Underground Church', 'Binondo Church', 'Malate Church', 'Baclaran Church', 'EDSA Shrine', 'Manaoag Shrine', 'Penafrancia Basilica', 'Simala Shrine', 'Jaro Cathedral', 'Molo Church', 'Taytay Church', 'Lucban Church', 'Liliw Church', 'Majayjay Church', 'Paete Church', 'Caleruega Chapel', 'Monasterio de Tarlac', 'Betis Church', 'Calumpit Church', 'San Sebastian Church', 'San Jose Church', 'Silang Church', 'Maragondon Church', 'Kawit Church', 'Tabaco Church', 'Cagsawa Ruins Chapel', 'Bolinao Church', 'Laoag Cathedral', 'Bantay Church', 'Vigan Cathedral', 'Dupax Church', 'Tumauini Church', 'Contemplative Monastery', 'Pink Sisters Convent', 'Monastery of Transfiguration'];
    const ISLAND_NAMES = ['Palawan', 'Boracay', 'Siargao', 'Bohol', 'Batanes', 'Corregidor', 'Mactan Island', 'Camiguin', 'Dinagat Islands', 'Samar', 'Leyte', 'Guimaras', 'Coron', 'Apo Island', 'Siquijor', 'Romblon', 'Calamianes', 'Catanduanes', 'Marinduque', 'Mindoro', 'Masbate', 'Banton Island', 'Tablas Island', 'Sibuyan Island', 'Semirara Island', 'Cuyo Island', 'Culion Island', 'Busuanga Island', 'Linapacan Island', 'Itbayat Island', 'Sabtang Island', 'Homonhon Island', 'Limasawa Island', 'Panaon Island', 'Bantayan Island', 'Camotes Islands', 'Olango Island', 'Panglao Island', 'Balicasag Island', 'Capul Island', 'Biliran Island', 'Gigantes Islands', 'Sicogon Island', 'Guimaras Island', 'Santa Cruz Island', 'Jolo Island', 'Tawi-Tawi Island', 'Mapun Island', 'Turtle Islands', 'Palumbanes Islands'];

    const LANDS_DATABASE = [
      ...CITY_NAMES.map((name, i) => ({ id: `lc${i+1}`, name, category: 'Cities', dominionValue: 2, energyBonus: 2, cost: 1, reqLeadership: 2, desc: 'Adds +1 Command Leadership and generates +2 Kalayaan.' })),
      ...SEA_NAMES.map((name, i) => ({ id: `ls${i+1}`, name, category: 'Seas & Water Bodies', dominionValue: 1, energyBonus: 1, cost: 1, reqLeadership: 1, desc: 'Increases mobility and naval positioning.' })),

    ];

    const EVENT_TITLES = [
      'Galleon Trade Arrival', 'Propaganda Movement', 'Declaration of Independence', 'EDSA Revolution', 'Malolos Congress',
      'First Mass in Limasawa', 'Pact of Biak-na-Bato', 'Sinulog Festival', 'Cry of Pugad Lawin', 'Kadayawan Festival',
      'Battle of Mactan', 'Burning of Intramuros', 'Battle of Tirad Pass', 'Cry of Balintawak', 'Execution of Gomburza',
      'Battle of Pinaglabanan', 'Mt. Pinatubo Eruption', 'Great Luzon Earthquake', 'Balangiga Encounter', 'Battle of Zapote Bridge'
    ];

    const EVENTS_DATABASE = Array.from({ length: 200 }, (_, i) => {
      const name = EVENT_TITLES[i % EVENT_TITLES.length] + (i >= 20 ? ` Part ${Math.floor(i / 20) + 1}` : '');
      let effect = 'Tactical Surge: Target friendly unit gains +1 ATK, heals 3 HP, and refreshes action.';
      let drawAmount = 0;

      if (['Galleon Trade Arrival', 'Propaganda Movement', 'Declaration of Independence', 'EDSA Revolution', 'Malolos Congress'].some(t => name.startsWith(t))) {

      } else if (['First Mass in Limasawa', 'Pact of Biak-na-Bato', 'Sinulog Festival', 'Cry of Pugad Lawin', 'Kadayawan Festival'].some(t => name.startsWith(t))) {

        drawAmount = 1;
      }

      return {
        id: `e${i+1}`,
        name,
        cost: 1 + (i % 3),
        reqLeadership: 1 + (i % 3),
        drawAmount,
        effect
      };
    });
    window.EVENTS_DATABASE = EVENTS_DATABASE;

    const defaultDeck = [
      ...MONSTERS_DATABASE.slice(0, 20),
      ...LANDS_DATABASE.slice(0, 15),
      ...EVENTS_DATABASE.slice(0, 15)
    ];

    function sanitizeIpKey(ip) {
      if (!ip) return '127_0_0_1';
      return (ip + '').trim().replace(/[^a-zA-Z0-9]/g, '_').toLowerCase();
    }
    window.sanitizeIpKey = sanitizeIpKey;

    function normalizeRoomCode(code) {
      if (!code) return '';
      return (code + '').trim();
    }
    window.normalizeRoomCode = normalizeRoomCode;

    window.state = {
      view: 'MENU',
      gameMode: 'AI',
      selectedDifficulty: 'EASY',
      gridSize: 5,
      mobilePlayTab: 'BOARD',

      isHandShielded: false,

      isGeminiThinking: false,
      showGameOptionsModal: false,
      reviveModalActive: false,
      graveyardReviveChoices: [],

    // Extract local LAN IP via WebRTC candidate probe
    function discoverLocalLanIp() {
      try {
        const RTCPC = window.RTCPeerConnection || window.webkitRTCPeerConnection;
        if (!RTCPC) return;
        const pc = new RTCPC({ iceServers: [] });
        pc.createDataChannel('lan-ip-probe');
        pc.createOffer().then(offer => pc.setLocalDescription(offer)).catch(() => {});
        pc.onicecandidate = (event) => {
          if (!event || !event.candidate || !event.candidate.candidate) return;
          const match = event.candidate.candidate.match(/([0-9]{1,3}(\.[0-9]{1,3}){3})/);
          if (match && match[1] && !match[1].startsWith('127.')) {
            state.myLanIp = match[1];
            render();
            try { pc.close(); } catch(e){}
          }
        };
      } catch (e) {}
    }

    // Resolve public Wi-Fi WAN IP as primary network identifier
    async function resolveMyIp() {
      discoverLocalLanIp();
      let detectedWan = null;

      const endpoints = [
        'https://api.ipify.org?format=json',
        'https://api64.ipify.org?format=json',
        'https://httpbin.org/ip'
      ];

      for (const url of endpoints) {
        try {
          const res = await fetch(url, { cache: 'no-cache' });
          if (res.ok) {
            const data = await res.json();
            const ip = data.ip || (data.origin ? data.origin.split(',')[0].trim() : null);
            if (ip) {
              detectedWan = ip;
              break;
            }
          }
        } catch (e) {}
      }

      if (detectedWan) {
        state.myWanIp = detectedWan;
        state.myIpAddress = detectedWan;
        if (state.networkRole === 'HOST' && state.networkStatus === 'IDLE') {
          state.hostIpAddress = detectedWan;
          state.onlineRoomCode = detectedWan;
        }
        if (!state.targetHostIpInput || state.targetHostIpInput.includes('Detecting')) {
          state.targetHostIpInput = detectedWan;
          state.networkRoomInput = detectedWan;
        }
      } else {
        const fallback = state.myLanIp || '192.168.1.100';
        state.myWanIp = fallback;
        state.myIpAddress = fallback;
        if (state.networkRole === 'HOST' && state.networkStatus === 'IDLE') {
          state.hostIpAddress = fallback;
          state.onlineRoomCode = fallback;
        }
        if (!state.targetHostIpInput) {
          state.targetHostIpInput = fallback;
          state.networkRoomInput = fallback;
        }
      }
      render();
    }
    resolveMyIp();
    window.resolveMyIp = resolveMyIp;

    // WAN Relay messaging for cross-machine sync over Wi-Fi
    async function sendRelayMessage(channelKey, payload) {
      try {
        const url = `https://ntfy.sh/tcg_wan_${sanitizeIpKey(channelKey)}`;
        await fetch(url, {
          method: 'POST',
          body: JSON.stringify(payload),
          headers: { 'Content-Type': 'application/json' }
        });
      } catch (e) {}
    }

    function initRelayListener(channelKey) {
      if (relayEventSource) {
        try { relayEventSource.close(); } catch(e){}
      }
      if (pollInterval) {
        clearInterval(pollInterval);
      }

      try {
        const sseUrl = `https://ntfy.sh/tcg_wan_${sanitizeIpKey(channelKey)}/sse`;
        relayEventSource = new EventSource(sseUrl);
        relayEventSource.onmessage = (e) => {
          try {
            const data = JSON.parse(e.data);
            if (data && data.message) {
              const msg = JSON.parse(data.message);
              handleIncomingNetworkMessage(msg);
            }
          } catch (err) {}
        };
        relayEventSource.onerror = () => {
          startRelayPoll(channelKey);
        };
      } catch (err) {
        startRelayPoll(channelKey);
      }
    }

    let lastPollTime = Math.floor(Date.now() / 1000) - 5;
    function startRelayPoll(channelKey) {
      if (pollInterval) clearInterval(pollInterval);
      pollInterval = setInterval(async () => {
        try {
          const res = await fetch(`https://ntfy.sh/tcg_wan_${sanitizeIpKey(channelKey)}/json?poll=1&since=${lastPollTime}`);
          if (res.ok) {
            const text = await res.text();
            const lines = text.trim().split('\n');
            lines.forEach(line => {
              if (!line) return;
              try {
                const item = JSON.parse(line);
                if (item && item.time) lastPollTime = Math.max(lastPollTime, item.time);
                if (item && item.message) {
                  const msg = JSON.parse(item.message);
                  handleIncomingNetworkMessage(msg);
                }
              } catch (e) {}
            });
          }
        } catch (e) {}
      }, 1200);
    }

    function sendP2PMessage(payload) {

      }
      if (state.onlineRoomCode) {

    function generateCardArt(card) {
      if (!card) return '';
      const c = document.createElement('canvas');
      c.width = 240; c.height = 320;
      const ctx = c.getContext('2d');
      const g = ctx.createLinearGradient(0,0,240,320);
      if (card.leadership) { g.addColorStop(0, '#451a03'); g.addColorStop(1, '#b45309'); }
      else if (card.hp && card.atk) { g.addColorStop(0, '#2e1065'); g.addColorStop(1, '#701a75'); }
      else if (card.category) {
        if (card.category === 'Cities') { g.addColorStop(0, '#7f1d1d'); g.addColorStop(1, '#991b1b'); }
        else if (card.category.includes('Sea')) { g.addColorStop(0, '#0c4a6e'); g.addColorStop(1, '#0369a1'); }
        else if (card.category.includes('Church')) { g.addColorStop(0, '#44403c'); g.addColorStop(1, '#78716c'); }
        else { g.addColorStop(0, '#064e3b'); g.addColorStop(1, '#047857'); }
      } else { g.addColorStop(0, '#78350f'); g.addColorStop(1, '#d97706'); }
      ctx.fillStyle = g; ctx.fillRect(0,0,240,320);
      ctx.beginPath(); ctx.arc(120, 140, 65, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(255,255,255,0.1)'; ctx.fill();
      ctx.font = '54px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(card.avatarSymbol || (card.category ? '🗺️' : card.atk ? '🐉' : '📜'), 120, 140);
      return c.toDataURL();
    }

      if (msg.type === 'REQUEST_JOIN' && state.networkRole === 'HOST') {
        state.networkStatus = 'CONNECTED';
        if (msg.guestIp) state.guestIpAddress = msg.guestIp;
        if (msg.guestHeroId) state.p2Hero = HEROES_DATABASE.find(h => h.id === msg.guestHeroId) || state.p2Hero;
        
        sendP2PMessage({
          type: 'JOIN_ACCEPTED',
          hostHeroId: state.p1Hero.id,
          gridSize: state.gridSize,
          hostIp: state.hostIpAddress
        });
        render();
      } else if (msg.type === 'JOIN_ACCEPTED' && state.networkRole === 'CLIENT') {
        state.networkStatus = 'CONNECTED';
        if (msg.hostHeroId) state.p1Hero = HEROES_DATABASE.find(h => h.id === msg.hostHeroId) || state.p1Hero;
        if (msg.gridSize) state.gridSize = msg.gridSize;
        if (msg.hostIp) state.hostIpAddress = msg.hostIp;
        render();
      } else if (msg.type === 'GRID_CHANGED') {
        state.gridSize = msg.gridSize;

      } else if (msg.type === 'HERO_SELECTED') {
        if (msg.role === 'HOST') {
          state.p1Hero = HEROES_DATABASE.find(h => h.id === msg.heroId) || state.p1Hero;
        } else {
          state.p2Hero = HEROES_DATABASE.find(h => h.id === msg.heroId) || state.p2Hero;

        if (msg.hero2Id) state.p2Hero = HEROES_DATABASE.find(h => h.id === msg.hero2Id) || state.p2Hero;
        if (msg.gridSize) state.gridSize = msg.gridSize;

    function startMatch(heroChoice) {
      if (heroChoice) state.p1Hero = heroChoice;
      if (state.gameMode === 'AI') {
        if (state.selectedDifficulty === 'EASY') {
          state.gridSize = 5;
          state.p2Hero = HEROES_DATABASE[15];
        } else if (state.selectedDifficulty === 'MODERATE') {
          state.gridSize = 7;
          state.p2Hero = HEROES_DATABASE[7];
        } else if (state.selectedDifficulty === 'HARD') {
          state.gridSize = 9;
          state.p2Hero = HEROES_DATABASE[0];
        } else {
          state.gridSize = 12;
          state.p2Hero = HEROES_DATABASE[4];
        }
      }

      const board = [];
      for (let r = 0; r < state.gridSize; r++) {
        for (let c = 0; c < state.gridSize; c++) {
          const landIdx = (r * state.gridSize + c) % LANDS_DATABASE.length;
          board.push({
            r, c,
            land: LANDS_DATABASE[landIdx],
            controlledBy: null
          });
        }
      }

      const p1StartR = state.gridSize - 1;
      const p1StartC = Math.floor(state.gridSize / 2);
      const p2StartR = 0;
      const p2StartC = Math.floor(state.gridSize / 2);

        },
        {

          r: p2StartR, c: p2StartC, currentHp: state.p2Hero.hp, actionsLeft: 1,
          statuses: { poison: 0, bleed: 0, sleep: 0, paralyze: 0 }
        }
      ];

      board.find(t => t.r === p1StartR && t.c === p1StartC).controlledBy = 1;
      board.find(t => t.r === p2StartR && t.c === p2StartC).controlledBy = 2;

      const deck1 = [...state.customDeck].sort(() => Math.random() - 0.5);
      const deck2 = [...defaultDeck].sort(() => Math.random() - 0.5);

      state.board = board;
      state.units = units;
      state.p1Deck = deck1.slice(4);
      state.p1Hand = deck1.slice(0, 4);
      state.p2Deck = deck2.slice(4);
      state.p2Hand = deck2.slice(0, 4);
      state.p1Kalayaan = 5;
      state.p2Kalayaan = 5;
      state.p1DominionTotal = 0;
      state.p2DominionTotal = 0;
      state.currentTurn = 1;
      state.turnNumber = 1;
      state.gameLogs = [];
      state.selectedUnitId = null;
      state.selectedHandCardIndex = null;
      state.validMoves = [];
      state.validAttacks = [];
      state.validCardPlacements = [];
      state.validSkillTargets = [];
      state.showGameOptionsModal = false;
      state.activeCardPreview = state.p1Hero;
      state.view = 'PLAYING';

      addLog(`⚔️ Duel commenced on a ${state.gridSize}x${state.gridSize} battlefield!`);

      if (state.gameMode === 'NETWORK_2P' && state.networkRole === 'HOST') {
        sendP2PMessage({
          type: 'START_MATCH',
          hero1Id: state.p1Hero.id,

        });

    window.startMatch = startMatch;

    function toggleGameOptionsModal(show) {

    function calculateValidActions(unit) {
      if (!unit || unit.owner !== state.currentTurn) return;
      if (state.gameMode === 'NETWORK_2P') {
        if (state.networkRole === 'HOST' && state.currentTurn !== 1) return;
        if (state.networkRole === 'CLIENT' && state.currentTurn !== 2) return;
      }
      const moves = [];
      const attacks = [];
      if ((unit.actionsLeft || 0) <= 0) {
        state.validMoves = [];
        state.validAttacks = [];
        return;
      }
      const maxMove = unit.card.move || 1;
      for (let r = 0; r < state.gridSize; r++) {
        for (let c = 0; c < state.gridSize; c++) {
          const dist = Math.abs(r - unit.r) + Math.abs(c - unit.c);
          if (dist > 0 && dist <= maxMove) {
            const occ = state.units.find(u => u.r === r && u.c === c);
            if (!occ) {
              moves.push({ r, c });
            } else if (occ.owner !== unit.owner) {
              attacks.push({ r, c });
            }
          }
        }
      }
      state.validMoves = moves;
      state.validAttacks = attacks;
    }
    window.calculateValidActions = calculateValidActions;

    function handleTileClick(r, c) {
      // In Network mode, strictly enforce player turns
      if (state.gameMode === 'NETWORK_2P') {
        if (state.networkRole === 'HOST' && state.currentTurn !== 1) {
          addLog("⏳ Waiting for Player 2's turn to complete...");
          return;
        }
        if (state.networkRole === 'CLIENT' && state.currentTurn !== 2) {
          addLog("⏳ Waiting for Player 1's turn to complete...");
          return;
        }
      }

      // Placing card from hand
      if (state.selectedHandCardIndex !== null) {
        const isPlace = state.validCardPlacements.some(p => p.r === r && p.c === c);
        if (isPlace) {
          executeCardPlacement(r, c);
          return;
        }
      }

      // Unit movement and attack handling
      if (state.selectedUnitId) {
        const unit = state.units.find(u => u.id === state.selectedUnitId);
        if (unit && unit.owner === state.currentTurn && (unit.actionsLeft || 0) > 0) {
          const isMove = state.validMoves.some(m => m.r === r && m.c === c);
          const isAttack = state.validAttacks.some(a => a.r === r && a.c === c);

          if (isMove) {
            unit.r = r;
            unit.c = c;
            unit.actionsLeft = 0;
            const tile = state.board.find(t => t.r === r && t.c === c);
            if (tile) tile.controlledBy = unit.owner;
            addLog(`🚩 ${unit.card.name} advanced to (${r + 1}, ${c + 1}) and captured territory!`);
            playSfx('card_play');
            state.selectedUnitId = null;
            state.validMoves = [];
            state.validAttacks = [];
            if (state.gameMode === 'NETWORK_2P') broadcastGameState();
            render();
            return;
          }

          if (isAttack) {
            const defender = state.units.find(u => u.r === r && u.c === c && u.owner !== unit.owner);
            if (defender) {
              const atkVal = unit.card.atk || 5;
              const defVal = defender.card.def || 2;
              const damage = Math.max(1, atkVal - Math.floor(defVal / 3));
              defender.currentHp -= damage;
              unit.actionsLeft = 0;
              playSfx('attack');
              addLog(`⚔️ ${unit.card.name} struck ${defender.card.name} for ${damage} damage!`);

              if (defender.currentHp <= 0) {
                state.units = state.units.filter(u => u.id !== defender.id);
                state.graveyard.push(defender.card);
                addLog(`💀 ${defender.card.name} was vanquished on the battlefield!`);
                if (defender.type === 'HERO') {
                  const winner = unit.owner === 1 ? state.p1Hero.name : state.p2Hero.name;
                  state.victoryData = { winner, reason: 'HERO CHECKMATE: Enemy Commander slain!' };
                  state.view = 'VICTORY';
                }
              }
              state.selectedUnitId = null;
              state.validMoves = [];
              state.validAttacks = [];
              if (state.gameMode === 'NETWORK_2P') broadcastGameState();
              render();
              return;
            }
          }
        }
      }

      // Unit selection
      const occupant = state.units.find(u => u.r === r && u.c === c);
      if (occupant) {
        state.activeCardPreview = occupant.card;
        if (occupant.owner === state.currentTurn) {
          state.selectedUnitId = occupant.id;
          calculateValidActions(occupant);
        } else {
          state.selectedUnitId = null;
          state.validMoves = [];
          state.validAttacks = [];
        }
      } else {
        const tile = state.board.find(t => t.r === r && t.c === c);
        if (tile && tile.land) state.activeCardPreview = tile.land;
        state.selectedUnitId = null;
        state.validMoves = [];
        state.validAttacks = [];
      }
      render();
    }
    window.handleTileClick = handleTileClick;

    function playCardFromHand(idx) {
      if (state.gameMode === 'NETWORK_2P') {
        if (state.networkRole === 'HOST' && state.currentTurn !== 1) return;
        if (state.networkRole === 'CLIENT' && state.currentTurn !== 2) return;
      }

      if (state.selectedHandCardIndex === idx) {
        state.selectedHandCardIndex = null;
        state.validCardPlacements = [];
        render();
        return;
      }
      const hand = state.currentTurn === 1 ? state.p1Hand : state.p2Hand;
      const card = hand[idx];
      if (!card) return;

      const kalayaan = state.currentTurn === 1 ? state.p1Kalayaan : state.p2Kalayaan;
      if (kalayaan < (card.cost || 1)) {
        addLog(`⚠️ Not enough Kalayaan Energy! Requires ⚡${card.cost || 1}.`);
        return;
      }

      state.selectedHandCardIndex = idx;
      state.activeCardPreview = card;

      if (card.drawAmount) {
        if (state.currentTurn === 1) {
          state.p1Kalayaan -= (card.cost || 1);
          state.p1Hand.splice(idx, 1);
          for (let i = 0; i < card.drawAmount && state.p1Deck.length > 0; i++) {
            state.p1Hand.push(state.p1Deck.shift());
          }
        } else {
          state.p2Kalayaan -= (card.cost || 1);
          state.p2Hand.splice(idx, 1);
          for (let i = 0; i < card.drawAmount && state.p2Deck.length > 0; i++) {
            state.p2Hand.push(state.p2Deck.shift());
          }
        }
        state.selectedHandCardIndex = null;
        playSfx('card_play');
        addLog(`📜 Event ${card.name} triggered! Drew ${card.drawAmount} extra cards.`);
        if (state.gameMode === 'NETWORK_2P') broadcastGameState();
        render();
        return;
      }

      const placements = [];
      for (let r = 0; r < state.gridSize; r++) {
        for (let c = 0; c < state.gridSize; c++) {
          const occ = state.units.find(u => u.r === r && u.c === c);
          if (card.hp && !occ) placements.push({ r, c });
          else if (card.category) placements.push({ r, c });
        }
      }
      state.validCardPlacements = placements;
      render();
    }
    window.playCardFromHand = playCardFromHand;

    function executeCardPlacement(r, c) {
      const hand = state.currentTurn === 1 ? state.p1Hand : state.p2Hand;
      const card = hand[state.selectedHandCardIndex];
      if (!card) return;

      if (state.currentTurn === 1) state.p1Kalayaan -= (card.cost || 1);
      else state.p2Kalayaan -= (card.cost || 1);
      hand.splice(state.selectedHandCardIndex, 1);

      if (card.hp) {
        state.units.push({
          id: 'u_' + Math.random().toString(36).substring(2, 7),
          owner: state.currentTurn,
          type: 'MONSTER',
          card: { ...card },
          r, c,
          currentHp: card.hp,
          actionsLeft: 0,
          statuses: { poison: 0, bleed: 0, sleep: 0, paralyze: 0 }
        });
        const tile = state.board.find(t => t.r === r && t.c === c);
        if (tile) tile.controlledBy = state.currentTurn;
        addLog(`🐉 Summoned ${card.name} at (${r+1}, ${c+1})!`);
      } else if (card.category) {
        const tile = state.board.find(t => t.r === r && t.c === c);
        if (tile) {
          tile.land = card;
          tile.controlledBy = state.currentTurn;
        }
        if (state.currentTurn === 1) state.p1Kalayaan += (card.energyBonus || 1);
        else state.p2Kalayaan += (card.energyBonus || 1);
        addLog(`🏔️ Built ${card.name} territory! (+${card.energyBonus || 1} Kalayaan bonus).`);
      }

      state.selectedHandCardIndex = null;
      state.validCardPlacements = [];
      playSfx('card_play');
      if (state.gameMode === 'NETWORK_2P') broadcastGameState();
      render();
    }

    function endTurn() {
      if (state.gameMode === 'NETWORK_2P') {
        if (state.networkRole === 'HOST' && state.currentTurn !== 1) return;
        if (state.networkRole === 'CLIENT' && state.currentTurn !== 2) return;
      }

      playSfx('card_play');
      const p1Tiles = state.board.filter(t => t.controlledBy === 1);
      const p2Tiles = state.board.filter(t => t.controlledBy === 2);
      state.p1DominionTotal += p1Tiles.reduce((a, t) => a + (t.land?.dominionValue || 1), 0);
      state.p2DominionTotal += p2Tiles.reduce((a, t) => a + (t.land?.dominionValue || 1), 0);

      if (state.p1DominionTotal >= 100) {
        state.victoryData = { winner: state.p1Hero.name, reason: 'DOMINION SUPREMACY: 100 Dominion points achieved!' };
        state.view = 'VICTORY';
        if (state.gameMode === 'NETWORK_2P') broadcastGameState();
        render();
        return;
      }
      if (state.p2DominionTotal >= 100) {
        state.victoryData = { winner: state.p2Hero.name, reason: 'DOMINION SUPREMACY: Enemy achieved 100 Dominion points!' };
        state.view = 'VICTORY';
        if (state.gameMode === 'NETWORK_2P') broadcastGameState();
        render();
        return;
      }

      state.currentTurn = state.currentTurn === 1 ? 2 : 1;
      state.turnNumber++;

      state.units.forEach(u => {
        if (u.owner === state.currentTurn) u.actionsLeft = 1;
      });

      if (state.currentTurn === 1) {
        state.p1Kalayaan = Math.min(10, state.p1Kalayaan + 3);
        if (state.p1Deck.length > 0) state.p1Hand.push(state.p1Deck.shift());
      } else {
        state.p2Kalayaan = Math.min(10, state.p2Kalayaan + 3);
        if (state.p2Deck.length > 0) state.p2Hand.push(state.p2Deck.shift());
        if (state.gameMode === 'AI') {
          setTimeout(runAITurn, 600);

      state.selectedUnitId = null;
      state.validMoves = [];
      state.validAttacks = [];

      if (state.gameMode === 'NETWORK_2P') {
        broadcastGameState();
      }

      render();
    }
    window.endTurn = endTurn;

    function runAITurn() {
      const aiUnits = state.units.filter(u => u.owner === 2);

            u.r++;
            const t = state.board.find(tile => tile.r === u.r && tile.c === u.c);
            if (t) t.controlledBy = 2;
          }
        }
      });
      endTurn();
    }

                          class="px-4 py-2 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 text-slate-950 font-cinzel font-black text-xs rounded-xl shadow active:scale-95 transition">
                    SEND
                  </button>
                </div>
              </div>
            </div>
          ` : ''}
        `;
        return;
      }

      if (state.view === 'PLAYING') {
        const isP1 = state.currentTurn === 1;
        const myTurn = (state.gameMode !== 'NETWORK_2P') || 
                       (state.networkRole === 'HOST' && isP1) || 
                       (state.networkRole === 'CLIENT' && !isP1);

        app.innerHTML = `
          <!-- Top HUD Header -->
          <div class="bg-slate-900/90 border-b border-amber-500/20 p-2.5 sm:p-3 flex justify-between items-center shadow-lg backdrop-blur-md">
            <!-- P2 Hero Info -->
            <div class="flex items-center gap-2">
              <div class="w-10 h-10 rounded-2xl bg-red-950/80 border border-red-500/50 flex items-center justify-center text-xl shadow">
                ${state.p2Hero.avatarSymbol}
              </div>
              <div>
                <div class="text-xs font-cinzel font-bold text-red-400 truncate max-w-[100px] sm:max-w-none">${state.p2Hero.name}</div>
                <div class="text-[10px] text-slate-400 font-mono">Dominion: <b class="text-red-400">${state.p2DominionTotal}</b>/100</div>
              </div>
            </div>

            <!-- Match Status & Controls -->
            <div class="flex flex-col items-center gap-1">
              <div class="text-[9px] font-mono text-amber-300 font-bold tracking-widest uppercase">TURN ${state.turnNumber}</div>
              <div class="flex items-center gap-2">
                <span class="px-3 py-0.5 rounded-full text-[10px] font-cinzel font-black shadow ${isP1 ? 'bg-amber-500 text-slate-950' : 'bg-red-600 text-white'}">
                  ${isP1 ? 'P1 TURN' : 'P2 TURN'}
                </span>
                <button onclick="toggleGameOptionsModal(true);" 
                        class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-[10px] font-cinzel font-bold rounded-lg text-slate-200">
                  ⚙️ MENU
                </button>
                ${state.gameMode === 'NETWORK_2P' ? `
                  <button onclick="toggleChat(true);" class="relative px-2.5 py-1 bg-indigo-950 hover:bg-indigo-900 border border-indigo-500/50 text-[10px] font-cinzel font-bold rounded-lg text-indigo-200 flex items-center gap-1">
                    <span>💬</span>
                    ${state.unreadChatCount > 0 ? `<span class="w-2 h-2 rounded-full bg-amber-400 animate-ping absolute -top-0.5 -right-0.5"></span>` : ''}
                  </button>
                ` : ''}
              </div>
            </div>

            <!-- P1 Hero Info -->
            <div class="flex items-center gap-2">
              <div class="text-right">
                <div class="text-xs font-cinzel font-bold text-amber-400 truncate max-w-[100px] sm:max-w-none">${state.p1Hero.name}</div>
                <div class="text-[10px] text-amber-200/70 font-mono">Dominion: <b class="text-amber-400">${state.p1DominionTotal}</b>/100</div>
              </div>
              <div class="w-10 h-10 rounded-2xl bg-amber-950/80 border border-amber-500/50 flex items-center justify-center text-xl shadow">
                ${state.p1Hero.avatarSymbol}
              </div>
            </div>
          </div>

          <!-- Main Battlefield Arena -->
          <div class="flex-1 flex flex-col items-center justify-center p-2 sm:p-4 overflow-y-auto">
            <div class="overflow-auto max-w-full max-h-[68vh] p-2 rounded-3xl bg-slate-950/80 border border-slate-800 shadow-2xl touch-scroll">
              <div class="grid gap-1 sm:gap-1.5" style="grid-template-columns: repeat(${state.gridSize}, minmax(46px, 1fr));">
                ${state.board.map(tile => {
                  const unit = state.units.find(u => u.r === tile.r && u.c === tile.c);
                  const isSelected = unit && unit.id === state.selectedUnitId;
                  const isMove = state.validMoves.some(m => m.r === tile.r && m.c === tile.c);
                  const isAttack = state.validAttacks.some(a => a.r === tile.r && a.c === tile.c);
                  const isPlacement = state.validCardPlacements.some(p => p.r === tile.r && p.c === tile.c);

                  let bgClass = 'bg-slate-900/90 border-slate-800';
                  if (tile.controlledBy === 1) bgClass = 'bg-amber-950/40 border-amber-500/50';
                  else if (tile.controlledBy === 2) bgClass = 'bg-red-950/40 border-red-500/50';

                  if (tile.land?.category === 'Cities') bgClass += ' biome-city';
                  else if (tile.land?.category?.includes('Sea')) bgClass += ' biome-sea';
                  else if (tile.land?.category?.includes('Church')) bgClass += ' biome-church';
                  else if (tile.land?.category?.includes('Island')) bgClass += ' biome-island';

                  return `
                    <div onclick="handleTileClick(${tile.r}, ${tile.c});"
                         class="relative w-12 h-12 sm:w-14 sm:h-14 rounded-xl border flex flex-col justify-between p-1 cursor-pointer transition select-none ${bgClass} 
                                ${isSelected ? 'ring-2 ring-amber-400 bg-amber-500/20' : ''} 
                                ${isMove ? 'ring-2 ring-emerald-400 bg-emerald-500/20 animate-pulse' : ''} 
                                ${isAttack ? 'ring-2 ring-red-500 bg-red-600/30 animate-attack-pulse' : ''} 
                                ${isPlacement ? 'ring-2 ring-yellow-400 bg-yellow-500/30 animate-pulse' : ''}">
                      
                      <div class="flex justify-between items-center text-[7px] text-slate-400 font-mono leading-none">
                        <span>${tile.r + 1},${tile.c + 1}</span>
                        <span class="text-amber-300 font-bold">+${tile.land?.dominionValue || 1}D</span>
                      </div>

                      <div class="my-auto flex flex-col items-center text-center">
                        ${unit ? `
                          <div class="text-lg sm:text-xl drop-shadow leading-none">
                            ${unit.card.avatarSymbol || (unit.type === 'HERO' ? '👑' : '🐉')}
                          </div>
                          <div class="flex items-center gap-0.5 mt-0.5">
                            <span class="text-[7px] px-1 bg-black/80 rounded font-mono font-bold ${unit.owner === 1 ? 'text-amber-300' : 'text-red-400'}">
                              ${unit.currentHp}HP
                            </span>
                            ${unit.actionsLeft > 0 ? `<span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>` : ''}
                          </div>
                        ` : `
                          <div class="text-[8px] text-slate-500 line-clamp-1 text-center font-medium">
                            ${tile.land?.name?.split(' ')[0] || ''}
                          </div>
                        `}
                      </div>

                      <div class="text-[7px] text-slate-500 font-mono leading-none truncate text-center">
                        ${tile.controlledBy ? `P${tile.controlledBy}` : '—'}
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>

            <!-- Mini Turn Action Log -->
            <div class="w-full max-w-md mt-2 bg-slate-900/90 border border-slate-800 rounded-xl p-2 text-[10px] text-slate-300 font-mono h-14 overflow-y-auto space-y-0.5">
              ${state.gameLogs.map(l => `<div>${l}</div>`).join('')}
            </div>
          </div>

          <!-- Bottom HUD Player Bar & Hand Cards -->
          <div class="bg-slate-900 border-t border-amber-500/20 p-2.5 shadow-2xl">
            <div class="max-w-md mx-auto flex justify-between items-center mb-2 text-xs">
              <div class="flex items-center gap-2">
                <span class="font-cinzel font-bold text-amber-400">⚡ KALAYAAN:</span>
                <span class="font-mono font-black bg-amber-950 px-2 py-0.5 rounded-md border border-amber-500/40 text-amber-300">
                  ${isP1 ? state.p1Kalayaan : state.p2Kalayaan}/10
                </span>
              </div>
              <div class="flex items-center gap-2">
                <span class="text-[10px] font-mono text-slate-400">Deck: ${isP1 ? state.p1Deck.length : state.p2Deck.length}</span>
                ${myTurn ? `
                  <button onclick="endTurn();" 
                          class="px-3 py-1 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 text-slate-950 font-cinzel font-black text-xs rounded-xl shadow active:scale-95 transition">
                    ⌛ END TURN
                  </button>
                ` : `
                  <span class="text-[10px] text-slate-500 font-mono">Opponent's Turn...</span>
                `}
              </div>
            </div>

            <!-- Hand Cards Scrollable Strip -->
            <div class="max-w-md mx-auto flex gap-2 overflow-x-auto pb-1 touch-scroll">
              ${(isP1 ? state.p1Hand : state.p2Hand).map((card, idx) => `
                <div class="flex-shrink-0 w-24 sm:w-28 p-2 rounded-xl border bg-slate-950 flex flex-col justify-between cursor-pointer transition ${state.selectedHandCardIndex === idx ? 'border-amber-400 ring-2 ring-amber-400/50 bg-amber-950/40' : 'border-slate-800 hover:border-slate-700'}">
                  <div>
                    <div class="flex justify-between items-start">
                      <span class="text-base">${card.avatarSymbol || (card.category ? '🗺️' : card.atk ? '🐉' : '📜')}</span>
                      <span class="text-[9px] font-mono font-bold bg-amber-950 text-amber-300 px-1 rounded border border-amber-500/30">
                        ⚡${card.cost || 1}
                      </span>
                    </div>
                    <div class="font-cinzel font-bold text-[11px] text-amber-200 truncate mt-1">${card.name}</div>
                    <div class="text-[9px] text-slate-400 truncate">${card.role || card.category || 'Event'}</div>
                  </div>
                  <button onclick="playCardFromHand(${idx});" 
                          class="mt-1.5 w-full py-1 bg-amber-500 hover:bg-amber-400 text-slate-950 font-cinzel font-black text-[9px] rounded shadow active:scale-95 transition">
                    ${state.selectedHandCardIndex === idx ? 'CANCEL' : 'PLAY'}
                  </button>
                </div>
              `).join('')}
            </div>
          </div>

          <!-- In-Game Options Menu Modal -->
          ${state.showGameOptionsModal ? `
            <div class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div class="bg-slate-900 border border-amber-500/60 rounded-3xl p-5 max-w-xs w-full shadow-2xl space-y-3 text-center">
                <div class="font-cinzel font-black text-amber-400 text-lg">BATTLE OPTIONS</div>
                <p class="text-xs text-slate-400">Manage or concede the active match.</p>

                <div class="space-y-2 pt-2">
                  <button onclick="toggleGameOptionsModal(false);" 
                          class="w-full py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-200 font-cinzel font-bold text-xs rounded-xl border border-slate-700">
                    ▶️ RESUME BATTLE
                  </button>
                  <button onclick="surrenderMatch();" 
                          class="w-full py-2.5 bg-red-950/80 hover:bg-red-900 text-red-200 font-cinzel font-bold text-xs rounded-xl border border-red-500/40">
                    🏳️ SURRENDER (CONCEDE)
                  </button>
                  <button onclick="quitToMenu();" 
                          class="w-full py-2.5 bg-slate-950 hover:bg-slate-900 text-slate-400 hover:text-slate-200 font-cinzel font-bold text-xs rounded-xl border border-slate-800">
                    🚪 QUIT TO MAIN MENU
                  </button>
                </div>
              </div>
            </div>
          ` : ''}

          <!-- In-Game Chat Drawer -->
          ${state.isChatOpen ? `
            <div class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
              <div class="bg-slate-900 border border-amber-500/40 rounded-t-3xl sm:rounded-2xl max-w-lg w-full h-[520px] max-h-[85vh] flex flex-col shadow-2xl overflow-hidden">
                <div class="p-3 bg-slate-950 border-b border-amber-500/20 flex justify-between items-center">
                  <div class="flex items-center gap-2">
                    <span class="text-lg">💬</span>
                    <div>
                      <div class="font-cinzel font-black text-amber-300 text-xs sm:text-sm">BATTLE COMMS LINK</div>
                      <div class="text-[10px] font-mono text-slate-400">WAN: ${state.onlineRoomCode}</div>
                    </div>
                  </div>
                  <button onclick="toggleChat(false);" class="w-7 h-7 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white flex items-center justify-center text-xs font-bold">
                    ✕
                  </button>
                </div>

                <div id="chat-history-container" class="flex-1 p-3 overflow-y-auto space-y-2.5 text-xs">
                  ${state.chatMessages.length === 0 ? `
                    <div class="h-full flex flex-col items-center justify-center text-center p-4 text-slate-500">
                      <span class="text-3xl mb-1">📡</span>
                      <p class="font-cinzel text-xs text-slate-400">Comms Link Established</p>
                      <p class="text-[10px] mt-0.5">Send a message to your opponent!</p>
                    </div>
                  ` : state.chatMessages.map(msg => `
                    <div class="flex flex-col ${msg.isMe ? 'items-end' : 'items-start'}">
                      <div class="flex items-center gap-1.5 mb-0.5 text-[9px] font-mono text-slate-400">
                        <span class="${msg.isMe ? 'text-amber-400 font-bold' : 'text-blue-400 font-bold'}">
                          ${msg.isMe ? 'You' : msg.senderName} (${msg.senderRole === 'HOST' ? 'P1' : 'P2'})
                        </span>
                        <span>•</span>
                        <span>${msg.time}</span>
                      </div>
                      <div class="max-w-[82%] px-3 py-2 rounded-2xl text-xs leading-relaxed ${
                        msg.isMe 
                          ? 'bg-gradient-to-r from-amber-600 to-amber-700 text-slate-950 font-medium rounded-tr-none shadow' 
                          : 'bg-slate-800 border border-slate-700 text-slate-100 rounded-tl-none shadow'
                      }">
                        ${msg.text}
                      </div>
                    </div>
                  `).join('')}
                </div>

                <div class="px-3 py-1.5 bg-slate-950/90 border-t border-slate-800/80 flex gap-1.5 overflow-x-auto touch-scroll">
                  ${state.quickPhrases.map(phrase => `
                    <button onclick="sendChatMessage('${phrase}');" 
                            class="whitespace-nowrap px-2.5 py-1 rounded-full bg-slate-900 hover:bg-slate-800 border border-slate-700 hover:border-amber-500/50 text-[10px] text-slate-300 hover:text-amber-200 transition">
                      ${phrase}
                    </button>
                  `).join('')}
                </div>

                <div class="p-2.5 bg-slate-950 border-t border-amber-500/20 flex gap-2">
                  <input type="text" 
                         id="chat-input-field"
                         placeholder="Type a battle message..."
                         value="${state.chatInput}"
                         oninput="state.chatInput = this.value;"
                         onkeydown="if(event.key === 'Enter') sendChatMessage();"
                         class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-100 placeholder-slate-500 focus:outline-none focus:border-amber-400" />
                  <button onclick="sendChatMessage();" 
                          class="px-4 py-2 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 text-slate-950 font-cinzel font-black text-xs rounded-xl shadow active:scale-95 transition">
                    SEND
                  </button>
                </div>
              </div>
            </div>
          ` : ''}
        `;
        return;
      }

      if (state.view === 'DECK_BUILDER') {
        app.innerHTML = `
          <div class="flex-1 p-4 max-w-5xl mx-auto w-full flex flex-col">
            <div class="flex justify-between items-center mb-3">
              <h2 class="text-xl font-cinzel font-black text-amber-400">🎴 DECK BUILDER (${state.customDeck.length}/50)</h2>
              <div class="flex gap-2">
                <button onclick="autoFillDeck();" class="px-3 py-1 bg-emerald-700 text-xs font-bold rounded-lg text-white">⚡ Auto Fill</button>
                <button onclick="state.view = 'MENU'; render();" class="px-3 py-1 bg-slate-800 text-xs font-bold rounded-lg text-slate-300">Done</button>
              </div>
            </div>

            <div class="flex-1 overflow-y-auto max-h-[500px] grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-2.5">
              ${[...MONSTERS_DATABASE.slice(0, 30), ...LANDS_DATABASE.slice(0, 30), ...EVENTS_DATABASE.slice(0, 30)].map(card => {
                const count = state.customDeck.filter(c => c.id === card.id).length;
                return `
                  <div class="p-2.5 rounded-xl bg-slate-900 border border-slate-800 flex flex-col justify-between">
                    <div>
                      <div class="font-cinzel font-bold text-xs text-amber-200 truncate">${card.name}</div>
                      <div class="text-[9px] text-slate-400">${card.role || card.category || 'Event'}</div>
                    </div>
                    <div class="flex justify-between items-center mt-2">
                      <span class="text-[10px] font-mono font-bold text-amber-400">${count}/3</span>
                      <div class="flex gap-1">
                        <button onclick="removeCardFromDeck('${card.id}');" class="w-6 h-6 bg-slate-800 hover:bg-slate-700 text-xs rounded font-bold">-</button>
                        <button onclick="addCardToDeck(MONSTERS_DATABASE.find(c => c.id === '${card.id}') || LANDS_DATABASE.find(c => c.id === '${card.id}') || EVENTS_DATABASE.find(c => c.id === '${card.id}'));" class="w-6 h-6 bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs rounded font-bold">+</button>
                      </div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
        return;
      }

      if (state.view === 'INSTRUCTIONS' || state.view === 'ARCHIVES') {
        app.innerHTML = `
          <div class="flex-1 p-4 max-w-4xl mx-auto w-full flex flex-col">
            <div class="flex justify-between items-center mb-4">
              <h2 class="text-xl font-cinzel font-black text-amber-400">${state.view === 'INSTRUCTIONS' ? '📖 HOW TO PLAY' : '📚 CARD LORE ARCHIVE'}</h2>
              <button onclick="state.view = 'MENU'; render();" class="px-3 py-1 bg-slate-800 text-xs rounded-lg font-bold">← Menu</button>
            </div>
            <div class="flex-1 overflow-y-auto bg-slate-900/60 p-4 rounded-2xl border border-slate-800 text-xs leading-relaxed space-y-3">
              <p><b>1. Hero Commander:</b> Protect your King. If your Hero falls to 0 HP, checkmate occurs.</p>
              <p><b>2. Territory Dominion:</b> Control Cities, Seas, Sacred Churches, and Islands to harvest Dominion. Reaching 100 Dominion wins!</p>
              <p><b>3. Kalayaan Energy & Leadership:</b> Build lands to increase energy harvest, and capture cities to boost leadership.</p>
              <p><b>4. Network Duels:</b> Host a room to generate a room code. The second player can join from another machine using that code.</p>
            </div>
          </div>
        `;
        return;
      }

      if (state.view === 'VICTORY' && state.victoryData) {
        app.innerHTML = `
          <div class="flex-1 flex items-center justify-center p-4">
            <div class="bg-slate-900 border-2 border-amber-500/80 rounded-3xl p-6 max-w-sm w-full text-center shadow-2xl space-y-4">
              <div class="text-5xl">🏆</div>
              <h2 class="text-2xl font-cinzel font-black text-amber-400">${state.victoryData.winner} WINS!</h2>
              <p class="text-xs font-mono text-slate-400">${state.victoryData.reason}</p>
              <button onclick="state.view = 'MENU'; render();" class="w-full py-3 bg-gradient-to-r from-amber-500 to-amber-600 text-slate-950 font-cinzel font-black rounded-xl">
                RETURN TO MENU
              </button>
            </div>
          </div>
        `;
        return;
      }
    }
    window.render = render;

    window.onload = function() {
      render();
    };
    render();
  </script>
</body>
</html>
