        const tile = state.board.find(t => t.r === target.r && t.c === target.c);
        if (tile) {
          const prevOwner = tile.controlledBy;
          if (prevOwner && prevOwner !== unit.owner) {
            const loss = tile.land?.dominionValue || 1;
            if (prevOwner === 1) {
              state.p1DominionTotal = Math.max(0, state.p1DominionTotal - loss);
              addLog(`🔻 Player 1 lost ${loss} Dominion points as AI occupied ${tile.land?.name || 'territory'}!`);
            }
          }
          tile.controlledBy = unit.owner;
        }
        addLog(`🤖 ${unit.card.name} repositioned to (${target.r + 1}, ${target.c + 1}) and seized the initiative.`);
        state.selectedUnitId = null;
        state.validMoves = [];
        state.validAttacks = [];
        render();
      }

      if (state.view !== 'VICTORY') {
        const aiReadyUnits = state.units.filter(u => u.owner === 2 && u.actionsLeft !== undefined);
        aiReadyUnits.forEach(u => { u.actionsLeft = 1; });
        setTimeout(() => {
          if (state.view !== 'VICTORY') endTurn();
        }, 500);
      }
    }
    window.runAITurn = runAITurn;

    function surrenderMatch() {
      let winnerName = '';
      let surrenderReason = '';

      if (state.gameMode === 'NETWORK_2P') {
        if (state.networkRole === 'HOST') {
          winnerName = state.p2Hero.name;
          surrenderReason = `Commander ${state.p1Hero.name} (Player 1) conceded the duel. Victory goes to ${state.p2Hero.name}!`;
        } else {
          winnerName = state.p1Hero.name;
          surrenderReason = `Commander ${state.p2Hero.name} (Player 2) conceded the duel. Victory goes to ${state.p1Hero.name}!`;
        }
      } else if (state.gameMode === 'AI') {
        winnerName = state.p2Hero.name;
        surrenderReason = `Commander ${state.p1Hero.name} conceded the battlefield to the AI!`;
      } else {
        if (state.currentTurn === 1) {
          winnerName = state.p2Hero.name;
          surrenderReason = `Player 1 (${state.p1Hero.name}) conceded the duel.`;
        } else {
          winnerName = state.p1Hero.name;
          surrenderReason = `Player 2 (${state.p2Hero.name}) conceded the duel.`;
        }
      }

      state.victoryData = { winner: winnerName, reason: surrenderReason };
      state.showGameOptionsModal = false;
      state.view = 'VICTORY';

      if (state.gameMode === 'NETWORK_2P') {
        sendP2PMessage({ type: 'CONCEDE_MATCH', victoryData: state.victoryData });
        broadcastGameState();
      }
      render();
    }
    window.surrenderMatch = surrenderMatch;

    let localBroadcast = null;
    try {
      if (typeof window.BroadcastChannel !== 'undefined') {
        localBroadcast = new window.BroadcastChannel('tcg_network_duel_v1');
        localBroadcast.onmessage = (event) => {
          handleIncomingNetworkMessage(event.data);
        };
      }
    } catch (e) {}

    function connectSocketNetwork(roomId, role) {
      if (typeof window.io !== 'function') {
        state.networkError = 'Internet rooms require the Socket.IO server. Start the Node server and reload this page.';
        state.networkStatus = 'IDLE';
        render();
        return false;
      }

      if (state.socket) {
        try { state.socket.disconnect(); } catch (e) {}
      }

      const socket = window.io({ transports: ['websocket', 'polling'] });
      state.socket = socket;
      state.networkTransport = 'SOCKET_IO';
      state.networkStatus = 'WAITING';

      socket.on('connect', () => {
        if (role === 'HOST') {
          socket.emit('create-room', { heroId: state.p1Hero.id, gridSize: state.gridSize });
        } else {
          socket.emit('join-room', { roomId: roomId.toUpperCase(), heroId: state.p2Hero.id });
        }
      });

      socket.on('room-created', data => {
        state.socketRoomId = data.roomId;
        state.onlineRoomCode = data.roomId;
        state.shareUrl = `${window.location.origin}${window.location.pathname}?room=${encodeURIComponent(data.roomId)}`;
        state.hostIpAddress = 'Internet room';
        state.networkStatus = 'WAITING';
        render();
      });

      socket.on('room-joined', data => {
        state.socketRoomId = data.roomId;
        state.onlineRoomCode = data.roomId;
        state.shareUrl = `${window.location.origin}${window.location.pathname}?room=${encodeURIComponent(data.roomId)}`;
        if (data.hero1Id) state.p1Hero = HEROES_DATABASE.find(h => h.id === data.hero1Id) || state.p1Hero;
        state.networkStatus = 'CONNECTED';
        render();
      });

      socket.on('opponent-joined', data => {
        state.networkStatus = 'CONNECTED';
        state.guestIpAddress = 'Internet opponent';
        if (data.heroId) state.p2Hero = HEROES_DATABASE.find(h => h.id === data.heroId) || state.p2Hero;
        render();
      });

      socket.on('room-message', message => handleIncomingNetworkMessage(message));
      socket.on('room-error', message => {
        state.networkError = message || 'Unable to join that room.';
        state.networkStatus = 'IDLE';
        render();
      });
      socket.on('disconnect', () => {
        if (state.view === 'TWO_PLAYER_MENU' && state.networkTransport === 'SOCKET_IO') {
          state.networkError = 'Internet room connection lost.';
          state.networkStatus = 'IDLE';
          render();
        }
      });
      return true;
    }

    function sendP2PMessage(payload) {
      if (state.socket && state.socket.connected && state.socketRoomId) {
        state.socket.emit('room-message', { roomId: state.socketRoomId, message: payload });
      } else if (localBroadcast && state.networkTransport !== 'SOCKET_IO') {
        try { localBroadcast.postMessage(payload); } catch (e) {}
      }
    }

    function broadcastGameState() {
      if (state.gameMode !== 'NETWORK_2P') return;
      const payload = {
        board: state.board,
        units: state.units,
        currentTurn: state.currentTurn,
        turnNumber: state.turnNumber,
        p1Kalayaan: state.p1Kalayaan,
        p2Kalayaan: state.p2Kalayaan,
        p1DominionTotal: state.p1DominionTotal,
        p2DominionTotal: state.p2DominionTotal,
        weather: state.weather,
        p1Hand: state.p1Hand,
        p2Hand: state.p2Hand,
        gameLogs: state.gameLogs,
        view: state.view,
        victoryData: state.victoryData
      };
      sendP2PMessage({ type: 'SYNC_STATE', gameState: payload });
    }

    function handleIncomingNetworkMessage(msg) {
      if (!msg) return;
      if (msg.type === 'REQUEST_JOIN' && state.networkRole === 'HOST') {
        state.networkStatus = 'CONNECTED';
        if (msg.guestHeroId) state.p2Hero = HEROES_DATABASE.find(h => h.id === msg.guestHeroId) || state.p2Hero;
        sendP2PMessage({
          type: 'JOIN_ACCEPTED',
          hostHeroId: state.p1Hero.id,
          gridSize: state.gridSize
        });
        render();
      } else if (msg.type === 'JOIN_ACCEPTED' && state.networkRole === 'CLIENT') {
        state.networkStatus = 'CONNECTED';
        if (msg.hostHeroId) state.p1Hero = HEROES_DATABASE.find(h => h.id === msg.hostHeroId) || state.p1Hero;
        if (msg.gridSize) state.gridSize = msg.gridSize;
        render();
      } else if (msg.type === 'GRID_CHANGED') {
        state.gridSize = msg.gridSize;
        render();
      } else if (msg.type === 'HERO_SELECTED') {
        if (msg.role === 'HOST') {
          state.p1Hero = HEROES_DATABASE.find(h => h.id === msg.heroId) || state.p1Hero;
        } else {
          state.p2Hero = HEROES_DATABASE.find(h => h.id === msg.heroId) || state.p2Hero;
        }
        render();
      } else if (msg.type === 'START_MATCH') {
        if (msg.hero1Id) state.p1Hero = HEROES_DATABASE.find(h => h.id === msg.hero1Id) || state.p1Hero;
        if (msg.hero2Id) state.p2Hero = HEROES_DATABASE.find(h => h.id === msg.hero2Id) || state.p2Hero;
        if (msg.gridSize) state.gridSize = msg.gridSize;
        state.gameMode = 'NETWORK_2P';
        startMatch(state.p1Hero);
      } else if (msg.type === 'SYNC_STATE') {
        const remote = msg.gameState;
        if (remote) {
          state.board = remote.board || state.board;
          state.units = remote.units || state.units;
          state.currentTurn = remote.currentTurn;
          state.turnNumber = remote.turnNumber;
          state.p1Kalayaan = remote.p1Kalayaan;
          state.p2Kalayaan = remote.p2Kalayaan;
          state.p1DominionTotal = remote.p1DominionTotal;
          state.p2DominionTotal = remote.p2DominionTotal;
          state.weather = remote.weather || state.weather;
          state.gameLogs = remote.gameLogs || state.gameLogs;
          state.view = remote.view || 'PLAYING';
          state.victoryData = remote.victoryData || null;
          render();
        }
      } else if (msg.type === 'CONCEDE_MATCH') {
        state.victoryData = msg.victoryData;
        state.view = 'VICTORY';
        state.showGameOptionsModal = false;
        render();
      } else if (msg.type === 'CHAT_MESSAGE') {
        if (msg.senderSessionId === state.sessionId) return;
        state.chatMessages.push({
          id: msg.id || ('msg_' + Date.now()),
          senderRole: msg.senderRole,
          senderName: msg.senderName,
          text: msg.text,
          time: msg.time,
          isMe: false
        });
        if (!state.isChatOpen) state.unreadChatCount = (state.unreadChatCount || 0) + 1;
        playSfx('card_play');
        render();
      }
    }

    async function resolveMyIp() {
      try {
        const res = await fetch('https://api.ipify.org?format=json', { cache: 'no-cache' });
        if (res.ok) {
          const data = await res.json();
          if (data.ip) {
            state.myWanIp = data.ip;
            state.hostIpAddress = data.ip;
            state.onlineRoomCode = data.ip;
          }
        }
      } catch (e) {
        state.myWanIp = '192.168.1.100';
        state.hostIpAddress = '192.168.1.100';
        state.onlineRoomCode = '192.168.1.100';
      }
      if (typeof render === 'function') render();
    }
    window.resolveMyIp = resolveMyIp;
    resolveMyIp();

    function hostNetworkRoom() {
      state.networkRole = 'HOST';
      state.networkStatus = 'WAITING';
      state.networkError = null;
      state.networkTransport = 'SOCKET_IO';
      connectSocketNetwork(null, 'HOST');
    }
    window.hostNetworkRoom = hostNetworkRoom;

    function joinNetworkRoom() {
      const rawInput = (state.targetHostIpInput || state.networkRoomInput || '').trim();
      if (!rawInput) {
        state.networkError = 'Enter the room code or paste the shared room URL first.';
        render();
        return;
      }
      const roomMatch = rawInput.match(/[?&]room=([^&]+)/i);
      const roomId = (roomMatch ? decodeURIComponent(roomMatch[1]) : rawInput).replace(/[^a-z0-9]/gi, '').toUpperCase();
      state.networkRole = 'CLIENT';
      state.onlineRoomCode = roomId;
      state.hostIpAddress = 'Internet room';
      state.networkStatus = 'WAITING';
      state.networkError = null;
      state.networkTransport = 'SOCKET_IO';
      connectSocketNetwork(roomId, 'CLIENT');
    }
    window.joinNetworkRoom = joinNetworkRoom;

    function setHostGridSize(size) {
      if (state.networkRole !== 'HOST') return;
      state.gridSize = size;
      sendP2PMessage({ type: 'GRID_CHANGED', gridSize: size });
      render();
    }
    window.setHostGridSize = setHostGridSize;

    function updateNetworkHeroSelection(heroId) {
      if (state.networkRole === 'HOST') {
        state.p1Hero = HEROES_DATABASE.find(h => h.id === heroId) || state.p1Hero;
      } else {
        state.p2Hero = HEROES_DATABASE.find(h => h.id === heroId) || state.p2Hero;
      }
      sendP2PMessage({ type: 'HERO_SELECTED', role: state.networkRole, heroId: heroId });
      render();
    }
    window.updateNetworkHeroSelection = updateNetworkHeroSelection;

    function simulatePlayer2Join() {
      state.networkStatus = 'CONNECTED';
      const opps = HEROES_DATABASE.filter(h => h.id !== state.p1Hero.id);
      state.p2Hero = opps[Math.floor(Math.random() * opps.length)] || HEROES_DATABASE[1];
      state.guestIpAddress = '192.168.1.105 (Connected Peer)';
      addLog(`🌐 Peer connected to room ${state.onlineRoomCode}!`);
      render();
    }
    window.simulatePlayer2Join = simulatePlayer2Join;

    function copyRoomCodeToClipboard() {
      try {
        const temp = document.createElement('input');
        temp.value = state.onlineRoomCode;
        document.body.appendChild(temp);
        temp.select();
        document.execCommand('copy');
        document.body.removeChild(temp);
        state.copiedCodeMessage = true;
        render();
        setTimeout(() => {
          state.copiedCodeMessage = false;
          render();
        }, 2000);
      } catch (e) {}
    }
    window.copyRoomCodeToClipboard = copyRoomCodeToClipboard;

    function copyShareLinkToClipboard() {
      const value = state.shareUrl || state.onlineRoomCode;
      if (navigator.clipboard && value) navigator.clipboard.writeText(value);
      state.copiedCodeMessage = true;
      render();
      setTimeout(() => { state.copiedCodeMessage = false; render(); }, 1800);
    }
    window.copyShareLinkToClipboard = copyShareLinkToClipboard;

    function toggleChat(force) {
      state.isChatOpen = force !== undefined ? force : !state.isChatOpen;
      if (state.isChatOpen) state.unreadChatCount = 0;
      render();
    }
    window.toggleChat = toggleChat;

    function sendChatMessage(text) {
      const msgText = (typeof text === 'string' ? text : state.chatInput || '').trim();
      if (!msgText) return;
      const myRole = state.networkRole;
      const myHero = myRole === 'HOST' ? state.p1Hero.name : state.p2Hero.name;
      const now = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const msgObj = {
        id: 'msg_' + Date.now() + '_' + Math.random().toString(36).substring(2, 6),
        senderSessionId: state.sessionId,
        senderRole: myRole,
        senderName: myHero,
        text: msgText,
        time: now
      };
      state.chatMessages.push({ ...msgObj, isMe: true });
      state.chatInput = '';
      sendP2PMessage({ type: 'CHAT_MESSAGE', ...msgObj });
      render();
    }
    window.sendChatMessage = sendChatMessage;

    function renderChatDrawer() {
      if (!state.isChatOpen) return '';
      return `
        <div class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
          <div class="bg-slate-900 border border-amber-500/40 rounded-t-3xl sm:rounded-2xl max-w-lg w-full h-[500px] max-h-[85vh] flex flex-col shadow-2xl overflow-hidden">
            <div class="p-3 bg-slate-950 border-b border-amber-500/20 flex justify-between items-center">
              <div class="flex items-center gap-2">
                <span class="text-lg">💬</span>
                <div class="font-cinzel font-black text-amber-300 text-xs sm:text-sm">BATTLE COMMS LINK</div>
              </div>
              <button onclick="toggleChat(false);" class="w-7 h-7 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 flex items-center justify-center text-xs font-bold">✕</button>
            </div>
            <div class="flex-1 p-3 overflow-y-auto space-y-2.5 text-xs">
              ${state.chatMessages.map(msg => `
                <div class="flex flex-col ${msg.isMe ? 'items-end' : 'items-start'}">
                  <div class="text-[9px] font-mono text-slate-400 mb-0.5">${msg.senderName} • ${msg.time}</div>
                  <div class="max-w-[80%] px-3 py-2 rounded-xl text-xs ${msg.isMe ? 'bg-amber-500 text-slate-950 font-medium' : 'bg-slate-800 text-slate-200 border border-slate-700'}">
                    ${msg.text}
                  </div>
                </div>
              `).join('')}
            </div>
            <div class="px-3 py-1.5 bg-slate-950 border-t border-slate-800 flex gap-1.5 overflow-x-auto">
              ${state.quickPhrases.map(phrase => `
                <button onclick="sendChatMessage('${phrase}');" class="whitespace-nowrap px-2.5 py-1 rounded-full bg-slate-900 border border-slate-700 text-[10px] text-slate-300 hover:border-amber-400">
                  ${phrase}
                </button>
              `).join('')}
            </div>
            <div class="p-2.5 bg-slate-950 border-t border-amber-500/20 flex gap-2">
              <input type="text" placeholder="Type a message..." value="${state.chatInput || ''}" oninput="state.chatInput = this.value;" onkeydown="if(event.key === 'Enter') sendChatMessage();" class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-amber-400" />
              <button onclick="sendChatMessage();" class="px-4 py-2 bg-amber-500 text-slate-950 font-cinzel font-black text-xs rounded-xl shadow">SEND</button>
            </div>
          </div>
        </div>
      `;
    }
    window.renderChatDrawer = renderChatDrawer;
  </script>

                </button>

                <button onclick="state.view = 'ARCHIVES'; render();" 
                        class="py-2.5 px-2 bg-slate-900/90 hover:bg-slate-800 border border-slate-700 hover:border-slate-500 text-slate-200 font-bold text-[11px] rounded-xl transition flex flex-col items-center justify-center gap-1 shadow">

                  <span>LORE CODEX</span>
                </button>

            </div>

            <!-- Asset Folder & XML Database Modal -->
            ${state.showAssetConfigModal ? `
              <div class="fixed inset-0 bg-black/75 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                <div class="bg-slate-900 border border-amber-500/60 rounded-3xl p-5 max-w-md w-full shadow-2xl space-y-4 text-left">
                  <div class="flex justify-between items-center pb-2 border-b border-slate-800">
                    <div class="font-cinzel font-black text-amber-400 text-sm flex items-center gap-2">
                      <span>📁</span> CARD ASSET FOLDER & XML DATABASE

                      <div class="pt-1 flex items-center justify-between gap-2">
                        <div class="text-[10px] font-mono text-slate-400">Black-Point Crusher (removes dark box haze):</div>
                        <div class="flex items-center gap-1">
                          ${[110, 140, 165].map(c => `
                            <button onclick="state.logoContrast = ${c}; render();" class="px-2.5 py-1 rounded-lg text-[10px] font-mono transition ${(state.logoContrast || 140) === c ? 'bg-amber-500 text-slate-950 font-bold shadow' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}">
                              ${c === 110 ? 'Low' : c === 140 ? 'Medium' : 'Ultra'}
                            </button>

                        </div>
                      </div>
                    </div>
                  </div>

                  <!-- 2. XML Database File Options -->
                  <div class="space-y-2 pt-2 border-t border-slate-800">

                    const isMove = state.validMoves.some(m => m.r === tile.r && m.c === tile.c);
                    const isAttack = state.validAttacks.some(a => a.r === tile.r && a.c === tile.c);

                    const hasParalyze = unit && unit.statuses && unit.statuses.paralyze > 0;

                              ${unit.actionsLeft > 0 && !hasSleep ? `<span class="w-1.5 h-1.5 rounded-full bg-emerald-400" title="Ready to act"></span>` : ''}

                        <span>🩸</span> VAMPIRIC BLEED
                      </div>
                      <p class="text-xs text-slate-300 mt-1">Suffers <b>-2 HP damage</b> at turn end. Applied by Licerio Gerónimo and Aswang mythos.</p>
                    </div>

                    <div class="p-3 rounded-xl bg-slate-950 border border-indigo-500/40">
                      <div class="font-cinzel font-bold text-indigo-400 text-xs flex items-center gap-1">
                        <span>💤</span> SLEEP
                      </div>
                      <p class="text-xs text-slate-300 mt-1">Unit is incapacitated and <b>cannot move or act</b> until it awakens. Inflicted by Batibat and Marcelo del Pilar.</p>
                    </div>

                    <div class="p-3 rounded-xl bg-slate-950 border border-amber-500/40">
                      <div class="font-cinzel font-bold text-amber-400 text-xs flex items-center gap-1">
                        <span>⚡</span> PARALYSIS
                      </div>
                      <p class="text-xs text-slate-300 mt-1">Unit is locked in place and <b>cannot launch attacks</b>. Inflicted by Tikbalang and Antonio Luna.</p>
                    </div>
                  </div>

                  <div class="p-3 bg-slate-950 rounded-xl border border-slate-800 text-xs text-slate-300 space-y-1">
                    <div class="font-cinzel font-bold text-amber-300">✨ CLEANSING CONDITIONS:</div>
                    <p>Cast tactical Event cards on the unit, station them inside Sacred Church tiles, equip healing relics like <i>Alon at Daluyong</i>, or deploy <b>Geronima Pecson</b> / <b>Jose Burgos</b> to cleanse all allied conditions.</p>
                  </div>
                </div>
              ` : tab === 'EQUIP_EVENTS' ? `
                <div class="space-y-4">
                  <div class="border-b border-slate-800 pb-3">
                    <h3 class="font-cinzel font-black text-amber-300 text-base flex items-center gap-2">
                      <span>🛡️</span> RELIC ARMAMENTS & TACTICAL EVENT CARDS
                    </h3>
                    <p class="text-slate-300 mt-1">Equip persistent ancestral relics or trigger instant historical surges:</p>
                  </div>

                  <div class="space-y-3">
                    <div class="p-3.5 bg-slate-950 rounded-xl border border-amber-500/40 space-y-1.5">
                      <div class="font-cinzel font-bold text-amber-400 text-xs">🛡️ ATTACHING RELICS & ITEMS (100 CARDS)</div>
                      <p class="text-xs text-slate-300 leading-relaxed">
                        Play a Relic card from your hand and click an eligible allied unit (Hero Commanders hold up to 2 items; Mythos hold 1 item). Relics grant instant permanent stat bonuses (+ATK, +DEF, +HP) and duration-based passive protections that decrement each turn.
                      </p>
                    </div>

                    <div class="p-3.5 bg-slate-950 rounded-xl border border-cyan-500/40 space-y-1.5">
                      <div class="font-cinzel font-bold text-cyan-400 text-xs">📜 CASTING TACTICAL EVENTS (200 CARDS)</div>
                      <p class="text-xs text-slate-300 leading-relaxed">
                        <b>Dominion Siege Events:</b> Military operations like <i>Battle of Mactan</i>, <i>Burning of Intramuros</i>, and <i>Balangiga Encounter</i> directly deplete the opponent's Dominion total by <b>6 to 10 points</b>!
                        <br><b>Draw Events:</b> (e.g. <i>Propaganda Movement</i>, <i>EDSA Revolution</i>) immediately draw 1 to 2 cards from your deck.
                        <br><b>Tactical Surges:</b> Target any friendly Hero or Mythos unit to grant <b>+2 ATK, +1 DEF, +4 HP heal, cleanse debuffs, and refresh action!</b>
                      </p>
                    </div>
                  </div>
                </div>
              ` : `
                <div class="space-y-4">
                  <div class="border-b border-slate-800 pb-3">
                    <h3 class="font-cinzel font-black text-indigo-400 text-base flex items-center gap-2">
                      <span>🌐</span> SOCKET.IO INTERNET ROOM DUELS
                    </h3>
                    <p class="text-slate-300 mt-1">Play wirelessly across two laptops or smartphones connected to the same Wi-Fi router:</p>
                  </div>

                  <div class="space-y-2.5 text-xs text-slate-300">
                    <div class="p-3 bg-slate-950 rounded-xl border border-slate-800">
                      <b class="text-amber-400">Step 1 (Player 1 Host):</b> Under Two Player Duel, select "Socket.IO Internet Room" and create a room. Configure the battlefield grid (5x5, 7x7, 9x9, or 12x12).
                    </div>
                    <div class="p-3 bg-slate-950 rounded-xl border border-slate-800">
                      <b class="text-blue-400">Step 2 (Player 2 Challenger):</b> Open the shared game URL or enter the room code on the second machine, then join the room.
                    </div>
                    <div class="p-3 bg-slate-950 rounded-xl border border-slate-800">
                      <b class="text-emerald-400">Automatic Inversion:</b> Player 2's grid automatically inverts so both players comfortably command from their own baseline. Use the in-game <b>💬 Battle Comms</b> drawer for live strategic chat!
                    </div>
                  </div>
                </div>
              `}
            </div>
          </div>
        `;
        return;
      }

      if (state.view === 'VICTORY' && state.victoryData) {
        app.innerHTML = `
          <div class="flex-1 flex items-center justify-center p-4">
            <div class="bg-slate-900 border-2 border-amber-500/80 rounded-3xl p-6 max-w-sm w-full text-center shadow-2xl space-y-4">
              <div class="text-5xl">🏆</div>
              <h2 class="text-2xl font-cinzel font-black text-amber-400">${state.victoryData.winner} WINS!</h2>
              <p class="text-xs font-mono text-slate-400 leading-relaxed">${state.victoryData.reason}</p>
              <button onclick="state.view = 'MENU'; render();" class="w-full py-3 bg-gradient-to-r from-amber-500 to-amber-600 text-slate-950 font-cinzel font-black rounded-xl">
                RETURN TO MENU
              </button>
            </div>
          </div>
        `;
        return;
      }
    }
    window.render = render;

    window.onload = function() {
      // Attempt to load external cards.xml automatically if served via a local web server
      loadCardsFromXmlUrl('catalogs/cards.xml');
      loadModularCatalogs();
      const sharedRoom = new URLSearchParams(window.location.search).get('room');
      if (sharedRoom) {
        state.twoPlayerTab = 'NETWORK';
        state.networkRoomInput = sharedRoom.toUpperCase();
        state.targetHostIpInput = sharedRoom.toUpperCase();
      }
      render();
    };
    render();
  </script>
</body>
</html>
