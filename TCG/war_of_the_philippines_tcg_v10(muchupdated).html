  <script>
    function playSfx(type) {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        if (type === 'card_play') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(300, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(620, ctx.currentTime + 0.12);
          gain.gain.setValueAtTime(0.18, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.12);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(); osc.stop(ctx.currentTime + 0.12);
        } else if (type === 'attack') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(170, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(50, ctx.currentTime + 0.22);
          gain.gain.setValueAtTime(0.25, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.22);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(); osc.stop(ctx.currentTime + 0.22);
        } else if (type === 'skill') {
          [440, 554, 659, 880].forEach((f, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(f, ctx.currentTime + i * 0.05);
            gain.gain.setValueAtTime(0.18, ctx.currentTime + i * 0.05);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + i * 0.05 + 0.22);
            osc.connect(gain); gain.connect(ctx.destination);
            osc.start(ctx.currentTime + i * 0.05); osc.stop(ctx.currentTime + i * 0.05 + 0.22);
          });
        } else if (type === 'coin') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(987.77, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(1318.51, ctx.currentTime + 0.25);
          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(); osc.stop(ctx.currentTime + 0.25);
        }
      } catch (e) {}
    }
    window.playSfx = playSfx;

    function showBattleToast(message, tone = 'amber') {
      const existing = document.getElementById('battleToast');
      if (existing) existing.remove();

      const toast = document.createElement('div');
      toast.id = 'battleToast';
      toast.className = 'fixed left-1/2 -translate-x-1/2 top-5 z-[60] px-4 py-2 rounded-full text-[11px] font-cinzel font-black tracking-[0.16em] uppercase shadow-2xl border backdrop-blur-md';
      toast.style.background = tone === 'blue' ? 'rgba(30, 64, 175, 0.84)' : tone === 'red' ? 'rgba(127, 29, 29, 0.84)' : 'rgba(120, 53, 15, 0.86)';
      toast.style.borderColor = tone === 'blue' ? 'rgba(96, 165, 250, 0.8)' : tone === 'red' ? 'rgba(248, 113, 113, 0.8)' : 'rgba(252, 211, 77, 0.8)';
      toast.style.color = '#f8fafc';
      toast.textContent = message;
      document.body.appendChild(toast);

      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translate(-50%, -8px)';
        setTimeout(() => toast.remove(), 350);
      }, 1700);
    }
    window.showBattleToast = showBattleToast;

    function applyBattleMomentum() {
      const currentPlayer = state.currentTurn === 1 ? 'P1' : 'P2';
      const energized = state.currentTurn === 1 ? state.p1Kalayaan : state.p2Kalayaan;
      const currentHero = state.currentTurn === 1 ? state.p1Hero : state.p2Hero;
      const alliedUnits = state.units.filter(u => u.owner === state.currentTurn);

      alliedUnits.forEach(unit => {
        const healAmount = Math.max(2, Math.round((unit.card.hp || 25) * 0.12));
        unit.currentHp = Math.min(unit.card.hp || 25, (unit.currentHp || 0) + healAmount);
        unit.actionsLeft = 1;
        if (!unit.statuses) unit.statuses = { poison: 0, bleed: 0, sleep: 0, paralyze: 0 };
        if (unit.statuses.sleep > 0) unit.statuses.sleep = Math.max(0, unit.statuses.sleep - 1);
        if (unit.statuses.paralyze > 0) unit.statuses.paralyze = Math.max(0, unit.statuses.paralyze - 1);
      });

      if (state.currentTurn === 1) {
        state.p1Kalayaan = Math.min(10, energized + 2);
      } else {
        state.p2Kalayaan = Math.min(10, energized + 2);
      }

      showBattleToast(`${currentHero.name} rallies the battlefield! +2 energy + morale boost.`, currentPlayer === 'P1' ? 'amber' : 'blue');
      addLog(`📣 ${currentHero.name} ordered a battlefield rally. Allied units recovered morale and +2 Kalayaan surged to ${currentPlayer}!`);
      render();
    }
    window.applyBattleMomentum = applyBattleMomentum;
  </script>

    function parseCardsFromXml(xmlString) {
      try {

        if (parseError) {
          throw new Error("XML formatting error: " + parseError.textContent.slice(0, 100));
        }

        const loadedHeroes = [];
        const loadedMythos = [];
        const loadedLands = [];
        const loadedEvents = [];
        const loadedEquips = [];

        // Parse Heroes
        xmlDoc.querySelectorAll("hero").forEach(el => {
          loadedHeroes.push({
            id: el.getAttribute("id") || ("h_" + Math.random().toString(36).substr(2, 5)),
            heroCategory: el.getAttribute("category") || "HISTORICAL",

            homeland: el.querySelector("homeland")?.textContent || "Philippines",
            avatarSymbol: el.querySelector("symbol")?.textContent || "👑",
            effect: el.querySelector("effect")?.textContent || "",
            lore: el.querySelector("lore")?.textContent || ""
          });
        });

        // Parse Mythos
        xmlDoc.querySelectorAll("mythos").forEach(el => {

            atk: parseInt(el.querySelector("atk")?.textContent || "8", 10),
            def: parseInt(el.querySelector("def")?.textContent || "6", 10),
            hp: parseInt(el.querySelector("hp")?.textContent || "15", 10),
            cost: parseInt(el.querySelector("cost")?.textContent || "2", 10),
            reqLeadership: parseInt(el.querySelector("leadership")?.textContent || "3", 10),
            role: el.querySelector("role")?.textContent || "Deity",
            avatarSymbol: el.querySelector("symbol")?.textContent || "🐉",
            effect: el.querySelector("effect")?.textContent || "Standard combat strike.",
            lore: el.querySelector("lore")?.textContent || "",
            imageUrl: el.querySelector("image")?.textContent || ""
          });
        });

        // Parse Lands
        xmlDoc.querySelectorAll("land").forEach(el => {
          loadedLands.push({
            id: el.getAttribute("id") || ("l_" + Math.random().toString(36).substr(2, 5)),
            name: el.querySelector("name")?.textContent || "Territory",
            category: el.querySelector("category")?.textContent || "Cities",

            imageUrl: el.querySelector("image")?.textContent || ""
          });

        // Parse Events
        xmlDoc.querySelectorAll("event").forEach(el => {
          loadedEvents.push({

            name: el.querySelector("name")?.textContent || "Event",

            dominionDamage: parseInt(el.querySelector("dominionDamage")?.textContent || "0", 10),
            effect: el.querySelector("effect")?.textContent || "",
            lore: el.querySelector("lore")?.textContent || "",
            imageUrl: el.querySelector("image")?.textContent || ""

    async function loadCardsFromXmlUrl(url = state.xmlSourceUrl) {
      try {
        const res = await fetch(url, { cache: 'no-cache' });
        if (!res.ok) throw new Error(`HTTP status ${res.status}`);
        const text = await res.text();
        return parseCardsFromXml(text);
      } catch (err) {
        // Silent fallback to built-in in-memory database if file isn't served via HTTP server
        console.info(`External XML auto-load (${url}) not reachable. Using embedded card database.`);
        return false;
      }
    }
    window.loadCardsFromXmlUrl = loadCardsFromXmlUrl;

    async function loadModularCatalogs() {
      const sources = [
        { url: 'catalogs/mythos.xml', selector: 'mythos', target: 'MONSTERS_DATABASE' },
        { url: 'catalogs/relics.xml', selector: 'relic', target: 'EQUIPMENTS_DATABASE' },
        { url: 'catalogs/events.xml', selector: 'event', target: 'EVENTS_DATABASE' },
        { url: 'catalogs/lands.xml', selector: 'land', target: 'LANDS_DATABASE' }
      ];
      const replaceById = (target, records) => {
        const current = Array.isArray(window[target]) ? [...window[target]] : [];
        records.forEach(record => {
          const index = current.findIndex(existing => existing.id === record.id);
          if (index >= 0) current[index] = { ...current[index], ...record };
          else current.push(record);
        });
        window[target] = current;
      };

      for (const source of sources) {
        try {
          const response = await fetch(source.url, { cache: 'no-cache' });
          if (!response.ok) continue;
          const xml = new DOMParser().parseFromString(await response.text(), 'text/xml');
          const records = [...xml.querySelectorAll(source.selector)].map(el => {
            const value = name => el.querySelector(name)?.textContent || '';
            const number = (name, fallback = 0) => parseInt(value(name) || String(fallback), 10);
            if (source.selector === 'mythos') return { id: el.getAttribute('id'), name: value('name'), role: value('role'), atk: number('atk'), def: number('def'), hp: number('hp'), move: number('move', 2), cost: number('cost', 2), reqLeadership: number('leadership', 3), avatarSymbol: value('symbol') || '🐉', effect: value('effect'), lore: value('lore'), imageUrl: value('image') };
            if (source.selector === 'land') return { id: el.getAttribute('id'), name: value('name'), category: value('category'), dominionValue: number('dominion', 1), energyBonus: number('energy', 1), cost: number('cost', 1), reqLeadership: number('leadership', 1), desc: value('desc'), lore: value('lore'), imageUrl: value('image') };
            if (source.selector === 'event') return { id: el.getAttribute('id'), name: value('name'), cost: number('cost', 1), reqLeadership: number('leadership', 1), drawAmount: number('draw'), dominionDamage: number('dominionDamage'), effect: value('effect'), lore: value('lore'), imageUrl: value('image') };
            return { id: el.getAttribute('id'), name: value('name'), subTitle: value('subTitle'), atkBoost: number('atkBoost'), defBoost: number('defBoost'), hpBoost: number('hpBoost'), duration: number('duration', 2), cost: number('cost', 1), reqLeadership: number('leadership', 1), passive: value('passive'), lore: value('lore'), imageUrl: value('image') };
          });
          replaceById(source.target, records);
        } catch (error) {
          console.info(`Modular catalog ${source.url} not reachable; embedded records remain active.`);
        }
      }
      window.MONSTERS_DATABASE = window.MONSTERS_DATABASE || [];
      window.LANDS_DATABASE = window.LANDS_DATABASE || [];
      window.EVENTS_DATABASE = window.EVENTS_DATABASE || [];
      window.EQUIPMENTS_DATABASE = window.EQUIPMENTS_DATABASE || [];
      render();
    }
    window.loadModularCatalogs = loadModularCatalogs;

    function handleXmlFileUpload(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        const content = e.target.result;
        if (content) parseCardsFromXml(content);
      };
      reader.readAsText(file);
    }
    window.handleXmlFileUpload = handleXmlFileUpload;

      xml += `  <!-- MYTHOS UNITS -->\n  <mythos_cards>\n`;

        xml += `      <leadership>${m.reqLeadership || 3}</leadership>\n`;
        xml += `      <role>${m.role || 'Deity'}</role>\n`;
        xml += `      <symbol>${m.avatarSymbol || '🐉'}</symbol>\n`;
        xml += `      <effect><![CDATA[${m.effect || ''}]]></effect>\n`;
        xml += `      <lore><![CDATA[${m.lore || ''}]]></lore>\n`;
        xml += `    </mythos>\n`;
      });
      xml += `  </mythos_cards>\n\n`;

      xml += `  <!-- TERRITORIES / LANDS -->\n  <lands>\n`;
      LANDS_DATABASE.forEach(l => {
        xml += `    <land id="${l.id}">\n`;
        xml += `      <name><![CDATA[${l.name}]]></name>\n`;
        xml += `      <category>${l.category}</category>\n`;
        xml += `      <dominion>${l.dominionValue || 1}</dominion>\n`;
        xml += `      <energy>${l.energyBonus || 1}</energy>\n`;
        xml += `      <cost>${l.cost || 1}</cost>\n`;
        xml += `      <leadership>${l.reqLeadership || 1}</leadership>\n`;
        xml += `      <desc><![CDATA[${l.desc || ''}]]></desc>\n`;
        xml += `    </land>\n`;
      });
      xml += `  </lands>\n\n`;

      xml += `  <!-- HISTORICAL EVENTS -->\n  <events>\n`;
      EVENTS_DATABASE.forEach(e => {
        xml += `    <event id="${e.id}">\n`;
        xml += `      <name><![CDATA[${e.name}]]></name>\n`;
        xml += `      <cost>${e.cost || 1}</cost>\n`;
        xml += `      <leadership>${e.reqLeadership || 1}</leadership>\n`;
        xml += `      <draw>${e.drawAmount || 0}</draw>\n`;
        xml += `      <dominionDamage>${e.dominionDamage || 0}</dominionDamage>\n`;
        xml += `      <effect><![CDATA[${e.effect || ''}]]></effect>\n`;
        xml += `    </event>\n`;
      });
      xml += `  </events>\n\n`;

      xml += `  <!-- RELICS & EQUIPMENTS -->\n  <equipments>\n`;
      EQUIPMENTS_DATABASE.forEach(eq => {
        xml += `    <equipment id="${eq.id}">\n`;
        xml += `      <name><![CDATA[${eq.name}]]></name>\n`;
        xml += `      <subtitle><![CDATA[${eq.subTitle || ''}]]></subtitle>\n`;
        xml += `      <atkBoost>${eq.atkBoost || 0}</atkBoost>\n`;
        xml += `      <defBoost>${eq.defBoost || 0}</defBoost>\n`;
        xml += `      <hpBoost>${eq.hpBoost || 0}</hpBoost>\n`;
        xml += `      <duration>${eq.duration || 2}</duration>\n`;
        xml += `      <cost>${eq.cost || 1}</cost>\n`;
        xml += `      <leadership>${eq.reqLeadership || 1}</leadership>\n`;
        xml += `      <passive><![CDATA[${eq.passive || ''}]]></passive>\n`;
        xml += `      <lore><![CDATA[${eq.lore || ''}]]></lore>\n`;
        xml += `      <effect><![CDATA[${eq.effect || ''}]]></effect>\n`;
        xml += `    </equipment>\n`;
      });
      xml += `  </equipments>\n`;

      xml += `</tcg_database>`;

      const blob = new Blob([xml], { type: "application/xml;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "cards.xml";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      addLog("💾 Exported full card roster to cards.xml!");
    }
    window.exportDatabaseToXml = exportDatabaseToXml;
  </script>

  <script>
    function renderPhysicalTcgCard(card, copies = 0, isJumbo = false) {
      if (!card) return '';

      const isMythos = Boolean(card.hp && card.atk && !card.leadership);
      const isLand = Boolean(card.category);
      const isEvent = Boolean(!card.hp && !card.category && !card.leadership && !card.atkBoost && !card.defBoost);
      const isEquip = Boolean(card.id && card.id.startsWith('eq'));
      const isHero = Boolean(card.leadership && card.homeland);
      const isHistoricalHero = isHero && card.heroCategory === 'HISTORICAL';
      const isFictionalHero = isHero && card.heroCategory === 'FICTIONAL';
      const isArchiveView = state.view === 'ARCHIVES';

      let frameGrad = 'from-amber-950/90 via-slate-900 to-amber-950/90';

      let artBackdrop = 'from-amber-900/40 via-yellow-950/30 to-slate-950';

      if (isHistoricalHero) {
        frameGrad = 'from-yellow-950 via-slate-950 to-amber-950';
        borderGlow = 'border-yellow-400 shadow-[0_0_30px_rgba(250,204,21,0.35)] ring-1 ring-yellow-400/50';

        artBackdrop = 'from-amber-900/50 via-stone-900 to-slate-950';

        frameGrad = 'from-emerald-950 via-slate-950 to-teal-950';

      const isInspected = state.activeCardPreview && state.activeCardPreview.id === card.id;

    window.renderPhysicalTcgCard = renderPhysicalTcgCard;

    function addCardToDeck(cardId) {
      if (!cardId) return;
      const card = findCardById(cardId);
      if (!card) return;

      if (state.customDeck.length >= 50) {
        addLog("⚠️ Maximum deck size reached! (50/50 cards limit)");
        render();
        return;
      }
      const copies = state.customDeck.filter(c => c.id === card.id).length;
      if (copies >= 3) {
        addLog(`⚠️ Maximum 3 copies of [${card.name}] allowed!`);
        render();
        return;
      }
      state.customDeck.push(card);
      state.activeCardPreview = card;
      playSfx('card_play');
      render();
    }
    window.addCardToDeck = addCardToDeck;

    function removeCardFromDeck(cardId) {
      const idx = state.customDeck.findIndex(c => c.id === cardId);
      if (idx !== -1) {
        state.customDeck.splice(idx, 1);
        playSfx('card_play');
        render();
      }
    }
    window.removeCardFromDeck = removeCardFromDeck;

    function clearDeck() {
      state.customDeck = [];
      playSfx('card_play');
      render();
    }
    window.clearDeck = clearDeck;

    function autoFillDeck() {
      state.customDeck = [...defaultDeck];
      playSfx('skill');
      addLog("⚡ Auto-filled regulation 50-card deck!");
      render();
    }
    window.autoFillDeck = autoFillDeck;

    function getCommanderDeckProfile(hero = state.p1Hero) {
      const text = `${hero?.name || ''} ${hero?.title || ''} ${hero?.effect || ''} ${hero?.lore || ''}`.toLowerCase();
      const profile = { label: 'Balanced Resistance', focus: 'Reliable frontline pressure', tags: [], weights: { mythos: 1, lands: 1, events: 1, relics: 1 } };
      if ((hero?.atk || 0) >= 17 || /attack|strike|charge|ambush|assault|warrior|martial|offensive/.test(text)) {
        profile.label = 'Vanguard Assault'; profile.focus = 'High-ATK Mythos, combat relics, and tempo events'; profile.tags.push('aggression'); profile.weights.mythos += 1.5; profile.weights.relics += 0.8;
      }
      if ((hero?.def || 0) >= 23 || /defen|shield|sanctuary|fortif|guard|immune|stronghold|bastion/.test(text)) {
        profile.label = 'Citadel Defense'; profile.focus = 'Durable Mythos, defensive lands, and protection relics'; profile.tags.push('defense'); profile.weights.lands += 1.1; profile.weights.relics += 1.2;
      }
      if ((hero?.move || 0) >= 3 || /flying|wind|cavalry|rush|speed|guerrilla|mobility/.test(text)) {
        profile.label = 'Mobile Raiding'; profile.focus = 'Fast Mythos, water lanes, and movement tactics'; profile.tags.push('mobility'); profile.weights.mythos += 0.9; profile.weights.lands += 0.7;
      }
      if (/heal|revive|restore|care|medic|supply|draw|command|leadership|allied/.test(text)) {
        profile.label = profile.tags.includes('defense') ? 'Command Fortress' : 'Battlefield Logistics'; profile.focus = 'Support events, efficient lands, and resilient allies'; profile.tags.push('support'); profile.weights.events += 1.1; profile.weights.lands += 0.6;
      }
      return profile;
    }

    function scoreDeckCardForCommander(card, hero = state.p1Hero) {
      const profile = getCommanderDeckProfile(hero);
      const text = `${card.name || ''} ${card.role || ''} ${card.category || ''} ${card.effect || ''} ${card.desc || ''} ${card.passive || ''}`.toLowerCase();
      let score = 0;
      if (card.hp && card.atk) {
        score = profile.weights.mythos * ((card.atk || 0) * 1.4 + (card.def || 0) * 0.8 + (card.hp || 0) * 0.45) - (card.cost || 1) * 1.2;
        if (profile.tags.includes('aggression') && (card.atk || 0) >= 15) score += 12;
        if (profile.tags.includes('defense') && (card.def || 0) >= 18) score += 12;
        if (profile.tags.includes('mobility') && /flying|wind|water|sea|river|swift|ride/.test(text)) score += 14;
        if (profile.tags.includes('support') && /heal|restore|revive|presence|favor|ward/.test(text)) score += 12;
      } else if (card.category) {
        score = profile.weights.lands * ((card.dominionValue || 1) * 8 + (card.energyBonus || 1) * 5);
        if (profile.tags.includes('mobility') && /sea|water|river|island/.test(text)) score += 12;
        if (profile.tags.includes('defense') && /church|island|city/.test(text)) score += 7;
      } else if (card.id?.startsWith('eq')) {
        score = profile.weights.relics * ((card.atkBoost || 0) * 3 + (card.defBoost || 0) * 2 + (card.hpBoost || 0));
        if (profile.tags.includes('defense') && (card.defBoost || 0) >= 2) score += 10;
        if (profile.tags.includes('aggression') && (card.atkBoost || 0) >= 2) score += 10;
      } else {
        score = profile.weights.events * ((card.drawAmount || 0) * 7 + (card.dominionDamage || 0) * 2 + 4);
        if (profile.tags.includes('support') && /heal|restore|cleanse|draw|revive/.test(text)) score += 12;
        if (profile.tags.includes('aggression') && card.dominionDamage) score += 10;
      }
      return score;
    }

    function getCommanderDeckSuggestions(hero = state.p1Hero, limit = 8) {
      const pool = [...MONSTERS_DATABASE, ...LANDS_DATABASE, ...EVENTS_DATABASE, ...EQUIPMENTS_DATABASE];
      return pool.map(card => ({ card, score: scoreDeckCardForCommander(card, hero) }))
        .sort((a, b) => b.score - a.score || (a.card.cost || 1) - (b.card.cost || 1))
        .slice(0, limit);
    }
    window.getCommanderDeckSuggestions = getCommanderDeckSuggestions;

    function buildCommanderDeck() {
      const profile = getCommanderDeckProfile(state.p1Hero);
      const pool = [...MONSTERS_DATABASE, ...LANDS_DATABASE, ...EVENTS_DATABASE, ...EQUIPMENTS_DATABASE]
        .map(card => ({ card, score: scoreDeckCardForCommander(card, state.p1Hero) }))
        .sort((a, b) => b.score - a.score);
      const deck = [];
      pool.forEach(({ card }) => {
        const copies = deck.filter(existing => existing.id === card.id).length;
        if (copies < 3 && deck.length < 50) deck.push(card);
      });
      state.customDeck = deck;
      state.activeCardPreview = deck[0] || state.p1Hero;
      addLog(`🧠 Built a ${profile.label} deck for ${state.p1Hero.name}.`);
      playSfx('skill');
      render();
    }
    window.buildCommanderDeck = buildCommanderDeck;

    function setMobileDeckTab(tab) {
      state.mobileDeckTab = tab;
      render();
    }
    window.setMobileDeckTab = setMobileDeckTab;

    function loadMoreDeckCatalog() {
      state.deckPage = (state.deckPage || 1) + 1;
      render();
    }
    window.loadMoreDeckCatalog = loadMoreDeckCatalog;

    function getCardLore(card) {
      if (!card) return 'No card selected.';
      if (card.lore && card.lore.trim().length > 0) return card.lore;

      // Mythos specific lore
      if (card.hp && card.atk && !card.leadership) {
        if (card.name === 'BATHALA') return 'The supreme deity of the ancient Tagalogs who resides in Kaluwalhatian. Creator of all mortal existence, earth, sky, and cosmic order, Bathala intervenes to restore balance when mortal arrogance disturbs the spirits.';
        if (card.name === 'BAKUNAWA') return 'The colossal serpent-dragon of the Visayan deep. Believed to rise from the dark ocean floor during lunar eclipses to devour the celestial sisters of Mayari, casting the archipelago into pitch-black dread.';
        if (card.name === 'MAYARI') return 'The enchanting one-eyed lunar goddess of beauty, night, and celestial guidance. While her brother Apolaki governs the blazing sun, Mayari gently illuminates the paths of righteous warriors under moonlit skies.';
        if (card.name === 'APOLAKI') return 'The fierce deity of the sun and patron of pre-colonial warriors. Revered across Luzon for his golden kris and unrelenting wrath against invaders who dare defile ancestral soil.';
        if (card.name === 'TIKBALANG') return 'A towering humanoid spirit possessing the head of an equine stallion. Masters of deception and spatial loops, Tikbalangs confuse travelers in deep mountain forests until their shirts are inverted.';
        if (card.name === 'KAPRE') return 'A giant tree titan dwelling in the canopy of sacred balete and ancient mango trees. Enveloped in the sweet smoke of supernatural tobacco, Kapres fiercely protect untouched forest boundaries.';
        if (card.name === 'MANANANGGAL') return 'A feared creature of Visayan folklore whose upper torso detaches under the moon to take flight on leathery wings, hunting over settlements while leaving its lower half hidden in deep foliage.';
        if (card.name === 'SITAN') return 'The formidable guardian of Kasamaan (the underworld), commanding shadowy spirits of despair, betrayal, and plague to test the resolve of the living.';
        if (card.name.startsWith('DIWATA')) return 'A benevolent pre-colonial nature deity and guardian spirit of rivers, sacred groves, and mountain slopes, bestowing life and blessings upon noble defenders of the land.';
        return `An ancient ancestral entity of Philippine folklore belonging to the ${card.role || 'ancestral'} pantheon. Revered in pre-colonial rites for commanding primordial nature forces across the archipelago.`;
      }

      // Territory Lands specific lore
      if (card.category) {
        if (card.category === 'Cities') return `${card.name} stands as an historic bastion of Filipino civilization, governance, and armed defense. Controlling this bustling citadel expands leadership command and provides +2 Dominion points and +2 Kalayaan energy every turn.`;
        if (card.category.includes('Sea')) return `${card.name} is a vital maritime corridor connecting the 7,641 islands of the Philippine archipelago. Mastery of these strategic waters provides naval mobility and yields +1 Dominion point every turn.`;
        if (card.category.includes('Church')) return `${card.name} is a consecrated sacred ground and architectural monument where communities rallied in times of hardship. Stations defenders with +1 Dominion point and recovers +2 HP at turn end.`;
        if (card.category.includes('Island')) return `${card.name} is an archipelagic fortress surrounded by deep reefs and tides. Controlling this fortress island yields +2 Dominion points every turn and bolsters stationed defenders with +2 DEF.`;
        return `${card.name} is a strategic Philippine territory providing defensive fortification and vital resource harvesting.`;
      }

      // Historical Event specific lore
      if (!card.hp && !card.category && !card.leadership && !card.atkBoost) {
        if (card.dominionDamage) {
          return `A critical campaign in Philippine history. This offensive strike directly saps -${card.dominionDamage} Dominion points from the opposing commander's territorial control!`;
        }
        return `Commemorating the pivotal historical milestone of the "${card.name}". This transformative event galvanized the revolutionary spirit of the Filipino people, turning the tide of resistance and forging national unity across the islands.`;
      }

      // Relic Equipment specific lore
      if (card.id && card.id.startsWith('eq')) {
        return card.lore || `An ancient consecrated armament and ancestral talisman blessed with martial enchantments, passed down across generations of warriors to repel conquerors.`;
      }

      return 'Canonical chronicle and heritage artifact of the Philippine archipelago.';
    }
    window.getCardLore = getCardLore;

    function inspectCard(cardId) {
      const card = findCardById(cardId);
      if (card) {
        state.activeCardPreview = card;
        render();
      }
    }
    window.inspectCard = inspectCard;

    function selectHandCard(idx) {
      state.selectedUnitId = null;
      state.validMoves = [];
      state.validAttacks = [];
      playCardFromHand(idx);
    }
    window.selectHandCard = selectHandCard;

    function handleHandCardButtonClick(idx) {
      const isClient = state.gameMode === 'NETWORK_2P' && state.networkRole === 'CLIENT';
      const isP1Turn = state.currentTurn === 1;
      const hand = (state.gameMode === 'LOCAL_2P') 
        ? (isP1Turn ? state.p1Hand : state.p2Hand) 
        : (isClient ? state.p2Hand : state.p1Hand);
      const card = hand[idx];

      if (state.selectedHandCardIndex === idx && card) {
        if (card.dominionDamage) {
          executeDominionSiege(idx);
          return;
        }
        if (card.drawAmount) {
          executeDrawEvent(idx);
          return;
        }
      }
      selectHandCard(idx);
    }
    window.handleHandCardButtonClick = handleHandCardButtonClick;

    function executeDominionSiege(idx) {
      if (idx === undefined || idx === null) idx = state.selectedHandCardIndex;
      if (idx === null || idx === undefined) return;

      const isClient = state.gameMode === 'NETWORK_2P' && state.networkRole === 'CLIENT';
      const isP1Turn = state.currentTurn === 1;
      const hand = (state.gameMode === 'LOCAL_2P') 
        ? (isP1Turn ? state.p1Hand : state.p2Hand) 
        : (isClient ? state.p2Hand : state.p1Hand);
      const kalayaan = (state.gameMode === 'LOCAL_2P') 
        ? (isP1Turn ? state.p1Kalayaan : state.p2Kalayaan) 
        : (isClient ? state.p2Kalayaan : state.p1Kalayaan);

      const card = hand[idx];
      if (!card || !card.dominionDamage) return;

      const cost = card.cost || 1;
      if (kalayaan < cost) {
        addLog(`⚠️ Not enough Kalayaan Energy to launch siege! Requires ⚡${cost} (Available: ⚡${kalayaan}).`);
        return;
      }

      const isP1 = (state.gameMode === 'LOCAL_2P') ? isP1Turn : !isClient;
      const targetOpponent = isP1 ? 2 : 1;

      if (isP1) {
        state.p1Kalayaan -= cost;
        state.p1Hand.splice(idx, 1);
        state.p2DominionTotal = Math.max(0, state.p2DominionTotal - card.dominionDamage);
      } else {
        state.p2Kalayaan -= cost;
        state.p2Hand.splice(idx, 1);
        state.p1DominionTotal = Math.max(0, state.p1DominionTotal - card.dominionDamage);
      }

      state.graveyard.push(card);
      state.selectedHandCardIndex = null;
      playSfx('attack');

      const remaining = targetOpponent === 1 ? state.p1DominionTotal : state.p2DominionTotal;
      addLog(`💥 [${card.name}] launched a Dominion Siege! Player ${targetOpponent} lost ${card.dominionDamage} Dominion points! (Remaining: ${remaining})`);

      if (state.gameMode === 'NETWORK_2P') broadcastGameState();
      render();
    }
    window.executeDominionSiege = executeDominionSiege;

    function executeDrawEvent(idx) {
      if (idx === undefined || idx === null) idx = state.selectedHandCardIndex;
      if (idx === null || idx === undefined) return;

      const isClient = state.gameMode === 'NETWORK_2P' && state.networkRole === 'CLIENT';
      const isP1Turn = state.currentTurn === 1;
      const hand = (state.gameMode === 'LOCAL_2P') 
        ? (isP1Turn ? state.p1Hand : state.p2Hand) 
        : (isClient ? state.p2Hand : state.p1Hand);
      const kalayaan = (state.gameMode === 'LOCAL_2P') 
        ? (isP1Turn ? state.p1Kalayaan : state.p2Kalayaan) 
        : (isClient ? state.p2Kalayaan : state.p1Kalayaan);

      const card = hand[idx];
      if (!card || !card.drawAmount) return;

      const cost = card.cost || 1;
      if (kalayaan < cost) {
        addLog(`⚠️ Not enough Kalayaan Energy! Requires ⚡${cost} (Available: ⚡${kalayaan}).`);
        return;
      }

      const isP1 = (state.gameMode === 'LOCAL_2P') ? isP1Turn : !isClient;

      if (isP1) {
        state.p1Kalayaan -= cost;
        state.p1Hand.splice(idx, 1);
        for (let i = 0; i < card.drawAmount && state.p1Deck.length > 0; i++) {
          state.p1Hand.push(state.p1Deck.shift());
        }
      } else {
        state.p2Kalayaan -= cost;
        state.p2Hand.splice(idx, 1);
        for (let i = 0; i < card.drawAmount && state.p2Deck.length > 0; i++) {
          state.p2Hand.push(state.p2Deck.shift());
        }
      }

      state.graveyard.push(card);
      state.selectedHandCardIndex = null;
      playSfx('card_play');
      addLog(`📜 Event [${card.name}] activated! Drew ${card.drawAmount} extra cards.`);

      if (state.gameMode === 'NETWORK_2P') broadcastGameState();
      render();
    }
    window.executeDrawEvent = executeDrawEvent;

    function getCardUsageGuide(card) {
      if (!card) return { type: 'CARD', usage: 'Standard card.', instruction: 'Click to play.' };
      
      if (card.dominionDamage) {
        return {
          type: '💥 DOMINION SIEGE EVENT',
          usage: `Direct Strategic Siege! Bypasses front-line units to directly destroy -${card.dominionDamage} Dominion points from the opposing commander's total score, weakening their territorial control.`,
          instruction: `Tap "💥 LAUNCH SIEGE" to instantly sap ${card.dominionDamage} Dominion points from the enemy!`
        };
      }
      if (card.drawAmount) {
        return {
          type: '📜 REINFORCEMENT EVENT',
          usage: `Mobilizes revolutionary supplies and tactical intelligence to draw +${card.drawAmount} extra card(s) from your deck directly into your hand.`,
          instruction: `Tap to immediately draw ${card.drawAmount} extra card(s) from your deck!`
        };
      }
      if (card.id && card.id.startsWith('eq')) {
        return {
          type: '🛡️ EQUIPMENT & ANCESTRAL RELIC',
          usage: `Attach onto any allied Supreme Commander (holds up to 2 relics) or Mythos unit (holds 1 relic). Bestows permanent combat boosts (+${card.atkBoost || 0} ATK, +${card.defBoost || 0} DEF, +${card.hpBoost || 0} HP) and special passive protection for ${card.duration || 2} turns.`,
          instruction: `Tap any allied unit pulsing with an amber border on the grid to attach this relic!`
        };
      }
      if (card.hp && card.atk && !card.leadership) {
        return {
          type: `🐉 MYTHOS SUMMON (${(card.role || 'SPIRIT').toUpperCase()})`,
          usage: `Summon onto an unoccupied grid tile as an active battle unit. Mythos units can advance across tiles to capture territories each turn and attack enemy units.`,
          instruction: `Tap any unoccupied grid tile highlighted in yellow to summon this Mythos!`
        };
      }
      if (card.category) {
        return {
          type: `🏔️ TERRITORY LAND (${card.category.toUpperCase()})`,
          usage: `Colonize or fortify a Philippine territory. Yields +${card.dominionValue || 1} Dominion point(s) every turn toward the ${DOMINION_WIN_TARGET}-point victory, and instantly grants +${card.energyBonus || 1} Kalayaan Energy upon placement.`,
          instruction: `Tap any grid tile highlighted in yellow to establish control over this territory!`
        };
      }
      return {
        type: '✨ TACTICAL SURGE EVENT',
        usage: `Bestows divine blessings and revolutionary rallying onto an active friendly unit: grants +2 ATK, +1 DEF, restores 4 HP, cleanses all negative status ailments (Poison, Sleep, Bleed, Paralysis), and grants an immediate extra action!`,
        instruction: `Tap any friendly Hero Commander or Mythos unit pulsing in cyan on the grid to cast!`
      };
    }
    window.getCardUsageGuide = getCardUsageGuide;

    function renderGameLogo() {
      const logoSrc = state.logoImagePath || './assets/logo.png';
      const mode = state.logoBlendMode || 'ULTRA_FLUID';
      const contrast = state.logoContrast !== undefined ? state.logoContrast : 140;
      const brightness = state.logoBrightness !== undefined ? state.logoBrightness : 98;

      let blendClasses = '';
      let blendStyles = '';

      if (mode === 'ULTRA_FLUID') {
        blendClasses = 'logo-fluid-mask logo-screen-blend';
        blendStyles = `filter: contrast(${contrast}%) brightness(${brightness}%) saturate(115%) drop-shadow(0 0 25px rgba(245, 158, 11, 0.45));`;
      } else if (mode === 'FEATHER_SCREEN') {
        blendClasses = 'logo-vignette-mask logo-screen-blend';
        blendStyles = `filter: contrast(${contrast}%) brightness(${brightness}%);`;
      } else if (mode === 'FEATHER') {
        blendClasses = 'logo-vignette-mask';
        blendStyles = 'filter: contrast(105%);';
      } else if (mode === 'SCREEN') {
        blendClasses = 'logo-screen-blend';
        blendStyles = `filter: contrast(${contrast}%) brightness(${brightness}%);`;
      } else if (mode === 'COLOR_DODGE') {
        blendClasses = 'logo-fluid-mask';
        blendStyles = `mix-blend-mode: color-dodge; filter: contrast(${Math.min(contrast, 120)}%) brightness(90%);`;
      }

      return `
        <div class="relative group cursor-pointer transition transform hover:scale-[1.03] duration-300 select-none flex flex-col items-center">
          <!-- Atmospheric Aura Bloom behind Logo -->
          <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-64 h-64 sm:w-80 sm:h-80 bg-gradient-to-tr from-amber-500/30 via-yellow-600/20 to-cyan-500/20 rounded-full blur-3xl pointer-events-none -z-10 animate-pulse"></div>
          <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-48 h-48 sm:w-60 sm:h-60 bg-gradient-to-b from-amber-400/20 to-transparent rounded-full blur-2xl pointer-events-none -z-10"></div>

          <img src="${logoSrc}" 
               alt="War of the Philippines TCG" 
               class="w-72 sm:w-96 max-h-64 sm:max-h-80 object-contain transition-all duration-300 ${blendClasses}"
               style="${blendStyles}"
               onerror="this.style.display='none'; const fb = document.getElementById('logo-fallback-banner'); if(fb) fb.classList.remove('hidden');" />

          <div id="logo-fallback-banner" class="hidden text-center p-4 rounded-3xl bg-gradient-to-b from-amber-950/80 via-slate-900 to-amber-950/80 border-2 border-amber-500/50 shadow-xl max-w-sm">
            <div class="font-cinzel text-xl sm:text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-300 via-yellow-400 to-amber-500 tracking-wider">
              WAR OF THE PHILIPPINES
            </div>
            <div class="font-cinzel-dec text-[10px] sm:text-[11px] tracking-[0.3em] text-amber-300 font-bold mt-1 border-t border-amber-500/40 pt-1 w-full">
              TRADING CARD GAME
            </div>
            <div class="text-[9px] font-mono text-slate-400 mt-1">
              Logo file pointer: <code class="text-amber-300">${logoSrc}</code>
            </div>
          </div>
        </div>
      `;
    }
    window.renderGameLogo = renderGameLogo;
    window.renderVectorCrest = renderGameLogo;

    function startMatch(heroChoice) {
      if (heroChoice) state.p1Hero = heroChoice;
      if (state.gameMode === 'AI') {
        if (state.selectedDifficulty === 'EASY') {
          state.gridSize = 5;
          state.p2Hero = HEROES_DATABASE[15];
        } else if (state.selectedDifficulty === 'MODERATE') {
          state.gridSize = 7;
          state.p2Hero = HEROES_DATABASE[7];
        } else if (state.selectedDifficulty === 'HARD') {
          state.gridSize = 9;
          state.p2Hero = HEROES_DATABASE[0];
        } else {
          state.gridSize = 12;
          state.p2Hero = HEROES_DATABASE[4];
        }
      }

      const board = [];
      for (let r = 0; r < state.gridSize; r++) {
        for (let c = 0; c < state.gridSize; c++) {
          const landIdx = (r * state.gridSize + c) % LANDS_DATABASE.length;
          board.push({
            r, c,
            land: LANDS_DATABASE[landIdx],
            terrain: getFieldTerrain(r, c, state.gridSize),
            controlledBy: null
          });
        }
      }

      const p1StartR = state.gridSize - 1;
      const p1StartC = Math.floor(state.gridSize / 2);
      const p2StartR = 0;
      const p2StartC = Math.floor(state.gridSize / 2);

      const units = [
        {
          id: 'u_p1_hero', owner: 1, type: 'HERO', card: { ...state.p1Hero },
          r: p1StartR, c: p1StartC, currentHp: state.p1Hero.hp, actionsLeft: 1,
          statuses: { poison: 0, bleed: 0, sleep: 0, paralyze: 0 },
          equipments: []
        },
        {
          id: 'u_p2_hero', owner: 2, type: 'HERO', card: { ...state.p2Hero },
          r: p2StartR, c: p2StartC, currentHp: state.p2Hero.hp, actionsLeft: 1,
          statuses: { poison: 0, bleed: 0, sleep: 0, paralyze: 0 },
          equipments: []
        }
      ];

      board.find(t => t.r === p1StartR && t.c === p1StartC).controlledBy = 1;
      board.find(t => t.r === p2StartR && t.c === p2StartC).controlledBy = 2;

      const deck1 = [...state.customDeck].sort(() => Math.random() - 0.5);
      const deck2 = [...defaultDeck].sort(() => Math.random() - 0.5);

      state.board = board;
      state.units = units;
      state.p1Deck = deck1.slice(4);
      state.p1Hand = deck1.slice(0, 4);
      state.p2Deck = deck2.slice(4);
      state.p2Hand = deck2.slice(0, 4);
      state.p1Kalayaan = 5;
      state.p2Kalayaan = 5;
      state.p1DominionTotal = 0;
      state.p2DominionTotal = 0;
      state.weather = getWeatherForTurn(1);
      state.currentTurn = 1;
      state.turnNumber = 1;
      state.gameLogs = [];
      state.selectedUnitId = null;
      state.selectedTile = null;
      state.selectedHandCardIndex = null;
      state.validMoves = [];
      state.validAttacks = [];
      state.validCardPlacements = [];
      state.validEventTargets = [];
      state.validEquipTargets = [];
      state.showGameOptionsModal = false;
      state.activeCardPreview = state.p1Hero;
      state.view = 'PLAYING';

      addLog(`⚔️ Duel commenced on a ${state.gridSize}x${state.gridSize} battlefield!`);

      if (state.gameMode === 'NETWORK_2P' && state.networkRole === 'HOST') {
        sendP2PMessage({
          type: 'START_MATCH',
          hero1Id: state.p1Hero.id,
          hero2Id: state.p2Hero.id,
          gridSize: state.gridSize
        });
        broadcastGameState();
      }

      render();
    }
    window.startMatch = startMatch;

    function calculateValidActions(unit) {
      if (!unit || unit.owner !== state.currentTurn) return;
      if (state.gameMode === 'NETWORK_2P') {
        if (state.networkRole === 'HOST' && state.currentTurn !== 1) return;
        if (state.networkRole === 'CLIENT' && state.currentTurn !== 2) return;
      }
      const moves = [];
      const attacks = [];
      if ((unit.actionsLeft || 0) <= 0 || (unit.statuses && unit.statuses.sleep > 0)) {
        state.validMoves = [];
        state.validAttacks = [];
        return;
      }
      const maxMove = unit.card.move || 1;
      const canAttack = !unit.statuses || (unit.statuses.paralyze || 0) <= 0;

      for (let r = 0; r < state.gridSize; r++) {
        for (let c = 0; c < state.gridSize; c++) {
          const dist = Math.abs(r - unit.r) + Math.abs(c - unit.c);
          const destination = state.board.find(t => t.r === r && t.c === c);
          const terrainMove = getTerrainMoveAllowance(unit, destination);
          if (dist > 0 && dist <= Math.min(maxMove, terrainMove) && canUnitUseTerrain(unit, destination)) {
            const occ = state.units.find(u => u.r === r && u.c === c);
            if (!occ) {
              moves.push({ r, c });
            } else if (occ.owner !== unit.owner && canAttack) {
              attacks.push({ r, c });
            }
          }
        }
      }
      state.validMoves = moves;
      state.validAttacks = attacks;
    }
    window.calculateValidActions = calculateValidActions;

    function detectUnitAilment(unit) {
      if (!unit || !unit.card) return null;
      const text = `${unit.card.effect || ''} ${unit.card.lore || ''} ${(unit.equipments || []).map(e => (e.passive || '') + ' ' + (e.name || '')).join(' ')}`.toLowerCase();
      if (text.includes('poison') || text.includes('lason')) return 'poison';
      if (text.includes('bleed') || text.includes('dugo')) return 'bleed';
      if (text.includes('sleep') || text.includes('tulog') || text.includes('bangungot')) return 'sleep';
      if (text.includes('paraly') || text.includes('ngalay') || text.includes('loop')) return 'paralyze';
      return null;
    }
    window.detectUnitAilment = detectUnitAilment;

    function triggerAttackCombat(unit, defender) {
      const atkVal = unit.card.atk || 5;
      const defVal = defender.card.def || 2;
      const damage = Math.max(1, atkVal - Math.floor(defVal / 3));
      defender.currentHp -= damage;
      unit.actionsLeft = 0;
      playSfx('attack');
      addLog(`⚔️ ${unit.card.name} struck ${defender.card.name} for ${damage} damage!`);

      if (defender.currentHp <= 0) {
        state.units = state.units.filter(u => u.id !== defender.id);
        state.graveyard.push(defender.card);
        addLog(`💀 ${defender.card.name} was vanquished!`);
        if (defender.type === 'HERO') {
          const winner = unit.owner === 1 ? state.p1Hero.name : state.p2Hero.name;
          state.victoryData = { winner, reason: 'HERO CHECKMATE: Enemy Commander slain!' };
          state.view = 'VICTORY';
        }
      }
      state.selectedUnitId = null;
      state.validMoves = [];
      state.validAttacks = [];
      if (state.gameMode === 'NETWORK_2P') broadcastGameState();
      render();
    }
    window.triggerAttackCombat = triggerAttackCombat;

    function startStatusCoinToss(unit, defender, ailmentType) {
      const isHeads = Math.random() >= 0.5;
      playSfx('coin');
      state.activeCoinToss = {
        attacker: unit,
        defender: defender,
        ailment: ailmentType,
        isSpinning: true,
        result: isHeads ? 'HEADS' : 'TAILS',
        timer: null
      };
      render();

      setTimeout(() => {
        if (!state.activeCoinToss) return;
        state.activeCoinToss.isSpinning = false;
        if (isHeads) {
          if (!defender.statuses) defender.statuses = { poison: 0, bleed: 0, sleep: 0, paralyze: 0 };
          defender.statuses[ailmentType] = 2;
          const label = ailmentType === 'poison' ? 'Poisoned (3 dmg/turn)' : ailmentType === 'bleed' ? 'Bleeding (2 dmg/turn)' : ailmentType === 'sleep' ? 'Asleep (Cannot Act)' : 'Paralyzed (Cannot Attack)';
          addLog(`🪙 Coin Toss: HEADS! ${defender.card.name} was inflicted with ${label} for 2 turns!`);
          playSfx('skill');
        } else {
          addLog(`🪙 Coin Toss: TAILS! ${defender.card.name} resisted the ${ailmentType.toUpperCase()} status effect!`);
        }
        render();

        setTimeout(() => {
          state.activeCoinToss = null;
          triggerAttackCombat(unit, defender);
        }, 1200);
      }, 1400);
    }
    window.startStatusCoinToss = startStatusCoinToss;

    function resolveCoinTossFast() {
      if (!state.activeCoinToss) return;
      const { attacker, defender, ailment, result } = state.activeCoinToss;
      if (result === 'HEADS') {
        if (!defender.statuses) defender.statuses = { poison: 0, bleed: 0, sleep: 0, paralyze: 0 };
        defender.statuses[ailment] = 2;
        addLog(`🪙 Coin Toss: HEADS! ${defender.card.name} was inflicted with ${ailment.toUpperCase()} for 2 turns!`);
      } else {
        addLog(`🪙 Coin Toss: TAILS! ${defender.card.name} resisted the ${ailment.toUpperCase()} status effect!`);
      }
      state.activeCoinToss = null;
      triggerAttackCombat(attacker, defender);
    }
    window.resolveCoinTossFast = resolveCoinTossFast;

    function handleTileClick(r, c) {
      if (state.gameMode === 'NETWORK_2P') {
        if (state.networkRole === 'HOST' && state.currentTurn !== 1) {
          addLog("⏳ Waiting for Player 2's turn...");
          return;
        }
        if (state.networkRole === 'CLIENT' && state.currentTurn !== 2) {
          addLog("⏳ Waiting for Player 1's turn...");
          return;
        }
      }

      if (state.selectedHandCardIndex !== null && state.validEquipTargets && state.validEquipTargets.length > 0) {
        const isEquipTarget = state.validEquipTargets.some(t => t.r === r && t.c === c);
        if (isEquipTarget) {
          executeEquipmentAttach(r, c);
          return;
        }
      }

      if (state.selectedHandCardIndex !== null && state.validEventTargets && state.validEventTargets.length > 0) {
        const isEventTarget = state.validEventTargets.some(t => t.r === r && t.c === c);
        if (isEventTarget) {
          executeEventCast(r, c);
          return;
        }
      }

      if (state.selectedHandCardIndex !== null && state.validCardPlacements && state.validCardPlacements.length > 0) {
        const isPlace = state.validCardPlacements.some(p => p.r === r && p.c === c);
        if (isPlace) {
          executeCardPlacement(r, c);
          return;
        }
      }

      if (state.selectedUnitId) {
        const unit = state.units.find(u => u.id === state.selectedUnitId);
        if (unit && unit.owner === state.currentTurn && (unit.actionsLeft || 0) > 0) {
          const isMove = state.validMoves.some(m => m.r === r && m.c === c);
          const isAttack = state.validAttacks.some(a => a.r === r && a.c === c);

          if (isMove) {
            unit.r = r;
            unit.c = c;
            unit.actionsLeft = 0;
            const tile = state.board.find(t => t.r === r && t.c === c);
            if (tile) {
              const prevOwner = tile.controlledBy;
              if (prevOwner && prevOwner !== unit.owner) {
                const loss = tile.land?.dominionValue || 1;
                if (prevOwner === 1) {
                  state.p1DominionTotal = Math.max(0, state.p1DominionTotal - loss);
                  addLog(`🔻 Player 1 lost ${loss} Dominion points! (${tile.land?.name || 'Territory'} captured by ${unit.card.name})`);
                } else if (prevOwner === 2) {
                  state.p2DominionTotal = Math.max(0, state.p2DominionTotal - loss);
                  addLog(`🔻 Player 2 lost ${loss} Dominion points! (${tile.land?.name || 'Territory'} captured by ${unit.card.name})`);
                }
              }
              tile.controlledBy = unit.owner;
            }
            addLog(`🚩 ${unit.card.name} advanced to (${r + 1}, ${c + 1})!`);
            playSfx('card_play');
            state.selectedUnitId = null;
            state.validMoves = [];
            state.validAttacks = [];
            if (state.gameMode === 'NETWORK_2P') broadcastGameState();
            render();
            return;
          }

          if (isAttack) {
            const defender = state.units.find(u => u.r === r && u.c === c && u.owner !== unit.owner);
            if (defender) {
              const ailment = detectUnitAilment(unit);
              if (ailment) {
                startStatusCoinToss(unit, defender, ailment);
                return;
              }
              triggerAttackCombat(unit, defender);
              return;
            }
          }
        }
      }

      const clickedTile = state.board.find(t => t.r === r && t.c === c);
      state.selectedTile = clickedTile || null;
      if (clickedTile && clickedTile.land) state.activeCardPreview = clickedTile.land;
      const occupant = state.units.find(u => u.r === r && u.c === c);
      if (occupant) {
        state.activeCardPreview = occupant.card;
        state.selectedUnitId = occupant.id;
        if (occupant.owner === state.currentTurn) {
          calculateValidActions(occupant);
        } else {
          state.validMoves = [];
          state.validAttacks = [];
        }
      } else {
        state.selectedUnitId = null;
        state.validMoves = [];
        state.validAttacks = [];
      }
      render();
    }
    window.handleTileClick = handleTileClick;

    function playCardFromHand(idx) {
      const isClient = state.gameMode === 'NETWORK_2P' && state.networkRole === 'CLIENT';
      const isP1Turn = state.currentTurn === 1;
      const hand = (state.gameMode === 'LOCAL_2P') 
        ? (isP1Turn ? state.p1Hand : state.p2Hand) 
        : (isClient ? state.p2Hand : state.p1Hand);
      const kalayaan = (state.gameMode === 'LOCAL_2P') 
        ? (isP1Turn ? state.p1Kalayaan : state.p2Kalayaan) 
        : (isClient ? state.p2Kalayaan : state.p1Kalayaan);

      const card = hand[idx];
      if (!card) return;

      // Clicking an already selected card toggles selection off
      if (state.selectedHandCardIndex === idx) {
        state.selectedHandCardIndex = null;
        state.validCardPlacements = [];
        state.validEventTargets = [];
        state.validEquipTargets = [];
        render();
        return;
      }

      // ALWAYS select and inspect the card in the inspector regardless of Kalayaan points
      state.selectedHandCardIndex = idx;
      state.activeCardPreview = card;
      state.selectedUnitId = null;
      state.validMoves = [];
      state.validAttacks = [];
      state.validCardPlacements = [];
      state.validEventTargets = [];
      state.validEquipTargets = [];

      const cost = card.cost || 1;
      const hasEnoughEnergy = kalayaan >= cost;

      // Check turn permissions in network mode
      const isMyTurn = (state.gameMode === 'LOCAL_2P')
        ? true
        : (state.gameMode !== 'NETWORK_2P' 
            ? (state.currentTurn === 1) 
            : (state.networkRole === 'HOST' ? isP1Turn : !isP1Turn));

      if (!isMyTurn) {
        addLog(`🔍 Inspecting [${card.name}]. (Waiting for opponent's turn to play)`);
        render();
        return;
      }

      // If insufficient energy, keep selected and display in inspector without generating board highlights
      if (!hasEnoughEnergy) {
        addLog(`🔍 Inspecting [${card.name}]. Requires ⚡${cost} Kalayaan (You have ⚡${kalayaan}).`);
        render();
        return;
      }

      // If user has enough energy and it is their turn, prepare actions:
      if (card.dominionDamage) {
        addLog(`💥 [${card.name}] selected! Tap "LAUNCH SIEGE" in the inspector or on the card to strike!`);
        render();
        return;
      }

      if (card.drawAmount) {
        addLog(`📜 [${card.name}] selected! Tap "DRAW CARDS" in the inspector or on the card to activate!`);
        render();
        return;
      }

      if (card.id && (card.id.startsWith('eq') || card.atkBoost !== undefined)) {
        const friendlyUnits = state.units.filter(u => u.owner === state.currentTurn);
        const validUnits = friendlyUnits.filter(u => {
          const maxSlots = u.type === 'HERO' ? 2 : 1;
          return (u.equipments || []).length < maxSlots;
        });

        if (validUnits.length === 0) {
          addLog(`⚠️ No allied units have available equipment slots (Supreme Commanders: 2 max, Mythos: 1 max)!`);
          state.validEquipTargets = [];
          render();
          return;
        }

        state.validEquipTargets = validUnits.map(u => ({ r: u.r, c: u.c, unitId: u.id }));
        addLog(`🛡️ Select an allied unit highlighted in amber to equip [${card.name}]!`);
        render();
        return;
      }

      if (!card.hp && !card.category) {
        const friendlyUnits = state.units.filter(u => u.owner === state.currentTurn);
        if (friendlyUnits.length === 0) {
          addLog(`⚠️ No allied units on the battlefield to target with [${card.name}]!`);
          render();
          return;
        }

        state.validEventTargets = friendlyUnits.map(u => ({ r: u.r, c: u.c, unitId: u.id }));
        addLog(`🎯 Select a friendly unit highlighted in cyan to cast [${card.name}]!`);
        render();
        return;
      }

      const placements = [];
      for (let r = 0; r < state.gridSize; r++) {
        for (let c = 0; c < state.gridSize; c++) {
          const tile = state.board.find(t => t.r === r && t.c === c);
          const occ = state.units.find(u => u.r === r && u.c === c);
          if (canDeployCardAt(card, tile, r, c, state.currentTurn, Boolean(occ))) placements.push({ r, c });
        }
      }
      state.validCardPlacements = placements;
      if (card.hp) {
        const opening = isInitialSummon(card, state.currentTurn);
        addLog(`🐉 Select an unoccupied yellow tile to summon ${card.name}. ${opening ? 'Opening summon: your first two home rows are highlighted.' : 'Mountain passes require a Flying Mythos!'}`);
      } else {
        addLog(`🏔️ Select a highlighted tile to establish ${card.name} territory. Mountain passes reject territory cards!`);
      }
      render();
    }
    window.playCardFromHand = playCardFromHand;

    function executeCardPlacement(r, c) {
      const hand = state.currentTurn === 1 ? state.p1Hand : state.p2Hand;
      const card = hand[state.selectedHandCardIndex];
      if (!card) return;
      const tile = state.board.find(t => t.r === r && t.c === c);
      const occupied = state.units.some(u => u.r === r && u.c === c);
      if (!canDeployCardAt(card, tile, r, c, state.currentTurn, occupied)) {
        addLog(`⚠️ ${card.name} cannot be deployed on ${tile?.terrain?.name || 'that tile'}.`);
        return;
      }

      if (state.currentTurn === 1) state.p1Kalayaan -= (card.cost || 1);
      else state.p2Kalayaan -= (card.cost || 1);
      hand.splice(state.selectedHandCardIndex, 1);

      if (card.hp) {
        state.units.push({
          id: 'u_' + Math.random().toString(36).substring(2, 7),
          owner: state.currentTurn,
          type: 'MONSTER',
          card: { ...card },
          r, c,
          currentHp: card.hp,
          actionsLeft: 0,
          statuses: { poison: 0, bleed: 0, sleep: 0, paralyze: 0 },
          equipments: []
        });
        if (tile) {
          const prevOwner = tile.controlledBy;
          if (prevOwner && prevOwner !== state.currentTurn) {
            const loss = tile.land?.dominionValue || 1;
            if (prevOwner === 1) {
              state.p1DominionTotal = Math.max(0, state.p1DominionTotal - loss);
              addLog(`🔻 Player 1 lost ${loss} Dominion points! (${tile.land?.name || 'Territory'} seized by summoned ${card.name})`);
            } else if (prevOwner === 2) {
              state.p2DominionTotal = Math.max(0, state.p2DominionTotal - loss);
              addLog(`🔻 Player 2 lost ${loss} Dominion points! (${tile.land?.name || 'Territory'} seized by summoned ${card.name})`);
            }
          }
          tile.controlledBy = state.currentTurn;
        }
        addLog(`🐉 Summoned Mythos ${card.name} at (${r+1}, ${c+1})!`);
      } else if (card.category) {
        if (tile) {
          const prevOwner = tile.controlledBy;
          if (prevOwner && prevOwner !== state.currentTurn) {
            const loss = tile.land?.dominionValue || 1;
            if (prevOwner === 1) {
              state.p1DominionTotal = Math.max(0, state.p1DominionTotal - loss);
              addLog(`🔻 Player 1 lost ${loss} Dominion points as territory was colonized!`);
            } else if (prevOwner === 2) {
              state.p2DominionTotal = Math.max(0, state.p2DominionTotal - loss);
              addLog(`🔻 Player 2 lost ${loss} Dominion points as territory was colonized!`);
            }
          }
          tile.land = card;
          tile.controlledBy = state.currentTurn;
        }
        if (state.currentTurn === 1) state.p1Kalayaan += (card.energyBonus || 1);
        else state.p2Kalayaan += (card.energyBonus || 1);
        addLog(`🏔️ Claimed ${card.name} territory! (+${card.energyBonus || 1} Kalayaan bonus).`);
      }

      state.selectedHandCardIndex = null;
      state.validCardPlacements = [];
      state.validEventTargets = [];
      state.validEquipTargets = [];
      playSfx('card_play');
      if (state.gameMode === 'NETWORK_2P') broadcastGameState();
      render();
    }
    window.executeCardPlacement = executeCardPlacement;

    function executeEventCast(r, c) {
      const isP1 = state.currentTurn === 1;
      const hand = isP1 ? state.p1Hand : state.p2Hand;
      const card = hand[state.selectedHandCardIndex];
      if (!card) return;

      const targetUnit = state.units.find(u => u.r === r && u.c === c);
      if (!targetUnit) return;

      const cost = card.cost || 1;
      if (isP1) state.p1Kalayaan -= cost;
      else state.p2Kalayaan -= cost;

      hand.splice(state.selectedHandCardIndex, 1);
      state.graveyard.push(card);

      playSfx('skill');

      targetUnit.card.atk = (targetUnit.card.atk || 5) + 2;
      targetUnit.card.def = (targetUnit.card.def || 2) + 1;
      targetUnit.currentHp = Math.min((targetUnit.card.hp || 20) + 6, targetUnit.currentHp + 4);
      targetUnit.actionsLeft = 1;
      targetUnit.statuses = { poison: 0, bleed: 0, sleep: 0, paralyze: 0 };

      addLog(`✨ Cast [${card.name}] on ${targetUnit.card.name}! (+2 ATK, +1 DEF, +4 HP, cleansed, refreshed)`);

      state.selectedHandCardIndex = null;
      state.validEventTargets = [];
      state.validEquipTargets = [];
      state.validCardPlacements = [];

      if (state.gameMode === 'NETWORK_2P') broadcastGameState();
      render();
    }
    window.executeEventCast = executeEventCast;

    function executeEquipmentAttach(r, c) {
      const isP1 = state.currentTurn === 1;
      const hand = isP1 ? state.p1Hand : state.p2Hand;
      const card = hand[state.selectedHandCardIndex];
      if (!card) return;

      const targetUnit = state.units.find(u => u.r === r && u.c === c);
      if (!targetUnit) return;

      if (!targetUnit.equipments) targetUnit.equipments = [];
      const maxSlots = targetUnit.type === 'HERO' ? 2 : 1;

      if (targetUnit.equipments.length >= maxSlots) {
        addLog(`⚠️ Maximum equipment capacity reached for ${targetUnit.card.name} (${maxSlots} max).`);
        state.selectedHandCardIndex = null;
        state.validEquipTargets = [];
        render();
        return;
      }

      const cost = card.cost || 1;
      if (isP1) state.p1Kalayaan -= cost;
      else state.p2Kalayaan -= cost;

      hand.splice(state.selectedHandCardIndex, 1);

      playSfx('skill');

      targetUnit.card.atk = (targetUnit.card.atk || 5) + (card.atkBoost || 0);
      targetUnit.card.def = (targetUnit.card.def || 2) + (card.defBoost || 0);
      targetUnit.currentHp += (card.hpBoost || 0);
      targetUnit.statuses = { poison: 0, bleed: 0, sleep: 0, paralyze: 0 };

      targetUnit.equipments.push({
        id: card.id,
        name: card.name,
        subTitle: card.subTitle || '',
        atkBoost: card.atkBoost || 0,
        defBoost: card.defBoost || 0,
        hpBoost: card.hpBoost || 0,
        turnsRemaining: card.duration || 2,
        passive: card.passive || '',
        avatarSymbol: card.avatarSymbol || '🛡️'
      });

      addLog(`🛡️ Equipped [${card.name}] onto ${targetUnit.card.name}! [Slot ${targetUnit.equipments.length}/${maxSlots}] (+${card.atkBoost} ATK, +${card.defBoost} DEF, +${card.hpBoost} HP).`);

      state.selectedUnitId = targetUnit.id;
      state.activeCardPreview = targetUnit.card;

      state.selectedHandCardIndex = null;
      state.validEquipTargets = [];
      state.validEventTargets = [];
      state.validCardPlacements = [];

      if (state.gameMode === 'NETWORK_2P') broadcastGameState();
      render();
    }
    window.executeEquipmentAttach = executeEquipmentAttach;

    function endTurn() {
      if (state.gameMode === 'NETWORK_2P') {
        if (state.networkRole === 'HOST' && state.currentTurn !== 1) return;
        if (state.networkRole === 'CLIENT' && state.currentTurn !== 2) return;
      }

      playSfx('card_play');
      const p1Tiles = state.board.filter(t => t.controlledBy === 1);
      const p2Tiles = state.board.filter(t => t.controlledBy === 2);
      state.p1DominionTotal += p1Tiles.reduce((a, t) => a + (t.land?.dominionValue || 1), 0);
      state.p2DominionTotal += p2Tiles.reduce((a, t) => a + (t.land?.dominionValue || 1), 0);

      // Decrement equipment turn counters
      state.units.forEach(u => {
        if (u.equipments && u.equipments.length > 0) {
          u.equipments.forEach(eq => {
            if (eq.turnsRemaining > 0) eq.turnsRemaining--;
          });
        }
      });

      // Apply Status Ailments and decrement durations
      state.units.forEach(u => {
        if (!u.statuses) return;
        if (u.statuses.poison > 0) {
          u.currentHp -= 3;
          u.statuses.poison--;
          addLog(`🧪 ${u.card.name} took 3 Poison damage! (${u.currentHp} HP left)`);
        }
        if (u.statuses.bleed > 0) {
          u.currentHp -= 2;
          u.statuses.bleed--;
          addLog(`🩸 ${u.card.name} took 2 Bleed damage! (${u.currentHp} HP left)`);
        }
        if (u.statuses.sleep > 0) {
          u.actionsLeft = 0;
          u.statuses.sleep--;
          if (u.statuses.sleep === 0) addLog(`☀️ ${u.card.name} woke up from Sleep!`);
        }
        if (u.statuses.paralyze > 0) {
          u.statuses.paralyze--;
          if (u.statuses.paralyze === 0) addLog(`⚡ ${u.card.name} recovered from Paralysis!`);
        }
      });

      // Remove units slain by status damage
      const slain = state.units.filter(u => u.currentHp <= 0);
      slain.forEach(s => {
        state.units = state.units.filter(u => u.id !== s.id);
        state.graveyard.push(s.card);
        addLog(`💀 ${s.card.name} succumbed to status damage!`);
        if (s.type === 'HERO') {
          const winner = s.owner === 1 ? state.p2Hero.name : state.p1Hero.name;
          state.victoryData = { winner, reason: 'HERO CHECKMATE: Commander succumbed to status damage!' };
          state.view = 'VICTORY';
        }
      });

      state.currentTurn = state.currentTurn === 1 ? 2 : 1;
      state.turnNumber++;
      state.weather = getWeatherForTurn(state.turnNumber);
      applyWeatherEffects();

      if (state.p1DominionTotal >= DOMINION_WIN_TARGET) {
        state.victoryData = { winner: state.p1Hero.name, reason: `DOMINION SUPREMACY: ${DOMINION_WIN_TARGET} Dominion points achieved!` };
        state.view = 'VICTORY';
        if (state.gameMode === 'NETWORK_2P') broadcastGameState();
        render();
        return;
      }
      if (state.p2DominionTotal >= DOMINION_WIN_TARGET) {
        state.victoryData = { winner: state.p2Hero.name, reason: `DOMINION SUPREMACY: Enemy achieved ${DOMINION_WIN_TARGET} Dominion points!` };
        state.view = 'VICTORY';
        if (state.gameMode === 'NETWORK_2P') broadcastGameState();
        render();
        return;
      }

      state.units.forEach(u => {
        if (u.owner === state.currentTurn) u.actionsLeft = 1;
      });

      if (state.currentTurn === 1) {
        state.p1Kalayaan = Math.min(10, state.p1Kalayaan + 3);
        if (state.p1Deck.length > 0) state.p1Hand.push(state.p1Deck.shift());
      } else {
        state.p2Kalayaan = Math.min(10, state.p2Kalayaan + 3);
        if (state.p2Deck.length > 0) state.p2Hand.push(state.p2Deck.shift());
        if (state.gameMode === 'AI') {
          setTimeout(runAITurn, 600);
        }
      }

      state.selectedUnitId = null;
      state.selectedHandCardIndex = null;
      state.validMoves = [];
      state.validAttacks = [];
      state.validCardPlacements = [];
      state.validEventTargets = [];
      state.validEquipTargets = [];

      if (state.gameMode === 'NETWORK_2P') {
        broadcastGameState();
      }

      render();
    }
    window.endTurn = endTurn;

    function getAiTileScore(r, c, owner = 2) {
      const tile = state.board.find(t => t.r === r && t.c === c);
      if (!tile) return -999;
      let score = 0;
      const landValue = tile.land?.dominionValue || 1;
      const energyValue = tile.land?.energyBonus || 1;
      score += landValue * 7 + energyValue * 4;
      if (tile.controlledBy === owner) score += 8;
      if (tile.controlledBy && tile.controlledBy !== owner) score -= 10;

      const centerBias = 4 - Math.abs(r - (state.gridSize - 1) / 2) - Math.abs(c - (state.gridSize - 1) / 2);
      score += Math.max(0, centerBias) * 2;

      const nearbyFriendly = state.units.filter(u => u.owner === owner && Math.abs(u.r - r) + Math.abs(u.c - c) <= 2).length;
      const nearbyEnemy = state.units.filter(u => u.owner !== owner && Math.abs(u.r - r) + Math.abs(u.c - c) <= 2).length;
      score += nearbyFriendly * 3;
      score -= nearbyEnemy * 4;

      const enemyHero = state.units.find(u => u.owner !== owner && u.type === 'HERO');
      if (enemyHero) {
        const dist = Math.abs(r - enemyHero.r) + Math.abs(c - enemyHero.c);
        score += Math.max(0, 10 - dist) * 3;
      }

      return score;
    }

    function getAiAttackValue(unit, defender) {
      if (!unit || !defender) return -Infinity;
      const atk = unit.card.atk || 5;
      const def = defender.card.def || 2;
      const hp = defender.currentHp || 0;
      const rawDamage = Math.max(1, atk - Math.floor(def / 3));
      const actualDamage = Math.max(1, rawDamage - Math.max(0, Math.floor((defender.card.def || 0) / 6)));
      const likelyKill = hp <= actualDamage;
      const isHero = defender.type === 'HERO';

      let score = actualDamage * 5;
      if (isHero) score += 22;
      if (likelyKill) score += 18;
      score += Math.max(0, 8 - Math.abs(unit.r - defender.r) - Math.abs(unit.c - defender.c)) * 3;
      score += (defender.currentHp || 0) < (unit.card.atk || 5) ? 6 : 0;
      score -= Math.max(0, (defender.card.atk || 0) - (unit.card.def || 0)) * 2;
      score -= Math.max(0, (unit.currentHp || 0) < (unit.card.hp || 20) * 0.45 ? 10 : 0);
      score -= Math.max(0, (defender.card.hp || 20) - hp) * 0.12;
      return score;
    }

    function getBestAiCardPlay() {
      const hand = state.p2Hand || [];
      let best = null;
      let bestScore = -Infinity;

      hand.forEach((card, idx) => {
        const cost = card.cost || 1;
        if (state.p2Kalayaan < cost) return;

        let score = 0;
        if (card.dominionDamage) score += card.dominionDamage * 4.5 + 8;
        if (card.drawAmount) score += card.drawAmount * 3.4 + 6;
        if (card.id && card.id.startsWith('eq')) {
          const target = state.units.filter(u => u.owner === 2 && (u.type === 'HERO' || u.type === 'MONSTER')).sort((a, b) => (b.currentHp + (b.card.atk || 0)) - (a.currentHp + (a.card.atk || 0)))[0];
          if (target) score += (card.atkBoost || 0) * 2 + (card.defBoost || 0) + (card.hpBoost || 0);
        }
        if (card.hp && !card.category) {
          const strongestTile = [];
          for (let r = 0; r < state.gridSize; r++) {
            for (let c = 0; c < state.gridSize; c++) {
              const occ = state.units.find(u => u.r === r && u.c === c);
              const tile = state.board.find(t => t.r === r && t.c === c);
              if (canDeployCardAt(card, tile, r, c, 2, Boolean(occ))) strongestTile.push({ r, c, score: getAiTileScore(r, c, 2) + 5 });
            }
          }
          const tileBest = strongestTile.sort((a, b) => b.score - a.score)[0];
          score += (tileBest ? tileBest.score : 0) + (card.atk || 0) * 1.2 + (card.hp || 0) * 0.2;
        }
        if (card.category) {
          const bestLandTile = [];
          for (let r = 0; r < state.gridSize; r++) {
            for (let c = 0; c < state.gridSize; c++) {
              const occ = state.units.find(u => u.r === r && u.c === c);
              const tile = state.board.find(t => t.r === r && t.c === c);
              if (canDeployCardAt(card, tile, r, c, 2, Boolean(occ))) bestLandTile.push({ r, c, score: getAiTileScore(r, c, 2) + (card.energyBonus || 1) * 2 });
            }
          }
          const tileBest = bestLandTile.sort((a, b) => b.score - a.score)[0];
          score += (tileBest ? tileBest.score : 0) + (card.dominionValue || 1) * 6;
        }
        if (!card.hp && !card.category && !card.dominionDamage && !card.drawAmount && !card.id.startsWith('eq')) {
          const target = state.units.filter(u => u.owner === 2).sort((a, b) => a.currentHp - b.currentHp)[0];
          if (target) score += 9 + (target.currentHp < 10 ? 16 : 0);
          // buffs and heal cards are strongest when allies are damaged or statused
          state.units.filter(u => u.owner === 2).forEach(unit => {
            if (unit.currentHp < (unit.card.hp || 20) * 0.75) score += 6;
            if (unit.statuses && (unit.statuses.poison || unit.statuses.bleed || unit.statuses.sleep || unit.statuses.paralyze)) score += 8;
          });
        }

        const enemyHero = state.units.find(u => u.owner !== 2 && u.type === 'HERO');
        if (enemyHero && enemyHero.currentHp < 18) {
          score += 10;
        }

        if (card.name && /heal|restore|regenerate|boost|fortify|shield|rise|rally|ward|resolve|command/i.test(card.name)) {
          const woundedAlly = state.units.filter(u => u.owner === 2).some(u => u.currentHp <= (u.card.hp || 20) * 0.7);
          if (woundedAlly) score += 10;
        }

        if (score > bestScore) {
          bestScore = score;
          best = { idx, card, score };
        }
      });

      return best;
    }

    function runAITurn() {
      if (state.view === 'VICTORY') return;

      let step = 0;
      while (step < 18 && state.view !== 'VICTORY') {
        step += 1;

        const bestHandCard = getBestAiCardPlay();
        if (bestHandCard && bestHandCard.score > 10) {
          const { idx, card } = bestHandCard;
          const cost = card.cost || 1;
          const currentHand = state.p2Hand;
          const selected = currentHand[idx];
          if (!selected) break;

          if (card.dominionDamage && state.p2Kalayaan >= cost) {
            state.selectedHandCardIndex = idx;
            executeDominionSiege(idx);
            continue;
          }

          if (card.drawAmount && state.p2Kalayaan >= cost) {
            state.selectedHandCardIndex = idx;
            executeDrawEvent(idx);
            continue;
          }

          if (card.id && card.id.startsWith('eq')) {
            const targetUnit = state.units.filter(u => u.owner === 2).sort((a, b) => {
              const aPower = (a.card.atk || 0) + (a.card.def || 0) + (a.currentHp || 0);
              const bPower = (b.card.atk || 0) + (b.card.def || 0) + (b.currentHp || 0);
              return bPower - aPower;
            })[0];
            if (targetUnit && (targetUnit.equipments || []).length < (targetUnit.type === 'HERO' ? 2 : 1)) {
              state.selectedHandCardIndex = idx;
              executeEquipmentAttach(targetUnit.r, targetUnit.c);
              continue;
            }
          }

          if (!card.hp && !card.category && !card.dominionDamage && !card.drawAmount && !card.id.startsWith('eq')) {
            const healTarget = state.units
              .filter(u => u.owner === 2)
              .sort((a, b) => (a.currentHp / (a.card.hp || 20)) - (b.currentHp / (b.card.hp || 20)))[0];
            if (healTarget) {
              state.selectedHandCardIndex = idx;
              executeEventCast(healTarget.r, healTarget.c);
              continue;
            }
          }

          if (card.hp || card.category) {
            const candidates = [];
            for (let r = 0; r < state.gridSize; r++) {
              for (let c = 0; c < state.gridSize; c++) {
                const occupied = state.units.some(u => u.r === r && u.c === c);
                const tile = state.board.find(t => t.r === r && t.c === c);
                if (canDeployCardAt(card, tile, r, c, 2, occupied)) {
                  candidates.push({ r, c, score: getAiTileScore(r, c, 2) });
                }
              }
            }
            if (candidates.length) {
              candidates.sort((a, b) => b.score - a.score);
              state.selectedHandCardIndex = idx;
              executeCardPlacement(candidates[0].r, candidates[0].c);
              continue;
            }
          }
        }

        const aiUnits = state.units.filter(u => u.owner === 2 && (u.actionsLeft || 0) > 0 && !(u.statuses && u.statuses.sleep > 0));
        if (!aiUnits.length) break;

        let bestDecision = null;
        aiUnits.forEach(unit => {
          const enemyUnits = state.units.filter(u => u.owner !== 2);
          const validTargets = [];

          enemyUnits.forEach(defender => {
            const dist = Math.abs(unit.r - defender.r) + Math.abs(unit.c - defender.c);
            if (dist <= (unit.card.move || 1) + 1) {
              validTargets.push({ defender, score: getAiAttackValue(unit, defender) });
            }
          });

          if (validTargets.length) {
            validTargets.sort((a, b) => b.score - a.score);
            const bestTarget = validTargets[0];
            const threatModifier = unit.currentHp < (unit.card.hp || 20) * 0.5 ? -5 : 0;
            if (!bestDecision || bestTarget.score + threatModifier > bestDecision.score) {
              bestDecision = {
                type: 'attack',
                unit,
                defender: bestTarget.defender,
                score: bestTarget.score + 5 + threatModifier
              };
            }
          }

          const moveOptions = [];
          for (let r = 0; r < state.gridSize; r++) {
            for (let c = 0; c < state.gridSize; c++) {
              const dist = Math.abs(r - unit.r) + Math.abs(c - unit.c);
              const tile = state.board.find(t => t.r === r && t.c === c);
              if (dist <= Math.min(unit.card.move || 1, getTerrainMoveAllowance(unit, tile)) && dist > 0 && canUnitUseTerrain(unit, tile)) {
                const occ = state.units.find(u => u.r === r && u.c === c);
                if (!occ) {
                  let moveScore = getAiTileScore(r, c, 2);
                  const enemyThreat = enemyUnits.some(defender => Math.abs(r - defender.r) + Math.abs(c - defender.c) <= 1);
                  const canAttackAfterMove = enemyUnits.some(defender => Math.abs(r - defender.r) + Math.abs(c - defender.c) <= 2);
                  moveScore += canAttackAfterMove ? 9 : 0;
                  moveScore -= enemyThreat && unit.currentHp < (unit.card.hp || 20) * 0.6 ? 10 : 0;
                  const enemyHero = enemyUnits.find(u => u.type === 'HERO');
                  if (enemyHero) {
                    const heroDist = Math.abs(r - enemyHero.r) + Math.abs(c - enemyHero.c);
                    if (heroDist <= 2) moveScore += 12;
                  }
                  moveOptions.push({ r, c, score: moveScore });
                }
              }
            }
          }

          if (moveOptions.length) {
            moveOptions.sort((a, b) => b.score - a.score);
            const bestMove = moveOptions[0];
            const attackAfterMove = enemyUnits.some(defender => {
              const dist = Math.abs(bestMove.r - defender.r) + Math.abs(bestMove.c - defender.c);
              return dist <= 2;
            });
            const moveScore = bestMove.score + (attackAfterMove ? 8 : 0) + ((unit.currentHp || 0) < (unit.card.hp || 20) * 0.5 ? 3 : 0);
            if (!bestDecision || moveScore > bestDecision.score) {
              bestDecision = { type: 'move', unit, target: bestMove, score: moveScore };
            }
          }
        });

        if (!bestDecision) break;

        if (bestDecision.type === 'attack') {
          const { unit, defender } = bestDecision;
          state.selectedUnitId = unit.id;
          if (detectUnitAilment(unit)) {
            startStatusCoinToss(unit, defender, detectUnitAilment(unit));
            break;
          }
          triggerAttackCombat(unit, defender);
          continue;
        }

        const { unit, target } = bestDecision;
        unit.r = target.r;
        unit.c = target.c;
        unit.actionsLeft = 0;
